      T.style.fill = b.enraged ? 0xffb09a : b.color;
      setFs(T, uiTouch ? 8 : 11);
      T.position.set(bx - 12, byTop + bi * (bh + gap) + bh / 2);
    });
  }
}

function updateMarkers(){
  let n = 0;
  if(state.mode !== 'playing' && state.mode !== 'cards'){
    for(const m of MARKERS) m.visible = false;
    return;
  }
  const pad = 34;
  const hw = W / 2 - pad, hh = H / 2 - pad;
  for(const e of enemies){
    if(n >= MARKERS.length) break;
    const sx = (e.x - cam.x) * cam.zoom;
    const sy = (e.y - cam.y) * cam.zoom;
    if(sx > pad && sx < W - pad && sy > pad && sy < H - pad) continue;
    const dxs = sx - W / 2, dys = sy - H / 2;
    const t = Math.min(hw / (Math.abs(dxs) || 1e-6), hh / (Math.abs(dys) || 1e-6));
    const px = W / 2 + dxs * t, py = H / 2 + dys * t;
    const m = MARKERS[n++];
    m.visible = true;
    m.position.set(px, py);
    m.rotation = Math.atan2(dys, dxs) + Math.PI / 2;
    m.scale.set(e.type === 'boss' ? 0.75 : e.elite ? 0.55 : 0.45);
    m.tint = e.elite ? 0xffc83d : e.color;
    m.alpha = e.type === 'boss' ? 0.95 : 0.5 + 0.25 * Math.sin(state.time * 6 + e.wob);
  }
  for(let i = n; i < MARKERS.length; i++) MARKERS[i].visible = false;
}

function textLine(str, size, color, weight = '700', wrapW = 176){

  t.anchor.set(0, 0);
  return t;
}

function moveSel(d){
  const n = state.offer.length;
  if(!n) return;
  state.sel = (state.sel + d + n) % n;
  applyCardHighlight();
  SFX.card();
}

function applyCardHighlight(){
  for(const it of CARD_UI){
    const on = it.i === state.sel;
    const tc = it.col, dc = it.dc;
    const w = it.w, h = it.h;
    const g = it.g;
    g.clear();
    // 面板：深色底 + 品质色描边（对齐参考版技能格的霓虹观感）
    g.roundRect(0, 0, w, h, 12)
      .fill({ color: 0x0a0e1a, alpha: on ? 0.94 : 0.86 })
      .stroke({ width: on ? 2.4 : 1.2, color: tc, alpha: on ? 0.95 : 0.38 });
    // 顶部品质带（上半圆角 + 下半补方）
    g.roundRect(0, 0, w, 32, 12).fill({ color: tc, alpha: on ? 0.20 : 0.09 });
    g.rect(0, 16, w, 16).fill({ color: tc, alpha: on ? 0.20 : 0.09 });
    g.moveTo(0, 32.5).lineTo(w, 32.5).stroke({ width: 1, color: tc, alpha: on ? 0.55 : 0.22 });
    // 品质带右端菱形
    g.moveTo(w - 22, 9).lineTo(w - 15, 16).lineTo(w - 22, 23).lineTo(w - 29, 16)
      .closePath().fill({ color: tc, alpha: on ? 0.9 : 0.35 });
    // 左侧卡色条
    g.rect(0, 42, 3, h - 128).fill({ color: dc, alpha: on ? 0.95 : 0.4 });
    // 描述区与底部分隔线
    g.moveTo(14, h - 92).lineTo(w - 14, h - 92).stroke({ width: 1, color: 0xffffff, alpha: on ? 0.14 : 0.07 });
    // 副作用警示条
    if(it.side){
      g.roundRect(12, h - 84, w - 24, 42, 6)
        .fill({ color: 0xff2d55, alpha: on ? 0.13 : 0.08 })
        .stroke({ width: 1, color: 0xff6b8f, alpha: on ? 0.55 : 0.3 });
    }
    // 四角括号
    const bl = 15, bi = 7;
    g.moveTo(bi, bi + bl).lineTo(bi, bi).lineTo(bi + bl, bi)
      .moveTo(w - bi - bl, bi).lineTo(w - bi, bi).lineTo(w - bi, bi + bl)
      .moveTo(bi, h - bi - bl).lineTo(bi, h - bi).lineTo(bi + bl, h - bi)
      .moveTo(w - bi - bl, h - bi).lineTo(w - bi, h - bi).lineTo(w - bi, h - bi - bl)
      .stroke({ width: on ? 2.4 : 1.4, color: tc, alpha: on ? 1 : 0.3 });
    it.hint.text = on ? `▶ [ ${it.i + 1} ]` : `[ ${it.i + 1} ]`;
    it.hint.style.fill = on ? tc : 0x5d6b7d;
    if(it.ring) it.ring.alpha = on ? 0.85 : 0;
  }
}

    }

    CARD_UI.push({ i, col: tc, dc, g, glow, holder, hint: hintT, ring, side: !!o.def.s,
      w: CW, h: CH, cx, baseY: cy, born: state.time + i * 0.08, curScale: 1 });
    CARD_RECTS.push({ x: cx, y: cy, w: CW, h: CH, i });
  });

  cardUI.scale.set(scale);
  if(scale < 1) cardUI.position.set((W - W * scale) / 2, (H - H * scale) / 2);

  // 鼠标命中：在 cardUI 上做手动矩形测试（半透明子元素可能拦截 Pixi 事件派发，
  // 手动测试不受遮挡影响，三张卡均可稳定点选/悬停）
  cardUI.eventMode = 'static';
  cardUI.hitArea = new Pixi.Rectangle(0, 0, W, H);
  const hitCard = ev => {
    const pt = cardUI.toLocal(ev.global);
    for(const r of CARD_RECTS){
      if(pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h) return r.i;
    }
    return -1;
  };
  cardUI.on('pointerdown', ev => {
    const i = hitCard(ev);
    if(i >= 0){ pickOffer(i); return; }
    // 触屏端没有 ESC：技能替换时点空白处视为放弃
    if(isTouchDevice && state.pendingSkill){
      state.pendingSkill = null;
      addFloat(player.x, player.y - 58, '已放弃新技能', 0x9fb0c8, 14);
      settlePick();
    }
  });
  cardUI.on('pointermove', ev => {
    const i = hitCard(ev);
    if(i >= 0 && i !== state.sel){ state.sel = i; applyCardHighlight(); }
  });
  applyCardHighlight();
}

function clearCardUI(){
  if(cardUI){
    hudLayer.removeChild(cardUI);
    cardUI.destroy({ children: true });
    cardUI = null;
  }
  CARD_RECTS.length = 0;
  CARD_UI.length = 0;
}

// 按参考尺寸一次性排版（面板原点 = 容器原点）；resize 只整体缩放，见 layoutScreens
function buildIntro(){
  const con = SCR.intro;
  const PW = 1100, PAD = 30, HEADER = 66, FOOTER = 48, COLGAP = 28, SECGAP = 20;
  const contentW = PW - PAD * 2;
  const colW = (contentW - COLGAP) / 2;
  const mk = (text, size, color, extra) => new Pixi.Text({
    text, style: Object.assign({ fontFamily: '"Courier New", monospace', fontSize: size, fontWeight: 'bold', fill: color }, extra || {})
  });

  // 页眉 / 底板（底板最后画，先占位保证层级在最下）
  const deco = new Pixi.Graphics();
  con.addChild(deco);
  const iTitle = mk('玩 法 说 明', 24, 0xffe45c);
  neon(iTitle, 0xffe45c, 14);
  iTitle.position.set(PAD, 14);
  con.addChild(iTitle);
  const iVer = mk('NEON PINBALL · v4', 13, 0x5d6b7d);
  iVer.anchor.set(1, 0);
  iVer.position.set(PW - PAD, 22);
  con.addChild(iVer);

  // 节：标题栏 + 条目流
  const buildSection = (def, SW) => {
    const box = new Pixi.Container();
    const g = new Pixi.Graphics();
    box.addChild(g);
    g.rect(0, 4, 5, 18).fill({ color: def.color });
    g.rect(0, 32, SW, 1).fill({ color: def.color, alpha: 0.22 });
    const ht = mk(def.title, 17, def.color);
    neon(ht, def.color, 9);
    ht.position.set(14, 0);
    box.addChild(ht);
    const headH = 42;
    const innerCols = def.cols || 1;
    const icw = (SW - (innerCols - 1) * 22) / innerCols;
    const colYs = [];
    for(let i = 0; i < innerCols; i++) colYs.push(headH);
    let spanY = headH;
    for(const it of def.items){
      if(it.span) spanY = Math.max(spanY, Math.max.apply(null, colYs));
      const ci = it.span ? -1 : colYs.indexOf(Math.min.apply(null, colYs));
      const ix = it.span ? 0 : ci * (icw + 22);
      const iw = it.span ? SW : icw;
      const iy = it.span ? spanY : colYs[ci];
      const row = new Pixi.Container();
      row.position.set(ix, iy);
      const rg = new Pixi.Graphics();
      row.addChild(rg);
      let cx = 0, rowH = 24;
      if(it.keys){
        for(const k of it.keys){
          const kt = mk(k, 12, 0xdff6ff);
          const kw = Math.max(22, kt.width + 14);
          rg.roundRect(cx, 1, kw, 20, 5).fill({ color: 0x0a1220, alpha: 0.95 }).stroke({ width: 1.2, color: def.color, alpha: 0.55 });
          kt.anchor.set(0.5, 0.5);
          kt.position.set(cx + kw / 2, 11);
          row.addChild(kt);
          cx += kw + 5;
        }
        cx += 7;
      } else {
        rg.rect(3, 8, 5, 5).fill({ color: it.color || def.color, alpha: 0.9 });
        cx = 15;
      }
      const tt = mk(it.text, 14, it.color || 0xc8e6ff, { wordWrap: true, wordWrapWidth: iw - cx, lineHeight: 19 });
      tt.position.set(cx, 2);
      row.addChild(tt);
      rowH = Math.max(rowH, tt.height + 7);
      if(it.dim){
        const dt = mk(it.dim, 13, 0x8fa3bd, { wordWrap: true, wordWrapWidth: iw - cx, lineHeight: 18 });
        if(cx + tt.width + 12 + dt.width <= iw && tt.height <= 20){
          dt.position.set(cx + tt.width + 12, 3);
        } else {
          dt.position.set(cx, 5 + tt.height);
          rowH = Math.max(rowH, tt.height + 5 + dt.height + 7);
        }
        row.addChild(dt);
      }
      box.addChild(row);
      if(it.span){ spanY += rowH; for(let i = 0; i < colYs.length; i++) colYs[i] = Math.max(colYs[i], spanY); }
      else colYs[ci] += rowH;
    }
    return { box, h: Math.max(spanY, Math.max.apply(null, colYs)) + 2 };
  };

  // 文档流：普通节进双栏（贪心放矮列），wide 节通栏
  let yCur = HEADER, block = null;
  const flush = () => { if(block){ yCur = Math.max(yCur, block.y0 + Math.max(block.hs[0], block.hs[1])); block = null; } };
  for(const def of INTRO_SECTIONS){
    if(def.wide){
      flush();
      yCur += 4;
      const b = buildSection(def, contentW);
      b.box.position.set(PAD, yCur);
      con.addChild(b.box);
      yCur += b.h;
    } else {
      if(!block) block = { y0: yCur, hs: [0, 0] };
      const b = buildSection(def, colW);
      const ci = block.hs[0] <= block.hs[1] ? 0 : 1;
      b.box.position.set(PAD + ci * (colW + COLGAP), block.y0 + block.hs[ci]);
      con.addChild(b.box);
      block.hs[ci] += b.h + SECGAP;
    }
  }
  flush();
  const PH = yCur + FOOTER;

  // 面板 / 页眉带 / 四角括号
  deco.roundRect(0, 0, PW, PH, 14).fill({ color: 0x0a0e1a, alpha: 0.94 }).stroke({ width: 1.4, color: 0x5ffbf1, alpha: 0.5 });
  deco.roundRect(0, 0, PW, 52, 14).fill({ color: 0xffe45c, alpha: 0.09 });
  deco.rect(0, 26, PW, 26).fill({ color: 0xffe45c, alpha: 0.09 });
  deco.rect(0, 52, PW, 1).fill({ color: 0xffe45c, alpha: 0.35 });
  const bl = 16, bi = 8;
  deco.moveTo(bi, bi + bl).lineTo(bi, bi).lineTo(bi + bl, bi)
      .moveTo(PW - bi - bl, bi).lineTo(PW - bi, bi).lineTo(PW - bi, bi + bl)
      .moveTo(bi, PH - bi - bl).lineTo(bi, PH - bi).lineTo(bi + bl, PH - bi)
      .moveTo(PW - bi - bl, PH - bi).lineTo(PW - bi, PH - bi).lineTo(PW - bi, PH - bi - bl)
      .stroke({ width: 1.2, color: 0xffe45c, alpha: 0.45 });

  // 返回提示（文案随设备切换，在 layoutScreens 里更新）
  const iBack = mk('', 13, 0x6d7f96);
  iBack.anchor.set(0.5, 0);
  iBack.position.set(PW / 2, PH - 32);
  con.addChild(iBack);

  SCR.intro._parts = { back: iBack, pw: PW, ph: PH };
}

  SCR.intro.position.set((W - ip.pw * isc) / 2, (H - ip.ph * isc) / 2);

function scrGlow(i, x, y, w, h, color, a){
  const g = SCR.glows && SCR.glows[i];
  if(!g) return;
  g.visible = a > 0.01;
  g.position.set(x, y);
  g.scale.set(Math.max(0.02, w / 64), Math.max(0.02, h / 64));
  g.tint = color;
  g.alpha = a;
}

function syncScreens(){
  ghEl.style.display = (state.mode === 'title' || state.mode === 'dead') ? 'block' : 'none';
  SCR.title.visible = state.mode === 'title';
  SCR.intro.visible = state.mode === 'intro';
  SCR.introDim.visible = state.mode === 'intro';
  SCR.dead.visible = state.mode === 'dead';
  SCR.pause.visible = state.mode === 'paused';
  if(SCR.glows) for(const g of SCR.glows) g.visible = false;
  if(state.mode === 'paused'){
    const pp = SCR.pause._parts;
    pp.p2.alpha = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(performance.now() / 300));
    scrGlow(3, W / 2, H / 2 - 42, 430, 160, 0x5ffbf1, 0.12);
  }
  if(state.mode === 'title'){
    const pulse = 0.5 + 0.5 * Math.sin(state.time * 3.4);
    const p = SCR.title._parts;
    p.go.alpha = 0.4 + pulse * 0.6;
    p.tip.alpha = 0.55 + pulse * 0.45;
    // 标题/副标题/提示改由 Text.dropShadow 发光，这里只留一层环境光
    scrGlow(2, W / 2, H / 2 + 20, W * 0.42, 180, 0x5ffbf1, 0.10);
  }
  if(state.mode === 'intro'){
    scrGlow(1, W / 2, H / 2, W * 0.55, H * 0.6, 0x5ffbf1, 0.10);
  }
  if(state.mode === 'dead'){
    const d = SCR.dead._parts;
    scrGlow(5, W / 2, d.d2.y + 62, 480, 170, 0x5ffbf1, 0.14);
    d.d2.text =
      `得分  ${state.score}\n最高分  ${state.best}\n抵达波次  ${state.wave} · 等级 ${state.level} · 卡牌 ${state.cards.length}`;
  }
}

// ---------------- 主循环 ----------------
let lastT = 0;

function frame(ticker){
  const rawMs = ticker.deltaMS || 16.7;
  const raw = Math.min(0.05, rawMs / 1000);
  let dt = raw;

  if(state.hitStop > 0){
    state.hitStop = Math.max(0, state.hitStop - raw);
    dt *= 0.25;
  }

  update(dt);

  // 摄像机 / 世界
  const sh = state.shake;
  const shx = sh > 0.3 ? rand(-sh, sh) : 0;
  const shy = sh > 0.3 ? rand(-sh, sh) : 0;
  worldLayer.scale.set(cam.zoom);
  worldLayer.position.set(-cam.x * cam.zoom + shx, -cam.y * cam.zoom + shy);

  syncBackground();
  syncStars();
  syncWallPulses();
  syncWalls();
  drawMapFx();
  syncPillars();
  syncStorms();
  syncPickups();
  syncEnemies();
  syncBullets();
  syncRings();
  syncParticles();
  syncSparks();
  updatePlayerVisual();

  grow.clear();
  if(state.mode !== 'title'){
    // 地面网格
    const s = 64;
    const vx0 = cam.x - s, vy0 = cam.y - s;
    const vx1 = cam.x + W / cam.zoom + s, vy1 = cam.y + H / cam.zoom + s;
    const startX = Math.floor(vx0 / s) * s + (state.time * 14) % s;
    for(let x = startX; x < vx1; x += s){ grow.moveTo(x, vy0); grow.lineTo(x, vy1); }
    const startY = Math.floor(vy0 / s) * s + (state.time * 14) % s;
    for(let y = startY; y < vy1; y += s){ grow.moveTo(vx0, y); grow.lineTo(vx1, y); }
    grow.stroke({ width: 1, color: 0x1de9ff, alpha: 0.10 });
  }
  PV.group.forEach(s => { if(state.mode === 'title' || state.mode === 'intro') s.visible = false; });

  // HUD
  const showHud = state.mode === 'playing' || state.mode === 'cards' || state.mode === 'paused';
  hudG.visible = showHud;
  for(const k in HT) HT[k].visible = showHud;
  if(HS.sheen) HS.sheen.visible = showHud;
  textHUD.visible = showHud;
  for(const t of textHUD.skills) t.visible = showHud;
  for(const t of textHUD.skillsName) t.visible = showHud;
  for(const t of textHUD.skillsCd) t.visible = showHud;
  for(const t of textHUD.actKey) t.visible = showHud;
  for(const t of textHUD.actName) t.visible = showHud;
  for(const t of textHUD.actCd) t.visible = showHud;
  if(!showHud){
    for(const b of HS.skBox) b.visible = false;
    HS.skOn.visible = false;
    HS.barHP.visible = HS.barEN.visible = HS.barXP.visible = false;
    if(HS.sweep) HS.sweep.visible = false;
  }
  if(showHud) drawHUD(dt);
  updateMarkers();
  if(state.mode === 'cards' && CARD_UI.length){
    if(cardUI && cardUI._tGlow) cardUI._tGlow.alpha = 0.09 + 0.05 * Math.sin(state.time * 3);
    for(const it of CARD_UI){
      if(it.ring) it.ring.rotation = state.time * 0.9;
      const on = it.i === state.sel;
      const tIn = clamp((state.time - it.born) / 0.42, 0, 1);
      const ease = 1 - Math.pow(1 - tIn, 3);
      it.curScale = lerp(it.curScale, on ? 1.05 : 1, 1 - Math.exp(-14 * dt));
      it.holder.scale.set(it.curScale);
      it.holder.position.set(it.cx + it.w / 2, it.baseY + it.h / 2 + (1 - ease) * 42);
      it.holder.alpha = ease;
      it.glow.alpha = (on ? 0.16 + 0.07 * Math.sin(state.time * 5.5) : 0.045) * ease;
    }
  }
  syncScreens();
  syncTouch();

  // 屏幕效果
  dangerEl.style.opacity = state.mode === 'playing'
    ? String(clamp(1 - player.hp / (player.maxHp * 0.35), 0, 1) * (0.6 + 0.4 * Math.sin(state.time * 7)))
    : '0';
  flashEl.style.opacity = String(clamp(state.flash * 1.1, 0, 0.55));
  novaEl.style.opacity = String(clamp(state.novaFlash * 1.2, 0, 0.6));

  // 性能自适应
  perf.ema = perf.ema * 0.94 + rawMs * 0.06;
  if(state.time - perf.lastCheck > 2){
    perf.lastCheck = state.time;
    if(!perf.low && perf.ema > 22){
      perf.low = true;
      state.particleCap = 420;
    }
    if(!perf.resDropped && perf.ema > 30){
      perf.resDropped = true;
      try { app.renderer.resolution = 1; app.renderer.resize(W, H); } catch(e){}
    }
  }
}

  app.stage.on('pointertap', () => {
    if(state.mode === 'title'){ audioInit(); tryFullscreen(); startGame(); }
    else if(state.mode === 'intro'){ audioInit(); state.mode = 'title'; }
    else if(state.mode === 'dead'){ audioInit(); tryFullscreen(); startGame(); }
  });

  player.x = world.w / 2;
  player.y = world.h / 2;
  makePillars();
  makeNebulae();
  makeDust();
  cam.x = clamp(player.x - W / 2, 0, Math.max(0, world.w - W));
  cam.y = clamp(player.y - H / 2, 0, Math.max(0, world.h - H));

  lastT = performance.now();
  app.ticker.add(frame);
}

try { main(); } catch(e){ console.error(e); }
</script>
