<style>
  html,body{margin:0;padding:0;height:100%;height:100dvh;overflow:hidden;background:#05060d;touch-action:none;}
  body{position:fixed;inset:0;width:100%;}
  canvas{display:block;position:absolute;inset:0;}
  *{user-select:none;-webkit-tap-highlight-color:transparent;}
  .ovl{position:absolute;inset:0;pointer-events:none;}
  #vig{background:radial-gradient(circle at center, rgba(0,0,0,0) 34%, rgba(0,0,0,0.75) 125%);}
  #danger{background:radial-gradient(circle at center, rgba(255,20,60,0) 30%, rgba(255,20,60,0.55) 110%);opacity:0;}
  #flash{background:#ff2d55;opacity:0;mix-blend-mode:screen;}
  #scan{background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.045) 0 1px, rgba(0,0,0,0) 1px 3px);opacity:0.5;mix-blend-mode:overlay;}
  #nova{background:radial-gradient(ellipse at center, rgba(255,255,255,0.5) 0%, rgba(150,235,255,0.16) 45%, rgba(0,0,0,0) 78%);opacity:0;mix-blend-mode:screen;}
  #sweep{background:linear-gradient(to bottom, rgba(140,240,255,0) 0%, rgba(140,240,255,0.06) 42%, rgba(140,240,255,0.13) 50%, rgba(140,240,255,0.06) 58%, rgba(140,240,255,0) 100%);height:32%;mix-blend-mode:screen;animation:sw 7.5s linear infinite;}
  @keyframes sw{0%{transform:translateY(-40%)}100%{transform:translateY(330%)}}
  #err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#ff6b8f;
       font:700 15px "Courier New",monospace;text-align:center;padding:24px;}
  /* ---- 触屏控制（移动端横屏：左摇杆 + 右按钮） ---- */

    font-family:"Courier New",monospace;-webkit-touch-callout:none;}
  body.isTouch #touchUI{display:block;}
  #joyZone{position:absolute;left:0;top:0;width:44%;height:100%;pointer-events:none;touch-action:none;}
  #touchUI.on #joyZone{pointer-events:auto;}
  #joyBase{position:absolute;left:16%;top:74%;width:28vh;height:28vh;margin:-14vh 0 0 -14vh;

  #joyKnob{position:absolute;left:50%;top:50%;width:12.5vh;height:12.5vh;margin:-6.25vh 0 0 -6.25vh;border-radius:50%;

    font-weight:700;color:#c8e6ff;text-align:center;pointer-events:auto;touch-action:none;

  .tbtn:active{background:rgba(95,251,241,0.30);}
  .tbtn.down{transform:scale(0.86);background:rgba(95,251,241,0.35);box-shadow:0 0 3vh rgba(95,251,241,0.55);}
  #btnPause.down{transform:translateX(-50%) scale(0.86);}
  /* 王者荣耀式扇形布局：射击=大普攻钮贴右下，冲刺/过载/修复沿内弧(半径19vh)均匀扇开 */
  #btnFire{right:2.5vw;bottom:3.5vh;width:20vh;height:20vh;font-size:3.8vh;color:#5ffbf1;}
  #btnDash{right:calc(2.5vw + 22vh);bottom:11.5vh;width:13vh;height:13vh;font-size:2.8vh;color:#7fb8ff;border-color:rgba(127,184,255,0.55);}
  #btnHeal{right:calc(2.5vw + 1.9vh);bottom:26.8vh;width:11vh;height:11vh;font-size:2.6vh;color:#5affc8;border-color:rgba(90,255,200,0.55);}
  #btnOverload{right:calc(2.5vw + 15vh);bottom:23.7vh;width:11vh;height:11vh;font-size:2.5vh;color:#ffe45c;border-color:rgba(255,228,92,0.55);}
  #btnPause{display:none;left:50%;bottom:1.2vh;transform:translateX(-50%);width:10vh;height:4.2vh;
    border-radius:1.2vh;font-size:2vh;color:#9fb0c8;border-color:rgba(159,176,200,0.5);}
  /* 常驻技能：外弧(半径31vh)小圆钮，沿扇形继续向左延伸 */
  .skbtn{width:6.5vh;height:6.5vh;font-size:1.5vh;border-radius:50%;line-height:1.2;padding:1px;}
  #sk0{right:calc(2.5vw + 29.8vh);bottom:31vh;}
  #sk1{right:calc(2.5vw + 35.1vh);bottom:22.9vh;}

  #rotateHint{display:none;position:fixed;inset:0;z-index:20;background:rgba(3,5,12,0.94);
    color:#5ffbf1;align-items:center;justify-content:center;text-align:center;
    font:700 17px "Courier New",monospace;line-height:2;padding:24px;}
  @media (orientation: portrait){ body.isTouch #rotateHint{display:flex;} }
  /* 项目地址（标题/结算页底部） */

<script>
"use strict";

/* ==========================================================
   弹核球 NEON PINBALL   v4
   渲染：PixiJS v8（预烘焙发光贴图 + 对象池，彻底去掉 shadowBlur）
   WASD 移动 / J 射击 / K 冲刺 / H 修复 / 空格 过载        （L 场域已移除）
   冲刺：撞人没撞死 CD -15% · 撞死 CD -80%（每个敌人每次冲刺结算一次）
   移动端横屏：左侧虚拟摇杆移动 · 右侧按钮 射击/冲刺/修复/过载 · 左侧竖排 常驻技能
   v4：性能重构 · 等级经验 · 升级三选一强化卡（69 种效果 × 5 阶，必出一张常驻技能卡，部分带副作用）
   ========================================================== */

// ---------------- 音频引擎 ----------------
let actx = null, master = null, noiseBuf = null;
const sfxGate = {};

function audioInit(){
  if(actx){ if(actx.state === 'suspended') actx.resume(); return; }
  try{
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.gain.value = 0.3;
    master.connect(actx.destination);
  }catch(e){ /* 无声也可玩 */ }
}
function gate(key, ms){
  const t = performance.now();
  if(sfxGate[key] !== undefined && t - sfxGate[key] < ms) return false;
  sfxGate[key] = t;
  return true;
}
function tone(freq, dur, type = 'square', vol = 0.25, slideTo = null){
  if(!actx) return;
  const t0 = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  o.connect(g); g.connect(master);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function noiseHit(dur, vol, freq, q = 1){
  if(!actx) return;
  if(!noiseBuf){
    noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate * 0.6), actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t0 = actx.currentTime;
  const s = actx.createBufferSource();
  s.buffer = noiseBuf;
  const f = actx.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = actx.createGain();
  s.connect(f); f.connect(g); g.connect(master);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.start(t0); s.stop(t0 + dur + 0.02);
}

const SFX = {
  shoot(){ if(!gate('shoot', 45)) return; tone(780, 0.06, 'square', 0.07, 240); },
  bounce(){ if(!gate('bounce', 55)) return; tone(1100 + Math.random() * 400, 0.045, 'sine', 0.05, 500); },
  hit(){ if(!gate('hit', 40)) return; noiseHit(0.08, 0.15, 1900, 1.4); tone(430, 0.05, 'sawtooth', 0.05, 180); },
  kill(){ if(!gate('kill', 28)) return; tone(540, 0.2, 'triangle', 0.16, 80); noiseHit(0.16, 0.13, 900, 0.8); },
  dash(){ tone(170, 0.2, 'sawtooth', 0.12, 850); },
  hurt(){ tone(150, 0.26, 'sawtooth', 0.18, 55); },
  heal(){ tone(520, 0.13, 'sine', 0.16); setTimeout(() => tone(790, 0.17, 'sine', 0.16), 85); },
  overload(){ tone(190, 0.5, 'sawtooth', 0.17, 1500); },
  wave(){ tone(310, 0.16, 'square', 0.12); setTimeout(() => tone(470, 0.16, 'square', 0.12), 120); setTimeout(() => tone(640, 0.26, 'square', 0.12), 240); },
  dead(){ tone(380, 1.0, 'sawtooth', 0.2, 45); },
  pillar(){ if(!gate('pillar', 50)) return; tone(900, 0.05, 'sine', 0.06, 400); },
  pickup(){ tone(920, 0.06, 'sine', 0.08, 1400); },
  power(){ tone(660, 0.1, 'triangle', 0.12, 990); setTimeout(() => tone(990, 0.15, 'triangle', 0.12, 1400), 70); },
  chain(){ if(!gate('chain', 60)) return; noiseHit(0.18, 0.12, 700, 0.6); tone(260, 0.2, 'sawtooth', 0.1, 70); },
  clear(){ [520, 660, 880, 1180].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'triangle', 0.13), i * 90)); },
  nova(){ tone(240, 0.3, 'square', 0.14, 1200); noiseHit(0.25, 0.12, 1600, 0.6); },
  shieldUp(){ tone(660, 0.2, 'sine', 0.14, 1320); },
  shieldBreak(){ tone(900, 0.18, 'triangle', 0.14, 200); },
  split(){ if(!gate('split', 60)) return; tone(330, 0.14, 'square', 0.1, 220); },
  stormWarn(){ if(!gate('storm', 400)) return; tone(70, 0.5, 'sawtooth', 0.05, 180); },
  stormBlast(){ noiseHit(0.28, 0.14, 320, 0.5); tone(140, 0.3, 'sawtooth', 0.12, 40); },
  charge(){ tone(200, 0.4, 'square', 0.12, 700); },
  levelup(){ [660, 880, 1170].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'triangle', 0.12), i * 80)); },
  card(){ tone(880, 0.08, 'sine', 0.1, 1400); },
  coucou(){ tone(620, 0.28, 'sine', 0.12, 300); setTimeout(() => tone(880, 0.2, 'sine', 0.08, 460), 90); },
  piggy(){ if(!gate('piggy', 200)) return; tone(240, 0.22, 'square', 0.09, 150); noiseHit(0.1, 0.05, 900, 2); }
};

// ---------------- 启动：解析 Pixi 命名空间 ----------------
// UMD 构建的全局名是 PIXI（实测 v8.6.6 文件开头：`var PIXI=function(d){`），
// 不同加载方式也可能是 Pixi / pixi；同步取不到时再动态 import ESM 兜底。
const errEl = document.getElementById('err');
const PIXI_ESM = [
  'https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/+esm',
  'https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.mjs',
  'https://unpkg.com/pixi.js@8.6.6/dist/pixi.mjs',
  'https://esm.sh/pixi.js@8.6.6'
];
let pixiGlobalName = '';
// 模块内命名空间：脚本里所有 Pixi.xxx 都走这个变量（同时遮蔽同名全局，避免依赖全局别名）
let Pixi = null;

function pixiGlobal(){
  const globals = [];
  try { if(typeof window !== 'undefined' && window) globals.push(window); } catch(e){}
  try { if(typeof globalThis !== 'undefined' && globalThis) globals.push(globalThis); } catch(e){}
  for(const g of globals){
    if(g.PIXI && g.PIXI.Application){ pixiGlobalName = 'PIXI'; return g.PIXI; }
    if(g.Pixi && g.Pixi.Application){ pixiGlobalName = 'Pixi'; return g.Pixi; }
    if(g.pixi && g.pixi.Application){ pixiGlobalName = 'pixi'; return g.pixi; }
  }
  return null;
}

async function ensurePixi(){
  let P = pixiGlobal();
  if(P) return P;
  // 脚本可能还在下载 / 尚未注入
  for(let i = 0; i < 40; i++){
    await new Promise(r => setTimeout(r, 50));
    P = pixiGlobal();
    if(P) return P;
  }
  // 兜底：动态 import ESM 构建
  for(const url of PIXI_ESM){
    try {
      const mod = await import(url);
      const ns = (mod && mod.Application) ? mod
        : (mod && mod.default && mod.default.Application) ? mod.default : null;
      if(ns){ pixiGlobalName = 'ESM:' + url; return ns; }
    } catch(e){ /* 换下一个源 */ }
  }
  return null;
}

let W = 0, H = 0;
const world = { w: 1600, h: 1100 };
const cam = { x: 0, y: 0, zoom: 1 };
const bg = { w: 2000, h: 1400 };

let app = null;
let worldLayer, bgLayer, dustLayer, starFarLayer, starNearLayer, hudLayer, hudG, grow, ggrid;

const perf = { ema: 16.7, low: false, resDropped: false, lastCheck: 0 };

// ---------------- 工具 ----------------
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pct = v => Math.round(v * 100) + '%';
const col = hex => parseInt(hex.slice(1), 16);

function wrapCJK(s, per){
  const out = [];
  for(let i = 0; i < s.length; i += per) out.push(s.slice(i, i + per));
  return out;
}

// ---------------- 贴图烘焙 ----------------


function bake(size, draw, k = 1){
  const c = document.createElement('canvas');
  c.width = size * k; c.height = size * k;
  const g = c.getContext('2d');
  if(k !== 1) g.scale(k, k);
  draw(g, size);
  return Pixi.Texture.from(c);
}

// 非正方形烘焙（HUD 条等）
function bakeWH(w, h, draw){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  return Pixi.Texture.from(c);
}

// 2D 上下文用的圆角矩形（rr() 那个是给 Pixi Graphics 的）
function rrect(g, x, y, w, h, r){
  r = Math.min(r, h / 2, w / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

let TEX = null;
function buildTextures(){
  TEX = {};
  // 柔光球
  TEX.glow = bake(128, (g, s) => {
    const r = s / 2;
    const gr = g.createRadialGradient(r, r, 0, r, r, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.95)');
    gr.addColorStop(0.18, 'rgba(255,255,255,0.55)');
    gr.addColorStop(0.5, 'rgba(255,255,255,0.16)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
  });
  // 硬边圆点（柔边 2px）
  TEX.dot = bake(64, (g, s) => {
    g.fillStyle = 'rgba(255,255,255,1)';
    g.beginPath(); g.arc(s / 2, s / 2, s / 2 - 3, 0, TAU); g.fill();
    const gr = g.createRadialGradient(s / 2, s / 2, s / 2 - 5, s / 2, s / 2, s / 2);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
  });
  // 子弹：亮核 + 光晕
  TEX.bullet = bake(64, (g, s) => {
    const r = s / 2;
    const gr = g.createRadialGradient(r, r, 0, r, r, r);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.2, 'rgba(255,255,255,0.85)');
    gr.addColorStop(0.38, 'rgba(255,255,255,0.30)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
  });
  // 敌弹：环
  TEX.orb = bake(64, (g, s) => {
    const r = s / 2;
    const gr = g.createRadialGradient(r, r, r * 0.3, r, r, r);
    gr.addColorStop(0, 'rgba(255,255,255,0)');
    gr.addColorStop(0.55, 'rgba(255,255,255,0.22)');
    gr.addColorStop(0.74, 'rgba(255,255,255,1)');
    gr.addColorStop(0.9, 'rgba(255,255,255,0.30)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
    g.fillStyle = 'rgba(255,255,255,0.95)';
    g.beginPath(); g.arc(r, r, 5, 0, TAU); g.fill();
  });
  // 冲击环（极细发丝环：1px 亮线 + 窄柔光带）
  const ringDraw = (g, s) => {
    const c = s / 2;
    const gr = g.createRadialGradient(c, c, 0, c, c, c);
    gr.addColorStop(0, 'rgba(255,255,255,0)');
    gr.addColorStop(0.8, 'rgba(255,255,255,0)');
    gr.addColorStop(0.88, 'rgba(255,255,255,0.10)');
    gr.addColorStop(0.9, 'rgba(255,255,255,0.35)');
    gr.addColorStop(0.93, 'rgba(255,255,255,0)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
    g.strokeStyle = 'rgba(255,255,255,0.95)';
    g.lineWidth = 1;
    g.beginPath(); g.arc(c, c, c * 0.9, 0, TAU); g.stroke();
  };
  TEX.ring = bake(128, ringDraw);
  TEX.ringBig = bake(128, ringDraw, 2);   // BOSS 光环/轨道环 2×：放大不糊
  // 虚线环（极细）
  const dashRingDraw = (g, s) => {
    const r = s / 2 - 8;
    g.strokeStyle = 'rgba(255,255,255,0.95)';
    g.lineWidth = 1.2;
    for(let i = 0; i < 24; i++){
      const a = i * TAU / 24;
      g.beginPath();
      g.arc(s / 2, s / 2, r, a, a + TAU / 48);
      g.stroke();
    }
  };
  TEX.dashRing = bake(128, dashRingDraw);
  TEX.dashRingBig = bake(128, dashRingDraw, 2);   // BOSS 外光环 2×
  // 球体（灰阶，运行时 tint；高光偏移 -3,-4 与参考版一致）
  TEX.ball = bake(64, (g, s) => {
    const r = s / 2;
    const gr = g.createRadialGradient(r - 7, r - 9, 2, r, r, r - 2);
    gr.addColorStop(0, '#ffffff');
    gr.addColorStop(0.5, '#d0d0d0');
    gr.addColorStop(1, '#3f3f3f');
    g.fillStyle = gr;
    g.beginPath(); g.arc(r, r, r - 2, 0, TAU); g.fill();
  });
  // 三角指示
  TEX.chev = bake(32, (g, s) => {
    g.fillStyle = '#fff';
    g.beginPath();
    g.moveTo(s / 2, 2); g.lineTo(s - 3, s - 4); g.lineTo(3, s - 4);
    g.closePath(); g.fill();
  });
  // 瞄准虚线
  TEX.aim = bake(64, (g, s) => {

    g.beginPath(); g.moveTo(c, c - 13); g.lineTo(c, c - 6); g.moveTo(c, c + 6); g.lineTo(c, c + 13); g.stroke();

    gr.addColorStop(0.55, 'rgba(255,255,255,0.10)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
    g.strokeStyle = 'rgba(255,255,255,0.95)';
    g.lineWidth = 1.2;
    g.beginPath(); g.arc(c, c, c - 14, 0, TAU); g.stroke();

  });
  // ---------------- HUD 美术（复刻原版：渐变条 + 发光技能格） ----------------
  const barBake = (c1, c2) => bakeWH(128, 16, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, w, 0);
    gr.addColorStop(0, c1);
    gr.addColorStop(1, c2);
    g.fillStyle = gr;
    rrect(g, 0, 0, w, h, h / 2); g.fill();
    const gr2 = g.createLinearGradient(0, 0, 0, h);
    gr2.addColorStop(0, 'rgba(255,255,255,0.55)');
    gr2.addColorStop(0.45, 'rgba(255,255,255,0.08)');
    gr2.addColorStop(1, 'rgba(255,255,255,0)');

    g.fillStyle = 'rgba(10,14,26,0.8)';
    rrect(g, 6, 6, s - 12, s - 12, 18); g.fill();

    rrect(g, 6, 6, s - 12, s - 12, 18); g.stroke();
  });

  TEX.skK = skillBake('#7fb8ff');
  TEX.skH = skillBake('#5affc8');
  TEX.skS = skillBake('#ffe45c');
  TEX.skOn = bake(96, (g, s) => {
    g.fillStyle = 'rgba(255,228,92,0.4)';
    rrect(g, 6, 6, s - 12, s - 12, 12); g.fill();
  });

  // 子弹彩色光晕环（替代原版 shadowBlur 光晕）
  TEX.halo = bake(64, (g, s) => {
    const c = s / 2;
    const gr = g.createRadialGradient(c, c, c * 0.1, c, c, c);
    gr.addColorStop(0, 'rgba(255,255,255,0)');
    gr.addColorStop(0.42, 'rgba(255,255,255,0.30)');
    gr.addColorStop(0.62, 'rgba(255,255,255,0.78)');
    gr.addColorStop(0.78, 'rgba(255,255,255,0.16)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
  });
  // 治疗上升符文（细十字 + 外框）
  TEX.plus = bake(32, (g, s) => {
    const c = s / 2;
    g.strokeStyle = 'rgba(255,255,255,0.95)';
    g.lineWidth = 2.2; g.lineCap = 'round';
    g.beginPath(); g.moveTo(c, 7); g.lineTo(c, s - 7); g.moveTo(7, c); g.lineTo(s - 7, c); g.stroke();
    g.lineWidth = 1;
    g.beginPath(); g.arc(c, c, c - 3, 0, TAU); g.stroke();
  });
  // 六边形护盾（极细边）
  TEX.hex = bake(96, (g, s) => {
    const c = s / 2, R = c - 6;
    g.strokeStyle = 'rgba(255,255,255,0.95)';
    g.lineWidth = 1.4;
    g.beginPath();
    for(let i = 0; i < 6; i++){
      const a = i * TAU / 6;
      const px = c + Math.cos(a) * R, py = c + Math.sin(a) * R;
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.closePath(); g.stroke();
    // 顶点亮点
    g.fillStyle = 'rgba(255,255,255,0.9)';
    for(let i = 0; i < 6; i++){
      const a = i * TAU / 6;
      g.beginPath(); g.arc(c + Math.cos(a) * R, c + Math.sin(a) * R, 1.6, 0, TAU); g.fill();
    }
  });

  TEX.diamond = bake(32, (g, s) => {
    const c = s / 2;

    g.beginPath();
    g.moveTo(c, 4); g.lineTo(s - 4, c); g.lineTo(c, s - 4); g.lineTo(4, c);
    g.closePath(); g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.9)';
    g.beginPath(); g.arc(c, c, 2.2, 0, TAU); g.fill();
  });

  // 地面网格用不到贴图；暗角改为 CSS

// ---------------- 对象池 ----------------
function mkPool(tex, count, parent, blend){
  const arr = [];
  for(let i = 0; i < count; i++){
    const s = new Pixi.Sprite(tex);
    s.anchor.set(0.5);
    if(blend) s.blendMode = 'add';
    s.visible = false;
    s._used = false;
    parent.addChild(s);
    arr.push(s);
  }
  arr._c = 0;
  arr.get = function(){
    const n = arr.length;
    for(let k = 0; k < n; k++){
      const i = (arr._c + k) % n;
      const s = arr[i];
      if(!s._used){ s._used = true; s.visible = true; arr._c = (i + 1) % n; return s; }
    }
    return null;
  };
  return arr;
}
function rel(spr){ if(spr){ spr._used = false; spr.visible = false; } }

  bullets.push(b);
  return b;
}

function mkEBullet(o){

}

function castActive(i){
  if(state.mode !== 'playing') return;
  const s = player.actives[i];
  if(!s || s.cd > 0) return;
  const def = ACTIVE_BY_ID[s.id];
  const v = def.v[s.lv - 1];
  const p = player;
  s.cd = def.cd;
  switch(s.id){
    case 'nova': {
      const R = 190 + 45 * v;
      spawnRing(p.x, p.y, 0xffe45c, 138, 0.5, 3);
      spawnRing(p.x, p.y, 0xffffff, 100, 0.4, 2.5);
      spawnParticles(p.x, p.y, 34, 0xffe45c, 460, 0.6, 3.2);
      spawnSparks(p.x, p.y, 10, 0xffe45c, 1.6);
      state.shake = Math.max(state.shake, 9);
      splashDamage(p.x, p.y, R, 70 * v * M.dmg, 620);
      addFloat(p.x, p.y - 34, '震荡新星', 0xffe45c, 17);
      SFX.nova();
      break;
    }
    case 'stasis':
      state.stasis = v;
      addFloat(p.x, p.y - 34, '时间凝滞', 0x7fb8ff, 17);
      spawnRing(p.x, p.y, 0x7fb8ff, 138, 0.6, 2.5);
      spawnParticles(p.x, p.y, 24, 0x7fb8ff, 260, 0.6, 2.8);
      tone(520, 0.4, 'sine', 0.16, 120);
      break;
    case 'aegis':
      p.invuln = Math.max(p.invuln, v);
      p.shield = Math.min(M.shieldCap, p.shield + 1);
      addFloat(p.x, p.y - 34, '离子壁垒', 0x5affc8, 17);
      spawnRing(p.x, p.y, 0x5affc8, 110, 0.5, 3);
      spawnParticles(p.x, p.y, 20, 0x5affc8, 240, 0.5, 2.8);
      SFX.shieldUp();
      break;
    case 'frenzy':
      p.frenzy = v;
      addFloat(p.x, p.y - 34, '火力狂潮', 0xff9a6a, 17);
      spawnRing(p.x, p.y, 0xff9a6a, 100, 0.4, 3);
      spawnParticles(p.x, p.y, 20, 0xff9a6a, 300, 0.5, 3);
      SFX.overload();
      break;
    case 'blink': {
      let dx = p.moveDir.x, dy = p.moveDir.y;
      if(!dx && !dy){ dx = Math.cos(p.angle); dy = Math.sin(p.angle); }
      const l = Math.hypot(dx, dy) || 1;
      dx /= l; dy /= l;
      spawnParticles(p.x, p.y, 18, 0xb06bff, 300, 0.45, 3);
      spawnRing(p.x, p.y, 0xb06bff, 80, 0.35, 2.5);
      p.x = clamp(p.x + dx * 200 * v, p.r, world.w - p.r);
      p.y = clamp(p.y + dy * 200 * v, p.r, world.h - p.r);
      p.invuln = Math.max(p.invuln, 0.4);
      spawnParticles(p.x, p.y, 22, 0xb06bff, 340, 0.5, 3);
      spawnSparks(p.x, p.y, 6, 0xb06bff, 1.3);
      addFloat(p.x, p.y - 34, '相位闪现', 0xb06bff, 17);
      SFX.dash();
      break;
    }
    case 'magnet':
      state.magnetize = v;
      addFloat(p.x, p.y - 34, '磁暴牵引', 0x5ffbf1, 17);
      spawnRing(p.x, p.y, 0x5ffbf1, 130, 0.5, 2.5);
      tone(300, 0.35, 'sine', 0.14, 620);
      break;
    case 'ram':
      p.charges = Math.max(p.charges, 1);
      p.dashCd = 0;
      tryDash();
      p.charges = Math.min(1 + M.dashCharges, p.charges + 1);   // 白送一次，不耗充能
      p.dashTime = CFG.dashTime * 1.5;
      p.invuln = Math.max(p.invuln, p.dashTime + 0.1);
      p.ramMul = v;
      addFloat(p.x, p.y - 34, '蛮牛猛冲', 0x7fb8ff, 17);
      spawnRing(p.x, p.y, 0x7fb8ff, 110, 0.4, 3);
      break;
    case 'shock': {
      const R = 240 + 40 * v;
      splashDamage(p.x, p.y, R, 55 * v * M.dmg, 900);
      for(const o of enemies){
        if(Math.hypot(o.x - p.x, o.y - p.y) < R + o.r){
          o.slowT = Math.max(o.slowT || 0, 1 + v);
          o.slowAmt = Math.max(o.slowAmt || 0, 0.5);
        }
      }
      spawnRing(p.x, p.y, 0x5ffbf1, 138, 0.5, 3);
      spawnRing(p.x, p.y, 0xffffff, 100, 0.4, 2.5);
      spawnParticles(p.x, p.y, 30, 0x5ffbf1, 420, 0.55, 3);
      state.shake = Math.max(state.shake, 10);
      addFloat(p.x, p.y - 34, '冲击星环', 0x5ffbf1, 17);
      SFX.nova();
      break;
    }
    case 'orbit':
      p.orbitT = v;
      p.orbitDmg = (10 + 7 * v) * M.dmg;
      p.orbitTick = 0;
      addFloat(p.x, p.y - 34, '卫星刃环', 0xff9ad5, 17);
      spawnRing(p.x, p.y, 0xff9ad5, 110, 0.5, 2.5);
      SFX.power();
      break;
  }
}

// 选中常驻卡：已有则升阶；有空位则入栏；栏满则进入替换流程
function gainActive(def, tier){
  const cur = player.actives.find(s => s.id === def.id);
  if(cur){
    cur.lv = Math.min(5, cur.lv + (tier >= 3 ? 2 : 1));
    addFloat(player.x, player.y - 58, `${def.n} 升阶 Lv${cur.lv}`, def.c, 16);
    return false;
  }
  if(player.actives.length < 3){
    player.actives.push({ id: def.id, lv: tier + 1, cd: 0 });
    addFloat(player.x, player.y - 58, '常驻技能 · ' + def.n, def.c, 16);
    return false;
  }
  state.pendingSkill = { id: def.id, lv: tier + 1 };
  return true;
}

// 栏满后的替换选择：把三个已装备技能伪装成三张卡复用选卡界面
function buildReplaceUI(){
  const ps = state.pendingSkill;
  const def = ACTIVE_BY_ID[ps.id];
  state.offer = player.actives.map(s => {
    const cur = ACTIVE_BY_ID[s.id];
    return { def: {
      n: '替换 · ' + cur.n, c: cur.c, v: [0, 0, 0, 0, 0],
      d: () => `以【${def.n} Lv${ps.lv}】替换【${cur.n} Lv${s.lv}】`,
      a: () => {}
    }, tier: s.lv - 1 };
  });
  state.cardTitle = '技 能 栏 已 满';
  state.cardSub = isTouchDevice
    ? `点卡片替换对应常驻技能 · 点空白处放弃【${def.n}】`
    : `选择要替换的常驻技能 · 1 2 3 或鼠标点击 · ESC 放弃【${def.n}】`;
  buildCardUI();
  state.cardTitle = null;
  state.cardSub = null;
}

// ---------------- 输入 ----------------
const keys = {};
const KEYMAP = ['Space','KeyW','KeyA','KeyS','KeyD','KeyJ','KeyK','KeyH','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter','Escape'];

function onKeyDown(e){
  const code = e.code;
  if(KEYMAP.includes(code)) e.preventDefault();

  if(state.mode === 'title'){
    audioInit();
    if(!e.repeat && code === 'KeyT'){ state.mode = 'intro'; return; }
    if(!e.repeat) startGame();
    return;
  }
  if(state.mode === 'intro'){
    audioInit();
    if(!e.repeat && (code === 'KeyT' || code === 'Escape' || code === 'Enter' || code === 'NumpadEnter' || code === 'Space')) state.mode = 'title';
    return;
  }
  if(state.mode === 'dead'){ if(!e.repeat && (code === 'KeyR' || code === 'Enter' || code === 'Space')){ audioInit(); startGame(); } return; }
  if(state.mode === 'cards'){
    if(!e.repeat){
      if(code === 'Digit1' || code === 'Numpad1') pickOffer(0);
      else if(code === 'Digit2' || code === 'Numpad2') pickOffer(1);
      else if(code === 'Digit3' || code === 'Numpad3') pickOffer(2);
      else if(code === 'ArrowLeft' || code === 'ArrowUp' || code === 'KeyA') moveSel(-1);
      else if(code === 'ArrowRight' || code === 'ArrowDown' || code === 'KeyD') moveSel(1);
      else if(code === 'Enter' || code === 'NumpadEnter' || code === 'Space') pickOffer(state.sel);
      else if(code === 'Escape' && state.pendingSkill){ state.pendingSkill = null; addFloat(player.x, player.y - 58, '已放弃新技能', 0x9fb0c8, 14); settlePick(); }
    }
    return;
  }
  if(state.mode === 'paused'){
    if(!e.repeat){
      if(code === 'Escape' || code === 'Enter' || code === 'Space') state.mode = 'playing';
      else if(code === 'KeyR') startGame();
    }
    return;
  }
  if(!e.repeat){
    if(code === 'Escape'){ state.mode = 'paused'; return; }
    if(code === 'KeyK') tryDash();
    if(code === 'KeyH') tryHeal();
    if(code === 'Space') tryOverload();
    if(code === 'Digit1' || code === 'Numpad1') castActive(0);
    if(code === 'Digit2' || code === 'Numpad2') castActive(1);
    if(code === 'Digit3' || code === 'Numpad3') castActive(2);
  }
  keys[code] = true;
}

let fireTouch = false;

// 触屏端进入游戏时请求全屏并锁定横屏（安卓生效；iOS 不支持则静默忽略）
function tryFullscreen(){
  if(!isTouchDevice) return;
  try{
    const el = document.documentElement;
    if(!document.fullscreenElement && el.requestFullscreen){
      const r = el.requestFullscreen({ navigationUI: 'hide' });
      if(r && r.then) r.then(() => {
        try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); }catch(e){}
      }).catch(() => {});
    }
  }catch(e){}
}

function setupTouch(){
  touchEls = {
    ui: document.getElementById('touchUI'),
    zone: document.getElementById('joyZone'),
    base: document.getElementById('joyBase'),
    knob: document.getElementById('joyKnob'),
    pause: document.getElementById('btnPause'),
    dash: document.getElementById('btnDash'),
    heal: document.getElementById('btnHeal'),
    over: document.getElementById('btnOverload'),
    sk: [document.getElementById('sk0'), document.getElementById('sk1'), document.getElementById('sk2')]
  };
  if(isTouchDevice) document.body.classList.add('isTouch');
  window.addEventListener('touchstart', () => document.body.classList.add('isTouch'), { passive: true });
  document.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });

  const setKnob = (dx, dy) => { touchEls.knob.style.transform = `translate(${dx}px,${dy}px)`; };
  const endJoy = () => {
    joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0;
    setKnob(0, 0);
    touchEls.base.classList.remove('on');
    touchEls.base.style.left = '';
    touchEls.base.style.top = '';
  };
  joy.end = endJoy;
  const zone = touchEls.zone;
  zone.addEventListener('pointerdown', e => {
    if(joy.active || state.mode !== 'playing') return;
    audioInit();
    joy.active = true;
    joy.id = e.pointerId;
    try{ zone.setPointerCapture(e.pointerId); }catch(err){}
    joy.cx = e.clientX;
    joy.cy = e.clientY;
    touchEls.base.style.left = e.clientX + 'px';
    touchEls.base.style.top = e.clientY + 'px';
    touchEls.base.classList.add('on');
    joy.R = touchEls.base.offsetWidth * 0.35 || 48;
    setKnob(0, 0);
    e.preventDefault();
  }, { passive: false });
  zone.addEventListener('pointermove', e => {
    if(!joy.active || e.pointerId !== joy.id) return;
    const R = joy.R || 48;
    const ox = e.clientX - joy.cx, oy = e.clientY - joy.cy;
    const d = Math.hypot(ox, oy);
    let dx = ox, dy = oy;
    if(d > R){ dx = ox / d * R; dy = oy / d * R; }
    setKnob(dx, dy);
    if(d < 10){ joy.dx = 0; joy.dy = 0; }
    else { joy.dx = dx / R; joy.dy = dy / R; }
    e.preventDefault();
  }, { passive: false });
  const zoneUp = e => { if(joy.active && e.pointerId === joy.id) endJoy(); };
  zone.addEventListener('pointerup', zoneUp);
  zone.addEventListener('pointercancel', zoneUp);

  const bind = (id, down, up) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      e.stopPropagation();
      audioInit();
      el.classList.add('down');
      if(navigator.vibrate) navigator.vibrate(8);
      down();
    }, { passive: false });
    const off = e => { e.preventDefault(); el.classList.remove('down'); if(up) up(); };
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
  };
  bind('btnFire', () => { if(state.mode === 'playing'){ fireTouch = true; keys['KeyJ'] = true; } },
    () => { if(fireTouch){ fireTouch = false; keys['KeyJ'] = false; } });
  bind('btnDash', () => { if(state.mode === 'playing') tryDash(); });
  bind('btnHeal', () => { if(state.mode === 'playing') tryHeal(); });
  bind('btnOverload', () => { if(state.mode === 'playing') tryOverload(); });
  bind('btnPause', () => {
    if(state.mode === 'playing') state.mode = 'paused';
    else if(state.mode === 'paused') state.mode = 'playing';
  });
  for(let i = 0; i < 3; i++) bind('sk' + i, () => castActive(i));
}

// 每帧同步触屏 UI：仅在战斗中显示摇杆/按钮，暂停时保留暂停键；常驻技能钮跟随技能栏
function syncTouch(){
  if(!touchEls) return;
  uiTouch = document.body.classList.contains('isTouch');
  const m = state.mode === 'playing' ? 'p' : (state.mode === 'paused' ? 's' : 'o');
  if(m !== touchMode){
    touchMode = m;
    touchEls.ui.classList.toggle('on', m === 'p');
    touchEls.pause.style.display = m === 'o' ? 'none' : 'flex';
    touchEls.pause.textContent = m === 's' ? '▶' : 'II';
    if(m !== 'p'){
      if(joy.end) joy.end();
      if(fireTouch){ fireTouch = false; keys['KeyJ'] = false; }
      touchEls.ui.querySelectorAll('.down').forEach(el => el.classList.remove('down'));
    }
  }
  if(m !== 'p') return;
  // 冲刺/修复/过载：冷却读秒；能量不足或不可用置灰；过载激活时常亮显示剩余时间
  const setBtn = (el, label, hex, cd, dim) => {
    const txt = cd > 0 ? cd.toFixed(1) : label;
    if(el._label !== txt){ el._label = txt; el.textContent = txt; }
    el.style.color = cd > 0 ? '#5d6b7d' : hex;
    el.style.opacity = (cd > 0 || dim) ? '0.45' : '1';
  };
  setBtn(touchEls.dash, '冲刺', '#7fb8ff', player.charges > 0 ? 0 : player.dashCd, false);
  setBtn(touchEls.heal, '修复', '#5affc8', player.healCd, player.energy < 30 || player.hp >= player.maxHp);
  if(player.overload > 0){
    const t = player.overload.toFixed(1);
    if(touchEls.over._label !== t){ touchEls.over._label = t; touchEls.over.textContent = t; }
    touchEls.over.style.color = '#ffe45c';
    touchEls.over.style.opacity = '1';
  } else {
    setBtn(touchEls.over, '过载', '#ffe45c', 0, player.energy < CFG.overloadCost * M.overCost);
  }
  for(let i = 0; i < 3; i++){
    const b = touchEls.sk[i];
    const s = player.actives[i];
    if(!s){ b.style.display = 'none'; b._label = ''; continue; }
    const def = ACTIVE_BY_ID[s.id];
    const hex = '#' + def.c.toString(16).padStart(6, '0');
    const label = s.cd > 0 ? s.cd.toFixed(1) : def.n;
    b.style.display = 'flex';
    if(b._label !== label){ b._label = label; b.textContent = label; }
    if(b._col !== hex){ b._col = hex; b.style.borderColor = hex; }
    b.style.color = s.cd > 0 ? '#5d6b7d' : hex;
  }
}

// ---------------- 音效/视觉基元 ----------------
function spawnParticles(x, y, n, color, speed, life, size = 3){
  let cnt = perf.low ? Math.ceil(n * 0.5) : n;
  for(let i = 0; i < cnt; i++){
    if(particles.length >= state.particleCap) break;
    const spr = POOL.part.get();
    if(!spr) break;
    const a = Math.random() * TAU;
    const s = speed * (0.35 + Math.random() * 0.85);
    particles.push({
      spr, x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: life * (0.6 + Math.random() * 0.8), maxLife: life,
      color, size: size * (0.6 + Math.random() * 0.9)
    });
  }
}

function addFloat(x, y, text, color = 0xffffff, size = 16){
  if(floats.length > 34) return;
  const t = POOL.float.get();
  if(!t) return;
  t.text = String(text);
  if(t.style){
    t.style.fill = color;
    t.style.fontSize = size;
    // 参考版 drawFloats 用 shadowBlur 12 给数字发光 —— 这里用真 dropShadow
    t.style.dropShadow = { color, alpha: 0.9, blur: 12, distance: 0, angle: 0 };
  }
  floats.push({ t, x, y, vy: -46, life: 0.85, maxLife: 0.85, color, size });
}

function spawnRing(x, y, color, maxR, life, width = 3){
  if(maxR > 140) return;   // 大光圈全部移除
  const s = POOL.ring.get();
  if(!s) return;
  rings.push({ s, x, y, r: 6, maxR, life, maxLife: life, color, width });
}

// 命中火花（四芒星闪光）
function spawnSparks(x, y, n, col, power = 1){
  for(let i = 0; i < n; i++){
    if(sparks.length >= 140) break;
    const spr = POOL.spark.get();
    if(!spr) break;
    const a = Math.random() * TAU;
    const sp = 70 * power * (0.5 + Math.random());
    sparks.push({
      spr, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.20 + Math.random() * 0.20, maxLife: 0.40,
      size: (12 + Math.random() * 10) * power, col, rot: Math.random() * TAU
    });
  }
}

// 击杀/受击碎片
function spawnShards(x, y, n, col, power = 1){
  for(let i = 0; i < n; i++){
    if(shards.length >= 90) break;
    const spr = POOL.shard.get();

}

function comboNova(x, y){
  const R = 320;
  spawnRing(x, y, 0xffffff, R, 0.55, 6);
  spawnRing(x, y, 0xffe45c, R * 0.7, 0.45, 3);
  spawnParticles(x, y, 40, 0xffe45c, 520, 0.7, 3.4);
  spawnSparks(x, y, 16, 0xffe45c, 2);
  state.flash = Math.max(state.flash, 0.25);
  state.novaFlash = Math.max(state.novaFlash, 0.55);
  state.shake = Math.max(state.shake, 12);
  SFX.nova();
  addFloat(x, y - 44, 'COMBO NOVA!', 0xffe45c, 20);
  splashDamage(x, y, R, 26 + state.wave * 1.6, 560);
  for(let i = ebullets.length - 1; i >= 0; i--){
    const b = ebullets[i];
    if(Math.hypot(b.x - x, b.y - y) < R){
      spawnParticles(b.x, b.y, 3, 0xb06bff, 160, 0.3, 2);
      freeEBullet(b);
      ebullets.splice(i, 1);
    }
  }
}

// ---------------- 背景 ----------------
function makeNebulae(){
  for(const n of nebulae) rel(n.spr);
  nebulae = [];
  const cols = curTheme.bg || [0x1b3fd8, 0x8a1bd8, 0x0f8f8a, 0xd81b6a, 0x1d7fd8, 0x4a1bd8, 0x2b7fd8];
  for(let i = 0; i < 7; i++){
    const spr = POOL.neb.get();
    if(!spr) break;
    nebulae.push({
      spr,
      x: rand(0, bg.w), y: rand(0, bg.h),
      r: rand(210, 470),
      vx: rand(-8, 8), vy: rand(-8, 8),
      color: cols[i % cols.length],
      a: rand(0.05, 0.10),
      phase: Math.random() * TAU
    });
  }
}

function makeDust(){
  for(const d of dust) rel(d.spr);
  dust = [];
  const n = Math.min(110, Math.floor((W * H) / 20000));
  for(let i = 0; i < n; i++){
    const spr = POOL.dust.get();
    if(!spr) break;
    dust.push({
      spr,
      x: rand(0, W + world.w * 0.18), y: rand(0, H + world.h * 0.18),
      vx: rand(-12, 12), vy: rand(-12, 12),
      r: rand(1.2, 3.4), a: rand(0.12, 0.5), phase: Math.random() * TAU
    });
  }
}

function updateBackground(dt){
  for(const n of nebulae){
    n.x += n.vx * dt; n.y += n.vy * dt; n.phase += dt * 0.4;
    if(n.x < -n.r) n.x = bg.w + n.r;
    if(n.x > bg.w + n.r) n.x = -n.r;
    if(n.y < -n.r) n.y = bg.h + n.r;
    if(n.y > bg.h + n.r) n.y = -n.r;
  }
  const dw = W + world.w * 0.18, dh = H + world.h * 0.18;
  for(const d of dust){
    d.x += d.vx * dt; d.y += d.vy * dt; d.phase += dt * 1.5;
    if(d.x < -5) d.x = dw + 5;
    if(d.x > dw + 5) d.x = -5;
    if(d.y < -5) d.y = dh + 5;
    if(d.y > dh + 5) d.y = -5;
  }
  const k = Math.exp(-5 * dt);
  wallGlow.l *= k; wallGlow.r *= k; wallGlow.t *= k; wallGlow.b *= k;
}

function updateMeteors(dt){
  state.meteorCd -= dt;
  if(state.meteorCd <= 0){
    state.meteorCd = rand(2.5, 6.5);
    const spr = POOL.meteor.get();
    if(spr){
      const fromLeft = Math.random() < 0.5;
      meteors.push({
        spr,
        x: fromLeft ? -60 : rand(0, W),
        y: fromLeft ? rand(-40, H * 0.5) : -60,
        vx: rand(420, 820) * (fromLeft ? 1 : 0.5),
        vy: rand(240, 460), life: 2.2, maxLife: 2.2
      });
    }
  }
  for(let i = meteors.length - 1; i >= 0; i--){
    const m = meteors[i];
    m.x += m.vx * dt; m.y += m.vy * dt; m.life -= dt;
    if(m.life <= 0 || m.x > W + 200 || m.y > H + 200){ rel(m.spr); meteors.splice(i, 1); }
  }
}

function syncStars(){
  const t = state.time;
  starFarLayer.x = -cam.x * 0.05;
  starFarLayer.y = -cam.y * 0.05;
  starNearLayer.x = -cam.x * 0.30;
  starNearLayer.y = -cam.y * 0.30;
  for(const s of starsFar){
    const tw = 0.55 + 0.45 * Math.sin(s.phase + t * 1.2);
    const o = s.spr;
    o.texture = TEX.core;
    o.rotation = 0;
    o.position.set(s.x, s.y);
    o.scale.set(s.r * 2 / 64);
    o.tint = 0xbfe9ff;
    o.alpha = s.a * tw * 0.8;
  }
  for(const s of starsNear){
    const tw = 0.6 + 0.4 * Math.sin(s.phase + t * 2.1);
    const o = s.spr;
    o.position.set(s.x, s.y);
    if(s.streak){
      o.texture = TEX.streak;
      o.rotation = 0.42;
      o.scale.set(1.5, 1.2);
    } else {
      o.texture = TEX.core;
      o.rotation = 0;
      o.scale.set(s.r * 2 / 64);
    }
    o.tint = s.streak ? 0xdff6ff : 0x8fd8ff;
    o.alpha = s.a * tw;
  }
}

function syncWallPulses(){
  for(const w of wallPulses){
    w.p += w.sp * 0.016;
    if(w.p > 1) w.p -= 1;
    if(w.p < 0) w.p += 1;
    const s = w.spr;
    s.texture = TEX.line;
    if(w.side === 'l' || w.side === 'r'){
      s.position.set(w.side === 'l' ? 5 : world.w - 5, w.p * world.h);
      s.rotation = Math.PI / 2;
    } else {
      s.position.set(w.p * world.w, w.side === 't' ? 5 : world.h - 5);
      s.rotation = 0;
    }
    s.scale.set(76 / 64, 10 / 64);
    s.tint = 0x8ff6ff;
    s.alpha = 0.34 + 0.26 * Math.sin(state.time * 6 + w.p * 6);
  }
}

// ---------------- 摄像机 ----------------
function updateCamera(dt){
  const z = cam.zoom;
  const viewW = W / z, viewH = H / z;
  const lookX = clamp(player.vx * 0.16, -150, 150);
  const lookY = clamp(player.vy * 0.16, -150, 150);
  let tx = player.x + lookX - viewW / 2;
  let ty = player.y + lookY - viewH / 2;
  if(world.w <= viewW) tx = (world.w - viewW) / 2; else tx = clamp(tx, 0, world.w - viewW);
  if(world.h <= viewH) ty = (world.h - viewH) / 2; else ty = clamp(ty, 0, world.h - viewH);
  const k = 1 - Math.exp(-7 * dt);
  cam.x = lerp(cam.x, tx, k);
  cam.y = lerp(cam.y, ty, k);

  let tz = 1;
  if(state.mode === 'playing'){
    if(player.dashTime > 0) tz = 1.05;
    else if(player.overload > 0) tz = 1.02 + Math.sin(state.time * 9) * 0.01;
  }
  if(uiTouch) tz *= 0.75;   // 触屏端整体拉远镜头，同屏看到更多战场
  cam.zoom = lerp(cam.zoom, tz, 1 - Math.exp(-5 * dt));
}

// ---------------- 场地：随机地图生成 ----------------
const SPAWN_SAFE = 205;          // 出生点保护半径
const MAP_RANDOM = true;         // 改 false 立刻退回原来的固定场地（7 根柱子，无墙 / 无地形区）
const MAX_PILLARS = 20, MAX_WALLS = 12, MAX_ZONES = 3;   // 柱/墙上限上调，给蜂窝·靶心·螺旋等大地图留空间
const MAP_SWITCH_WAVES = 3;             // 每 N 波随机换一张新地图（0=关闭；BOSS 波不换）

function clearMap(){
  for(const p of pillars) for(const s of p.sprites) rel(s);
  pillars = []; walls = []; zones = [];
}

function addPillar(x, y, r, sides){
  if(pillars.length >= MAX_PILLARS) return false;
  const halo = POOL.pillar.get(), ring = POOL.pillar.get(), ring2 = POOL.pillar.get();
  const d1 = POOL.pillar.get(), d2 = POOL.pillar.get(), inner = POOL.pillar.get();
  if(!halo || !ring || !ring2 || !d1 || !d2 || !inner){
    for(const s of [halo, ring, ring2, d1, d2, inner]) if(s) rel(s);
    return false;
  }
  const sd = sides >= 3 ? Math.floor(sides) : 0;      // >=3 画成正多边形，否则圆形
  const cr = sd ? r * Math.cos(Math.PI / sd) : r;      // 多边形碰撞用内切圆，手感宽容不卡角
  pillars.push({
    x, y, r, cr, sides: sd,
    phase: Math.random() * TAU, spin: rand(-0.6, 0.6),
    ringA: Math.random() * TAU, shape: Math.floor(rand(0, 3)),
    sprites: [halo, ring, ring2, d1, d2, inner]
  });
  return true;
}

function addWall(x, y, w, h, rot){
  if(walls.length >= MAX_WALLS) return false;
  const PAD = 78;                       // 与边界保持距离，别堵住敌人出生带
  let ww = w, hh = h;
  const cos = Math.abs(Math.cos(rot || 0)), sin = Math.abs(Math.sin(rot || 0));
  let ex = cos * ww / 2 + sin * hh / 2, ey = sin * ww / 2 + cos * hh / 2;
  const availW = world.w - PAD * 2, availH = world.h - PAD * 2;
  if(ex * 2 > availW || ey * 2 > availH){
    const k = Math.min(availW / (ex * 2), availH / (ey * 2));
    ww *= k; hh *= k;
    ex = cos * ww / 2 + sin * hh / 2; ey = sin * ww / 2 + cos * hh / 2;
  }
  if(ww < 70 || hh < 12) return false;
  const nx = clamp(x, PAD + ex, Math.max(PAD + ex, world.w - PAD - ex));
  const ny = clamp(y, PAD + ey, Math.max(PAD + ey, world.h - PAD - ey));
  // 别把出生点埋在墙里（精确 OBB 检测，斜墙也拦得住）
  const probe = { x: nx, y: ny, w: ww, h: hh, rot: rot || 0 };
  if(obbHit(probe, world.w / 2, world.h / 2, SPAWN_SAFE)) return false;
  walls.push({ x: nx, y: ny, w: ww, h: hh, rot: rot || 0, phase: Math.random() * TAU, tone: rand(0, 1) });
  return true;
}

function addZone(x, y, r, kind){
  if(zones.length >= MAX_ZONES) return false;
  zones.push({ x, y, r, kind, phase: Math.random() * TAU });
  return true;
}

// 该点是否与出生点 / 已有障碍 / 边界保持距离
function spotFree(x, y, r){
  if(Math.hypot(x - world.w / 2, y - world.h / 2) < SPAWN_SAFE + r) return false;
  if(x < r + 100 || x > world.w - r - 100 || y < r + 100 || y > world.h - r - 100) return false;
  for(const p of pillars) if(Math.hypot(p.x - x, p.y - y) < p.cr + r + 46) return false;
  for(const w of walls){
    const rr = Math.hypot(w.w, w.h) / 2;
    if(Math.hypot(w.x - x, w.y - y) < rr + r + 34) return false;
  }
  return true;
}

function scatterPillars(n, rMin, rMax){
  let guard = 0;
  while(pillars.length < n && guard < 300){
    guard++;
    const r = rand(rMin, rMax);
    const x = rand(r + 100, world.w - r - 100), y = rand(r + 100, world.h - r - 100);
    if(!spotFree(x, y, r)) continue;
    addPillar(x, y, r);
  }
}

}

// 地形区：减速力场 / 充能泉
function makeZones(){
  const n = Math.floor(rand(1, 4));
  for(let i = 0; i < n; i++){
    const kind = Math.random() < 0.55 ? 'slow' : 'boost';
    const r = rand(95, 155);
    let ok = false, x = 0, y = 0;
    for(let g = 0; g < 80 && !ok; g++){
      x = rand(r + 110, world.w - r - 110);
      y = rand(r + 110, world.h - r - 110);
      ok = Math.hypot(x - world.w / 2, y - world.h / 2) > SPAWN_SAFE + 40;
      if(ok) for(const z of zones) if(Math.hypot(z.x - x, z.y - y) < z.r + r + 60){ ok = false; break; }
    }
    if(ok) addZone(x, y, r, kind);
  }
}

function generateMap(){
  clearMap();
  if(!MAP_RANDOM){
    scatterPillars(7, 24, 40);
    mapLabel = '标准场';
    curTheme = DEFAULT_THEME;
    buildMapStatic();
    return null;
  }
  const t = MAP_TYPES[Math.floor(Math.random() * MAP_TYPES.length)];
  t.build();
  makeZones();
  mapLabel = t.name;
  curTheme = THEMES[t.id] || DEFAULT_THEME;
  buildMapStatic();
  return t;
}

// 该点是否嵌进任一障碍（柱/墙）
function overlapsSolid(x, y, r){
  for(const q of pillars){ if(Math.hypot(q.x - x, q.y - y) < q.cr + r) return true; }
  for(const w of walls){ if(obbHit(w, x, y, r)) return true; }
  return false;
}

// 进行中随机换图：在场地清空的波次切换点调用最安全。重随布局+主题，背景就地换色，玩家若被埋则拉回中心
function reshuffleMap(){
  generateMap();
  if(curTheme.bg) for(let i = 0; i < nebulae.length; i++) nebulae[i].color = curTheme.bg[i % curTheme.bg.length];
  if(overlapsSolid(player.x, player.y, player.r + 6)){ player.x = world.w / 2; player.y = world.h / 2; }
  player.vx = 0; player.vy = 0;
  player.invuln = Math.max(player.invuln, 1.2);
  addFloat(player.x, player.y - 150, '地形变换 · ' + mapLabel, curTheme.label, 22);
  spawnRing(player.x, player.y, curTheme.accent, Math.max(W, H) * 0.85, 0.9, 5);
  SFX.wave();
}

// 窗口尺寸变化后把地形夹回场内
function clampMap(){
  for(const p of pillars){
    p.x = clamp(p.x, p.r + 40, Math.max(p.r + 40, world.w - p.r - 40));
    p.y = clamp(p.y, p.r + 40, Math.max(p.r + 40, world.h - p.r - 40));
  }
  for(const w of walls){
    w.x = clamp(w.x, 80, Math.max(80, world.w - 80));
    w.y = clamp(w.y, 80, Math.max(80, world.h - 80));
  }
  for(const z of zones){
    z.x = clamp(z.x, z.r * 0.5, Math.max(z.r * 0.5, world.w - z.r * 0.5));
    z.y = clamp(z.y, z.r * 0.5, Math.max(z.r * 0.5, world.h - z.r * 0.5));
  }
}

// 圆 vs 旋转矩形（墙）：返回世界系法线与穿透深度
function obbHit(w, x, y, r){
  const cos = Math.cos(w.rot), sin = Math.sin(w.rot);
  const dx = x - w.x, dy = y - w.y;
  const lx = dx * cos + dy * sin;
  const ly = -dx * sin + dy * cos;
  const hw = w.w / 2, hh = w.h / 2;
  const cx = clamp(lx, -hw, hw), cy = clamp(ly, -hh, hh);
  const ox = lx - cx, oy = ly - cy;
  const d = Math.hypot(ox, oy);
  let nx, ny, pen;
  if(d > 1e-6){
    if(d >= r) return null;
    nx = ox / d; ny = oy / d; pen = r - d;
  } else {
    const px = hw - Math.abs(lx), py = hh - Math.abs(ly);
    if(px < py){ nx = lx >= 0 ? 1 : -1; ny = 0; pen = px + r; }
    else { nx = 0; ny = ly >= 0 ? 1 : -1; pen = py + r; }
  }
  return { nx: nx * cos - ny * sin, ny: nx * sin + ny * cos, pen };
}

// 圆形单位与全部障碍求解：推出 + 速度反射。keep=反弹保留系数
function reflectSolids(o, r, keep, onHard){
  let hits = 0, bounced = false;
  for(const q of pillars){
    const dx = o.x - q.x, dy = o.y - q.y;
    const d = Math.hypot(dx, dy), min = q.cr + r;
    if(d < min && d > 0.0001){
      const nx = dx / d, ny = dy / d;
      o.x = q.x + nx * min; o.y = q.y + ny * min;
      const dot = o.vx * nx + o.vy * ny;
      if(dot < 0){
        o.vx -= 2 * dot * nx; o.vy -= 2 * dot * ny;
        o.vx *= keep; o.vy *= keep;
        hits++; bounced = true;
        o.hitNx = nx; o.hitNy = ny;
        if(onHard && Math.abs(dot) > 90) onHard(o.x, o.y);
      }
    }
  }
  for(const w of walls){
    const h = obbHit(w, o.x, o.y, r);
    if(!h) continue;
    o.x += h.nx * h.pen; o.y += h.ny * h.pen;
    const dot = o.vx * h.nx + o.vy * h.ny;
    if(dot < 0){
      o.vx -= 2 * dot * h.nx; o.vy -= 2 * dot * h.ny;
      o.vx *= keep; o.vy *= keep;
      hits++; bounced = true;
      o.hitNx = h.nx; o.hitNy = h.ny;
      if(onHard && Math.abs(dot) > 90) onHard(o.x, o.y);
    }
  }
  return hits;
}

// 敌人：只做推出，并给一点切向速度让它绕开墙而不是顶死
function pushOutSolids(e, dt){
  if(e.phaseT > 0) return false;   // 卡死自救期间穿墙，直接放行
  let blocked = false;
  for(const q of pillars){
    const ddx = e.x - q.x, ddy = e.y - q.y;
    const dd = Math.hypot(ddx, ddy), min = q.cr + e.r;
    if(dd < min && dd > 0.0001){
      e.x = q.x + ddx / dd * min;
      e.y = q.y + ddy / dd * min;
      blocked = true;
    }
  }
  let slid = false;
  for(const w of walls){
    const h = obbHit(w, e.x, e.y, e.r);
    if(!h) continue;
    e.x += h.nx * h.pen; e.y += h.ny * h.pen;
    blocked = true;
    // 每帧只给一次切向助推，帮它绕开墙而不是顶死原地
    if(!slid && dt){
      slid = true;
      const side = (e.id % 2) ? 1 : -1;
      e.kx += -h.ny * 240 * side * dt; e.ky += h.nx * 240 * side * dt;
    }
  }
  return blocked;
}

// ---------------- 地形区效果 ----------------
function zoneAt(x, y){
  for(const z of zones){
    const dx = x - z.x, dy = y - z.y;
    if(dx * dx + dy * dy < z.r * z.r) return z;
  }
  return null;
}
function zoneSpeedMul(x, y){
  const z = zoneAt(x, y);
  if(!z) return 1;
  return z.kind === 'slow' ? 0.62 : 1.15;
}

// ---------------- 技能 ----------------
function tryDash(){
  const p = player;
  if(p.charges <= 0) return;
  let dx = p.moveDir.x, dy = p.moveDir.y;
  if(!dx && !dy){ dx = Math.cos(p.angle); dy = Math.sin(p.angle); }
  const l = Math.hypot(dx, dy) || 1;
  dx /= l; dy /= l;
  p.vx = dx * CFG.dashSpeed * M.dashSpd; p.vy = dy * CFG.dashSpeed * M.dashSpd;
  p.dashTime = CFG.dashTime;
  p.charges--;
  if(p.dashCd <= 0) p.dashCd = CFG.dashCd * M.dashCd;   // 开始为下一层充能
  p.dashHits = new Set();                              // 本次冲刺的撞击/撞死结算名单
  p.invuln = Math.max(p.invuln, CFG.dashTime + 0.12 + M.dashInv);
  if(M.dashEnergy > 0) p.energy = Math.min(p.maxEnergy, p.energy + M.dashEnergy);
  state.shake = Math.max(state.shake, 7);
  SFX.dash();
  spawnParticles(p.x, p.y, 20, 0x5ffbf1, 340, 0.45, 3.2);
  spawnRing(p.x, p.y, 0x5ffbf1, 70, 0.35, 3);
}

function tryHeal(){
  const p = player;
  if(p.healCd > 0 || p.energy < 30 || p.hp >= p.maxHp) return;
  p.energy -= 30;
  p.healCd = 3.5;
  const amt = 26 * M.heal;
  p.hp = Math.min(p.maxHp, p.hp + amt);
  addFloat(p.x, p.y - 26, '+' + Math.round(amt), 0x5affc8, 18);
  spawnParticles(p.x, p.y, 22, 0x5affc8, 180, 0.7, 3);
  spawnPlus(p.x, p.y, 0x5affc8);
  spawnRing(p.x, p.y, 0x5affc8, 90, 0.5, 3);
  SFX.heal();
}

function tryOverload(){
  const p = player;
  const cost = CFG.overloadCost * M.overCost;
  if(p.overload > 0 || p.energy < cost) return;
  p.energy -= cost;
  p.overload = CFG.overloadTime * M.overTime;
  state.shake = Math.max(state.shake, 15);
  state.flash = 0.5;

// ---------------- 等级 / 经验 / 卡牌 ----------------
function xpNeed(l){ return Math.round(34 + 22 * l + l * l * 1.6); }

function gainXp(v){
  v = v * M.xp;
  state.xp += v;
  let leveled = false;
  while(state.xp >= state.xpNeed){
    state.xp -= state.xpNeed;
    state.level++;
    state.xpNeed = xpNeed(state.level);
    state.pending++;
    leveled = true;
  }
  if(leveled && state.mode === 'playing'){
    spawnShards(player.x, player.y, 8, 0x5ffbf1, 1.2);
    spawnRing(player.x, player.y, 0x5ffbf1, 130, 0.5, 3);
    spawnSparks(player.x, player.y, 5, 0x5ffbf1, 1.1);
    openCards();
  }
}

function rollTier(){
  const L = state.level;
  const w = [
    Math.max(6, 46 - L * 3.2),
    30,
    Math.min(34, 13 + L * 1.5),
    Math.min(18, 3.5 + L * 1.1),
    Math.min(11, 0.8 + L * 0.75)
  ];
  const tot = w[0] + w[1] + w[2] + w[3] + w[4];
  let r = Math.random() * tot;
  for(let i = 0; i < 5; i++){ r -= w[i]; if(r <= 0) return i; }
  return 0;
}

function rollOffer(){
  // 特殊规则：第一次升级三选一是三张传说级祝福（吾二固定中间，喵雅喵/喵斯喵随机两边），之后永不出现
  if(!state.wuerDone){
    const cats = [{ def: MIAO_DEF, tier: 4 }, { def: MIAO2_DEF, tier: 4 }];
    if(Math.random() < 0.5) cats.reverse();
    return [cats[0], { def: WUER_DEF, tier: 4 }, cats[1]];
  }
  // 保底规则：三张卡中至少一张是常驻技能（随机槽位）；其余从全卡池随机，玩家自由组合流派
  const actSlot = Math.floor(Math.random() * 3);
  const seen = {};
  const out = [];
  let guard = 0;
  while(out.length < 3 && guard < 300){
    guard++;
    if(out.length === actSlot){
      out.push({ def: ACTIVE_DEFS[Math.floor(Math.random() * ACTIVE_DEFS.length)], tier: rollTier() });
      continue;
    }
    const i = Math.floor(Math.random() * CARD_DEFS.length);
    if(seen[i]) continue;
    seen[i] = 1;
    out.push({ def: CARD_DEFS[i], tier: rollTier() });
  }
  return out;
}

function refreshDerived(){
  const oldMax = player.maxHp;
  player.maxHp = Math.round(Math.max(40, 100 * M.hpMul) + M.hpAdd);
  if(player.maxHp > oldMax) player.hp += player.maxHp - oldMax;
  player.hp = clamp(player.hp, 1, player.maxHp);
  player.maxEnergy = Math.round(100 + M.enMax);
  player.energy = Math.min(player.energy, player.maxEnergy);
}

function openCards(){
  if(state.mode === 'dead') return;
  state.offer = rollOffer();
  state.mode = 'cards';
  buildCardUI();
  SFX.levelup();
}

function pickOffer(i){
  if(state.mode !== 'cards') return;
  const o = state.offer[i];
  if(!o) return;
  // 替换选择模式：offer 中的三张卡代表技能栏槽位
  if(state.pendingSkill){
    if(!player.actives[i]) return;
    const ps = state.pendingSkill;
    const def = ACTIVE_BY_ID[ps.id];
    const oldName = ACTIVE_BY_ID[player.actives[i].id].n;
    player.actives[i] = { id: ps.id, lv: ps.lv, cd: 0 };
    state.pendingSkill = null;
    SFX.card();
    addFloat(player.x, player.y - 40, `${def.n} 替换 ${oldName}`, def.c, 16);
    spawnRing(player.x, player.y, def.c, 130, 0.5, 3);
    settlePick();
    return;
  }
  o.def.a(M, o.def.v[o.tier]);
  if(o.def === WUER_DEF || o.def === MIAO_DEF || o.def === MIAO2_DEF) state.wuerDone = true;
  state.cards.push({ n: o.def.n, t: o.tier, c: o.def.c });
  refreshDerived();
  SFX.card();
  addFloat(player.x, player.y - 40, o.def.n, o.def.c, 18);
  spawnRing(player.x, player.y, o.def.c, 150, 0.5, 4);
  spawnParticles(player.x, player.y, 24, o.def.c, 300, 0.6, 3);
  // 常驻技能：入栏 / 升阶；栏满则先走替换流程再结算本次升级
  if(o.def.skill && gainActive(o.def, o.tier)){
    buildReplaceUI();
    return;
  }
  settlePick();
}

function settlePick(){
  state.pending--;
  if(state.pending > 0){
    state.offer = rollOffer();
    buildCardUI();
  } else {
    state.mode = 'playing';
    clearCardUI();
  }
}

function spawnPickup(x, y, kind){
  const glow = POOL.pkGlow.get(), core = POOL.pkCore.get(), dot = POOL.pkDot.get(), tether = POOL.tether.get();
  if(!glow || !core || !dot){ rel(glow); rel(core); rel(dot); rel(tether); return; }
  const u = {
    x, y, vx: rand(-140, 140), vy: rand(-140, 140), kind,
    life: 13 + M.pickLife, maxLife: 13 + M.pickLife,
    phase: Math.random() * TAU, sprites: [glow, core, dot, tether]
  };
  if(kind === 'power') u.pw = POWER_TYPES[Math.floor(Math.random() * POWER_TYPES.length)];
  pickups.push(u);
  if(pickups.length > 36){
    const drop = pickups.shift();
    for(const s of drop.sprites) rel(s);
  }
}

function dropLoot(e){
  const dm = Math.min(3, M.drop);
  if(e.type === 'boss'){
    for(let i = 0; i < 6; i++) spawnPickup(e.x + rand(-34, 34), e.y + rand(-34, 34), 'energy');
    spawnPickup(e.x, e.y, 'heal');
    spawnPickup(e.x + 22, e.y - 10, 'power');
    spawnPickup(e.x - 22, e.y + 12, 'shield');
    return;
  }
  if(e.type === 'mini' || e.type === 'pig'){
    if(Math.random() < 0.16 * dm) spawnPickup(e.x, e.y, 'energy');
    return;
  }
  const r = Math.random();
  if(r < 0.28 * dm) spawnPickup(e.x, e.y, 'energy');
  else if(r < 0.38 * dm) spawnPickup(e.x, e.y, 'power');
  else if(r < 0.44 * dm) spawnPickup(e.x, e.y, 'heal');
  else if(r < 0.47 * dm) spawnPickup(e.x, e.y, 'shield');
}

function collectPickup(u){
  const p = player;
  if(u.kind === 'energy'){
    const amt = 14 * M.pickE;
    p.energy = Math.min(p.maxEnergy, p.energy + amt);
    addFloat(u.x, u.y - 10, '+' + Math.round(amt), 0x5ffbf1, 13);
    spawnParticles(u.x, u.y, 6, 0x5ffbf1, 160, 0.35, 2.2);
    SFX.pickup();
  } else if(u.kind === 'heal'){
    const amt = 12 * M.pickE;
    p.hp = Math.min(p.maxHp, p.hp + amt);
    addFloat(u.x, u.y - 10, '+' + Math.round(amt) + ' HP', 0x5affc8, 15);
    spawnParticles(u.x, u.y, 8, 0x5affc8, 180, 0.4, 2.4);
    spawnPlus(u.x, u.y, 0x5affc8);
    SFX.heal();
  } else if(u.kind === 'shield'){
    p.shield = Math.min(M.shieldCap, p.shield + 1);
    addFloat(u.x, u.y - 10, '护盾', 0x7fb8ff, 15);
    spawnParticles(u.x, u.y, 10, 0x7fb8ff, 200, 0.45, 2.6);
    spawnRing(u.x, u.y, 0x7fb8ff, 60, 0.4, 3);
    SFX.shieldUp();
  } else {
    const info = POWER_INFO[u.pw];
    p.powerType = u.pw;
    p.powerMax = 9;
    p.power = p.powerMax;
    addFloat(u.x, u.y - 12, info.name, info.color, 17);
    spawnParticles(u.x, u.y, 16, info.color, 240, 0.6, 3);
    spawnRing(u.x, u.y, info.color, 80, 0.55, 3.5);
    SFX.power();
  }
}

function updatePickups(dt){
  const p = player;
  const magnet = state.magnetize > 0 ? 4000 : 165 * M.magnet;
  for(let i = pickups.length - 1; i >= 0; i--){
    const u = pickups[i];
    u.life -= dt; u.phase += dt * 3;
    if(u.life <= 0){ for(const s of u.sprites) rel(s); pickups.splice(i, 1); continue; }
    const dx = p.x - u.x, dy = p.y - u.y;
    const d = Math.hypot(dx, dy) || 1;
    if(state.mode === 'playing' && d < magnet){
      const pull = (1 - d / magnet) * 1900;
      u.vx += (dx / d) * pull * dt;
      u.vy += (dy / d) * pull * dt;
    }
    u.vx *= Math.exp(-2.2 * dt); u.vy *= Math.exp(-2.2 * dt);
    u.x += u.vx * dt; u.y += u.vy * dt;
    u.x = clamp(u.x, 14, world.w - 14);
    u.y = clamp(u.y, 14, world.h - 14);
    if(state.mode === 'playing' && d < p.r + 20){
      collectPickup(u);
      for(const s of u.sprites) rel(s);
      pickups.splice(i, 1);
    }
  }
}

  const e = {
    id: ++idSeq, type, x, y, vx: 0, vy: 0, r: b.r * (elite ? 1.22 : 1),
    hp, maxHp: hp, elite, master,
    speed: b.speed * (1 + (state.wave - 1) * 0.02) * M.foeSpd * (elite ? 0.94 : 1),
    color: b.color, dmg: b.dmg * (elite ? 1.4 : 1), score: b.score * (elite ? 3 : 1),
    hitFlash: 0, shootCd: rand(1.0, 2.0), wob: Math.random() * TAU,
    kx: 0, ky: 0,
    spawnT: type === 'mini' ? 0.2 : (type === 'boss' ? 1.25 : 0.45),
    chargeCd: rand(5, 8), tele: 0, chargeT: 0, dirX: 0, dirY: 0, shotToggle: 0,
    summonCd: 6, enraged: false,
    slowT: 0, slowAmt: 0,
    sprites: [halo, rim, body, darkCore, core, hpBg, hpFill, portal, aura, bloom, orbit, eye, arc, eliteRim, aura2]
  };
  enemies.push(e);
  // 池精灵可能残留血条槽位的 anchor(0, 0.5)，统一重置（血条槽位每帧会自行设置）
  for(const s of e.sprites) if(s) s.anchor.set(0.5);
  spawnRing(x, y, b.color, Math.min(138, b.r * 3.4), 0.45, 2.5);
  if(elite){
    spawnRing(x, y, 0xffc83d, Math.min(138, e.r * 3.8), 0.6, 2.5);
    addFloat(x, y - e.r - 18, 'ELITE', 0xffc83d, 13);
  }
  if(type === 'boss'){
    // 阶级 = BOSS 波序号：体积 / 生命 / 伤害 / 弹幕强度逐阶提升
    const t = Math.max(1, Math.round(state.wave / 5));
    e.bossTier = t;
    if(t === 1){
      // 第一只 BOSS：喵叶喵（沉默的戳戳怪，零弹幕近战刺客）
      e.bossKind = 8;
      e.color = MIAOYE.color;
      e.r = BASE.boss.r * 0.9;
      e.hp = e.maxHp = Math.round(e.hp * MIAOYE.hp);
      e.dmg *= MIAOYE.dmg;
      e.speed *= MIAOYE.spd;
    } else if(t === 2){
      // 第二只 BOSS：吾二三态随机一体（外形、颜色与技能各不相同）
      e.wuerKind = Math.floor(Math.random() * 3);
      e.bossKind = 5 + e.wuerKind;               // >=5 走吾二专用 AI，避开常规分派
      const wk = WUER_KINDS[e.wuerKind];
      e.color = wk.color;
      e.r = BASE.boss.r * (1 + 0.16 * (t - 1));
      e.hp = e.maxHp = Math.round(e.hp * (1 + 0.32 * (t - 1)) * wk.hp);
      e.dmg *= (1 + 0.13 * (t - 1)) * wk.dmg;
      e.speed *= (1 + 0.05 * (t - 1)) * wk.spd;
    } else {
      e.bossKind = (t - 1) % BOSS_KINDS.length;
      e.color = BOSS_KINDS[e.bossKind].color;
      e.r = BASE.boss.r * (1 + 0.16 * (t - 1));
      e.hp = e.maxHp = Math.round(e.hp * (1 + 0.32 * (t - 1)));
      e.dmg *= 1 + 0.13 * (t - 1);
      e.speed *= 1 + 0.05 * (t - 1);
    }
    e.blinkCd = 4; e.spiralT = 0; e.chainLeft = 0; e.ringCd = 3;
    // 喵叶喵专用状态（潜行 / 戳刺 / 撅臀冲撞状态机）
    e.myState = 'stalk'; e.myT = 0; e.myCd = 2.4; e.myButtCd = 6; e.pokeActive = 0;
    // 吾二专用状态（隐身 / 凑凑弹幕 / 猪猪召唤 / 温柔乡计时器）
    e.vis = 1; e.stealth = 0; e.stealthT = 4;
    e.coucouCd = 4; e.pigCd = 3; e.slowRingCd = 3; e.slowWarn = 0;
    bossEntrance(e);
  }
  return e;
}

// BOSS 登场：冲击波湮灭场上小怪（半分、少量经验、不掉落），震屏 + 闪光 + 停顿营造压迫感
function bossEntrance(b){
  let cleared = 0;
  for(let i = enemies.length - 1; i >= 0; i--){
    const o = enemies[i];
    if(o === b || o.type === 'boss') continue;
    spawnParticles(o.x, o.y, 14, o.color, 300, 0.5, 3);
    spawnShards(o.x, o.y, 5, o.color, 0.9);
    spawnSparks(o.x, o.y, 3, 0xffffff, 1);
    state.score += Math.round(o.score * 0.5 * M.score);
    gainXp(o.score * 0.3);
    for(const s of o.sprites) rel(s);
    enemies.splice(i, 1);
    cleared++;
  }
  state.shake = Math.max(state.shake, 20);
  state.flash = Math.max(state.flash, 0.4);
  state.hitStop = Math.max(state.hitStop, 0.22);
  spawnRing(b.x, b.y, b.color, 138, 0.7, 3);
  spawnRing(b.x, b.y, 0xffffff, 100, 0.5, 2.5);
  spawnShards(b.x, b.y, 14, b.color, 1.6);
  const kName = bossNameOf(b);
  addFloat(b.x, b.y - b.r - 30, '!! ' + kName + ' 降临 !!', b.color, 24);
  if(b.wuerKind !== undefined) addFloat(b.x, b.y + b.r + 24, WUER_KINDS[b.wuerKind].tip, 0xffffff, 14);
  if(b.bossKind === 8) addFloat(b.x, b.y + b.r + 24, MIAOYE.tip, 0xffffff, 14);
  if(cleared > 0) addFloat(b.x, b.y + b.r + 22, '湮灭 ×' + cleared, 0xffd7f4, 15);
  tone(70, 0.7, 'sawtooth', 0.28, 36);
  noiseHit(0.5, 0.2, 300, 0.8);
}

function spawnEnemy(type){
  const m = 70;
  let x = 0, y = 0;
  for(let k = 0; k < 6; k++){
    const side = Math.floor(Math.random() * 4);
    if(side === 0){ x = rand(m, world.w - m); y = m; }
    else if(side === 1){ x = world.w - m; y = rand(m, world.h - m); }
    else if(side === 2){ x = rand(m, world.w - m); y = world.h - m; }
    else { x = m; y = rand(m, world.h - m); }
    if(Math.hypot(x - player.x, y - player.y) > 450) break;
  }
  const eliteP = state.wave >= 6 ? Math.min(0.26, (state.wave - 5) * 0.045) : 0;
  spawnEnemyAt(type, x, y, type !== 'mini' && type !== 'boss' && Math.random() < eliteP);
}

function startWave(n){
  state.wave = n;
  // 每隔几波随机换一张新地图（场地清空的瞬间最安全；BOSS 波不换）
  if(MAP_SWITCH_WAVES > 0 && n > 1 && n % MAP_SWITCH_WAVES === 0 && n % 5 !== 0) reshuffleMap();
  const q = [];
  const bossWave = n % 5 === 0;
  let count = Math.min(15, Math.round((3 + n * 1.55) * Math.min(1.6, M.spawnMul || 1)));
  if(bossWave) count = Math.round(count * 0.55);
  // 波次越高：追猎者权重下降，高级兵种陆续解锁并占比上升
  const table = [['chaser', Math.max(30, 100 - n * 5)]];
  if(n >= 2) table.push(['turret', 30 + n * 2]);
  if(n >= 3) table.push(['stinger', 24 + n * 2.5]);
  if(n >= 3) table.push(['tank', 20 + n * 1.8]);
  if(n >= 4) table.push(['splitter', 18 + n * 1.6]);
  if(n >= 6) table.push(['weaver', 15 + n * 1.7]);
  if(n >= 8) table.push(['carrier', 10 + n * 1.3]);
  const tot = table.reduce((s, t) => s + t[1], 0);
  for(let i = 0; i < count; i++){
    let r = Math.random() * tot, t = 'chaser';
    for(const [name, w] of table){ r -= w; if(r <= 0){ t = name; break; } }
    q.push(t);
  }
  // BOSS 波：BOSS 压轴登场，入场时湮灭残余小怪（喵雅喵的祝福：第二轮 BOSS 双子吾二）
  if(bossWave){
    q.push('boss');
    if(n === 10 && state.miaoBless) q.push('boss');
  }
  state.spawnQueue = q;
  state.spawnTimer = 0.5;
  SFX.wave();
  addFloat(player.x, player.y - 120, bossWave ? 'WAVE ' + n + ' · BOSS' : 'WAVE ' + n, bossWave ? 0xff2fd0 : 0x5ffbf1, 20);
  spawnRing(player.x, player.y, bossWave ? 0xff2fd0 : 0x5ffbf1, 138, 0.85, 5);
}

function updateSpawner(dt){
  if(state.spawnQueue.length > 0){
    state.spawnTimer -= dt;
    if(state.spawnTimer <= 0){
      state.spawnTimer = Math.max(0.22, 0.62 - state.wave * 0.02) * M.spawnDelay;
      spawnEnemy(state.spawnQueue.shift());
    }
  } else if(enemies.length === 0){
    if(!state.waveClear){
      state.waveClear = true;
      const bonus = Math.round(50 * state.wave * M.score);
      state.score += bonus;
      if(M.waveShield > 0){
        player.shield = Math.min(M.shieldCap, player.shield + M.waveShield);
      }
      addFloat(player.x, player.y - 70, 'WAVE CLEAR  +' + bonus, 0xffe45c, 18);
      spawnRing(player.x, player.y, 0x5ffbf1, Math.max(W, H) * 0.9, 1.1, 5);
      spawnRing(player.x, player.y, 0xffe45c, Math.max(W, H) * 0.7, 0.9, 3);
      SFX.clear();
      gainXp(14 + state.wave * 2);
      player.energy = Math.min(player.maxEnergy, player.energy + 25);
    }
    state.waveTimer -= dt;
    if(state.waveTimer <= 0){
      state.waveClear = false;
      startWave(state.wave + 1);
      state.waveTimer = 2.6;
    }
  }
}

// ---------------- 伤害 ----------------
function damageEnemy(e, dmg, kx, ky){
  if(e.hp <= 0) return;
  if(M.exec > 0 && e.hp < e.maxHp * 0.35) dmg *= 1 + M.exec;
  e.hp -= dmg;
  // 温柔的吾二：受到伤害的一部分转为自身治疗（濒死/未成形时不触发）
  if(e.hp > 0 && e.wuerKind === 1 && e.spawnT <= 0){
    const heal = dmg * WUER_HEAL;
    e.hp = Math.min(e.maxHp, e.hp + heal);
    if(gate('wuerHeal', 160)){
      addFloat(e.x + rand(-10, 10), e.y - e.r - 8, '+' + Math.round(heal), 0x5affc8, 13);
      spawnParticles(e.x, e.y, 3, 0x5affc8, 120, 0.4, 2);
    }
  }
  e.hitFlash = 0.14;
  e.kx += kx; e.ky += ky;
  if(M.ls > 0 && state.mode === 'playing'){
    player.hp = Math.min(player.maxHp, player.hp + dmg * M.ls);
  }
  addFloat(e.x + rand(-8, 8), e.y - e.r, Math.round(dmg), 0xffe45c, 14);
  spawnParticles(e.x, e.y, 4, e.color, 200, 0.35, 2.6);
  spawnSparks(e.x, e.y, 2, e.color, 0.9);
  SFX.hit();
  if(e.hp <= 0) killEnemy(e);
}

// 范围溅射：先快照再遍历，并做存活校验。
// 直接在 enemies 上倒序下标遍历有隐患——一次波及多杀会让数组缩短，后续 enemies[i] 变 undefined。
function splashDamage(x, y, radius, dmg, kxScale){
  const list = enemies.slice();
  let hits = 0;
  for(const o of list){
    if(!o || o.hp <= 0 || enemies.indexOf(o) < 0) continue;
    const d = Math.hypot(o.x - x, o.y - y);
    if(d < radius + o.r){
      hits++;
      damageEnemy(o, dmg, (o.x - x) / (d || 1) * kxScale, (o.y - y) / (d || 1) * kxScale);
    }
  }
  return hits;
}

function killEnemy(e){
  const idx = enemies.indexOf(e);
  if(idx < 0) return;
  enemies.splice(idx, 1);
  for(const s of e.sprites) rel(s);

  state.combo++;
  state.comboTimer = 3.0 + M.comboKeep;
  if(state.combo > 0 && state.combo % 10 === 0){
    state.novaFlash = Math.max(state.novaFlash, 0.26);
    spawnRing(player.x, player.y, 0xffe45c, 280, 0.5, 4);
    spawnSparks(player.x, player.y, 6, 0xffe45c, 1.4);
  }
  const mult = 1 + state.combo * M.comboScale;
  const gain = Math.round(e.score * mult * M.score);
  state.score += gain;

  if(state.combo % Math.max(4, M.novaEvery) === 0) comboNova(e.x, e.y);

  if(M.killHeal > 0) player.hp = Math.min(player.maxHp, player.hp + M.killHeal);
  gainXp(e.score * 0.5 + 3);

  player.energy = Math.min(player.maxEnergy, player.energy + (e.type === 'boss' ? 45 : 6));
  state.shake = Math.max(state.shake, e.type === 'boss' ? 22 : 6);

  const isBoss = e.type === 'boss';
  spawnParticles(e.x, e.y, isBoss ? 90 : 24, e.color, isBoss ? 620 : 340, 0.85, 3.6);
  spawnRing(e.x, e.y, e.color, isBoss ? 138 : 90, isBoss ? 0.9 : 0.45, isBoss ? 6 : 3);
  spawnShards(e.x, e.y, isBoss ? 22 : 7, e.color, isBoss ? 1.9 : 1);
  spawnSparks(e.x, e.y, isBoss ? 12 : 4, e.color, isBoss ? 2.2 : 1.2);
  if(e.elite){
    spawnRing(e.x, e.y, 0xffc83d, 110, 0.5, 3);
    spawnShards(e.x, e.y, 9, 0xffc83d, 1.3);
  }
  addFloat(e.x, e.y - 14, '+' + gain, 0x5ffbf1, isBoss ? 26 : 16);
  SFX.kill();

  // 击杀爆炸（卡片）
  if(M.boomR > 0 && !isBoss){
    spawnRing(e.x, e.y, 0xff9a6a, M.boomR, 0.3, 3);
    splashDamage(e.x, e.y, M.boomR, M.boomD, 200);
  }

  dropLoot(e);

  const chainR = (isBoss ? 180 : 92) * M.chainR;
  const chainDmg = (isBoss ? 60 : 12 + state.wave * 1.2) * M.chainD;
  const chained = splashDamage(e.x, e.y, chainR, chainDmg, 260);
  if(chained > 0){
    spawnRing(e.x, e.y, 0xffb347, chainR, 0.4, 3);
    SFX.chain();
    addFloat(e.x, e.y - e.r - 26, 'CHAIN ×' + chained, 0xffb347, 15);
  }

  if(e.type === 'splitter' || e.type === 'carrier'){
    const minis = e.type === 'carrier' ? 3 : 2;
    for(let i = 0; i < minis; i++) spawnEnemyAt('mini', e.x + rand(-20, 20), e.y + rand(-20, 20), false, e.type === 'carrier' ? e.id : null);
    addFloat(e.x, e.y - e.r - 40, 'SPLIT!', e.type === 'carrier' ? 0xff5e3d : 0x86ff5e, 14);
    SFX.split();
  }

  if(isBoss){ state.flash = 0.6; state.hitStop = 0.12; }
}

function hurtPlayer(dmg, src){
  const p = player;
  if(p.invuln > 0 || state.mode !== 'playing') return;

  if(p.shield > 0){
    p.shield--;
    p.invuln = 0.6;
    addFloat(p.x, p.y - 30, '护盾抵挡', 0x7fb8ff, 16);
    spawnRing(p.x, p.y, 0x7fb8ff, 120, 0.45, 4);
    spawnParticles(p.x, p.y, 18, 0x7fb8ff, 300, 0.5, 2.8);
    SFX.shieldBreak();
    return;
  }

  dmg *= M.dmgTaken;
  if(p.blessDmg > 0) dmg *= 0.7;   // 吾二的祝福：受伤 -30%
  if(p.dashGuardT > 0) dmg *= 0.5; // 余势护体：冲刺后短暂受伤减半
  if(M.thorns > 0 && src) damageEnemy(src, M.thorns, 0, 0);

  p.hp -= dmg;
  p.invuln = 0.75 + M.invuln;
  p.hitFlash = 0.3;
  p.rebound = 0;
  state.combo = 0; state.comboTimer = 0;
  state.shake = Math.max(state.shake, 14);
  state.flash = 0.35;
  state.hitStop = 0.05;
  spawnParticles(p.x, p.y, 20, 0xff3d6e, 300, 0.6, 3);
  spawnRing(p.x, p.y, 0xff3d6e, 110, 0.45, 3.5);
  spawnShards(p.x, p.y, 9, 0xff3d6e, 1.2);
  spawnSparks(p.x, p.y, 4, 0xff3d6e, 1.3);
  SFX.hurt();

  if(p.hp <= 0){
    if(M.revives - p.reviveUsed > 0){
      p.reviveUsed++;
      p.hp = p.maxHp * 0.5;
      p.invuln = 2.5;
      spawnRing(p.x, p.y, 0xffffff, 380, 1.0, 6);
      spawnParticles(p.x, p.y, 60, 0xffffff, 460, 0.9, 3.6);
      addFloat(p.x, p.y - 40, '不屈复活', 0xffffff, 22);
      state.flash = 0.5;
      return;
    }
    p.hp = 0;
    state.mode = 'dead';
    state.best = Math.max(state.best, state.score);
    state.shake = 26;
    spawnParticles(p.x, p.y, 70, 0x5ffbf1, 520, 1.2, 4);
    spawnRing(p.x, p.y, 0x5ffbf1, 420, 1.2, 6);
    spawnRing(p.x, p.y, 0xff3d6e, 300, 0.9, 4);
    SFX.dead();
  }
}

// ---------------- 风暴 ----------------
function updateStorms(dt){
  state.stormCd -= dt;
  if(state.stormCd <= 0 && storms.length < 2 && state.wave >= 3){
    state.stormCd = rand(7, 12);
    let x = 0, y = 0, guard = 0;
    do{
      x = rand(180, world.w - 180);
      y = rand(180, world.h - 180);
      guard++;
    } while(guard < 20 && Math.hypot(x - player.x, y - player.y) < 300);
    const fill = POOL.storm.get(), ring = POOL.storm.get();
    if(fill && ring) storms.push({ x, y, r: rand(120, 190), phase: 'warn', t: 1.25, sprites: [fill, ring] });
    SFX.stormWarn();
  }
  for(let i = storms.length - 1; i >= 0; i--){
    const s = storms[i];
    s.t -= dt;
    if(s.phase === 'warn' && s.t <= 0){
      s.phase = 'blast';
      s.t = 0.45;
      spawnRing(s.x, s.y, 0xff8c28, s.r * 1.15, 0.5, 5);
      spawnParticles(s.x, s.y, 26, 0xff8c28, 420, 0.6, 3);
      spawnShards(s.x, s.y, 12, 0xff8c28, 1.3);
      state.shake = Math.max(state.shake, 8);
      SFX.stormBlast();
      splashDamage(s.x, s.y, s.r, 30 + state.wave * 2, 420);
      const pd = Math.hypot(player.x - s.x, player.y - s.y);
      if(pd < s.r && !M.stormSafe) hurtPlayer(14);
    } else if(s.phase === 'blast' && s.t <= 0){
      for(const sp of s.sprites) rel(sp);
      storms.splice(i, 1);
    }
  }
}

// ---------------- 玩家 ----------------
function updateAim(){
  let best = null, bd = Infinity;
  for(const e of enemies){
    const d = (e.x - player.x) ** 2 + (e.y - player.y) ** 2;
    if(d < bd){ bd = d; best = e; }
  }
  if(best) player.angle = Math.atan2(best.y - player.y, best.x - player.x);
  else {
    const sp = Math.hypot(player.vx, player.vy);
    if(sp > 60) player.angle = Math.atan2(player.vy, player.vx);
  }
}

function tryFire(){
  const p = player;
  if(p.fireCd > 0 || state.mode !== 'playing') return;

  const over = p.overload > 0;
  const pow = p.power > 0 ? p.powerType : null;
  const bless = p.blessShot > 0;
  const fren = p.frenzy > 0;
  const cou = p.coucouT > 0;   // 凑凑弹幕：射速-90% · 伤害+150%
  let rate = CFG.fireRate * M.rate;
  if(cou) rate *= 10;
  if(pow === 'rapid') rate *= 0.55;
  if(fren) rate *= 0.625;
  p.fireCd = Math.max(0.03, rate);

  const a = p.angle;
  const muzzle = p.r + 8;
  let dmg = CFG.bulletDmg * M.dmg * CFG_OVERMUL(over) * (fren ? 1.4 : 1);
  if(cou) dmg *= 2.5;
  const baseCol = cou ? 0xffc83d : (bless ? 0xffc83d : (fren ? 0xff9a6a : (over ? 0xffe45c : (pow ? POWER_INFO[pow].color : 0x5ffbf1))));
  p.shotN++;

  const angles = [0];
  if(pow === 'triple') angles.length = 0, angles.push(-0.17, 0, 0.17);
  for(let k = 1; k <= M.extraShots; k++){
    angles.push(0.16 * k, -0.16 * k);
  }
  // 吾二的祝福：弹道数量 ×10，扇形展开
  if(bless){
    const n2 = Math.min(40, angles.length * 10);
    const spread = Math.min(1.35, 0.1 * (n2 - 1));
    angles.length = 0;
    for(let k = 0; k < n2; k++) angles.push(-spread / 2 + spread * k / (n2 - 1));
  }

  for(const off of angles){
    const aa = a + off + rand(-0.02, 0.02);
    const big = 1;
    const made = mkBullet({
      x: p.x + Math.cos(aa) * muzzle,
      y: p.y + Math.sin(aa) * muzzle,
      vx: Math.cos(aa) * CFG.bulletSpeed * M.bSpd,
      vy: Math.sin(aa) * CFG.bulletSpeed * M.bSpd,
      r: (over ? 6 : 5) * M.bR * big,
      dmg: (pow === 'pierce' ? dmg * 1.25 : dmg) * big,
      life: 2.2 * M.bLife,
      bounces: 4 + M.bounce,
      col: baseCol,
      pierce: (pow === 'pierce' ? 3 : 0) + M.pierce,
      homing: pow === 'homing' ? 5.5 : M.homing,
      hot: 0, hitIds: []
    });
    if(!made) break;
  }

  p.vx -= Math.cos(a) * (over ? 34 : 52) / Math.max(0.4, Math.sqrt(M.dmg));
  p.vy -= Math.sin(a) * (over ? 34 : 52) / Math.max(0.4, Math.sqrt(M.dmg));

  spawnParticles(p.x + Math.cos(a) * muzzle, p.y + Math.sin(a) * muzzle, 4, baseCol, 160, 0.22, 2.2);
  SFX.shoot();
}
function CFG_OVERMUL(over){ return over ? 2 : 1; }

function addReboundStack(x, y){
  const p = player;
  if(p.rebound >= M.reboundMax){ p.reboundT = 2.5; return; }
  p.rebound++;
  p.reboundT = 2.5;
  spawnRing(x, y, 0xffb347, 40, 0.3, 2);
  addFloat(x, y - 20, '反弹 ×' + p.rebound, 0xffb347, 12);
}

function updatePlayer(dt){
  const p = player;
  p.invuln = Math.max(0, p.invuln - dt);
  p.fireCd = Math.max(0, p.fireCd - dt);
  // 冲刺充能：充能未满时按 CD 逐层回复（基础 1 层，双重冲刺卡可扩）
  const maxCh = 1 + M.dashCharges;
  if(p.charges < maxCh){
    p.dashCd -= dt;
    if(p.dashCd <= 0){ p.charges++; p.dashCd = p.charges < maxCh ? CFG.dashCd * M.dashCd : 0; }
  } else p.dashCd = 0;
  p.healCd = Math.max(0, p.healCd - dt);
  p.overload = Math.max(0, p.overload - dt);
  p.hitFlash = Math.max(0, p.hitFlash - dt);
  const wasDashing = p.dashTime > 0;
  p.dashTime = Math.max(0, p.dashTime - dt);
  if(wasDashing && p.dashTime <= 0){
    if(M.dashBoomD > 0){   // 爆裂冲刺：冲刺结束引爆周围
      splashDamage(p.x, p.y, M.dashBoomR, M.dashBoomD * M.dashDmg, 520);
      spawnRing(p.x, p.y, 0x7fb8ff, Math.min(138, M.dashBoomR), 0.4, 3);
      spawnParticles(p.x, p.y, 18, 0x7fb8ff, 320, 0.5, 3);
      SFX.chain();
    }
    if(M.dashGuard > 0) p.dashGuardT = M.dashGuard;   // 余势护体
    p.ramMul = 0;
  }
  p.dashGuardT = Math.max(0, p.dashGuardT - dt);
  // 卫星刃环：环绕刀刃按节拍切割
  if(p.orbitT > 0){
    p.orbitT = Math.max(0, p.orbitT - dt);
    p.orbitTick -= dt;
    if(p.orbitTick <= 0){
      p.orbitTick = 0.3;
      const hitN = splashDamage(p.x, p.y, 100, p.orbitDmg, 260);
      spawnRing(p.x, p.y, 0xff9ad5, 100, 0.3, 2);
      if(hitN > 0) SFX.hit();
    }
  }
  p.power = Math.max(0, p.power - dt);
  if(p.power <= 0) p.powerType = null;
  p.reboundT = Math.max(0, p.reboundT - dt);
  if(p.reboundT <= 0) p.rebound = 0;
  p.blessDmg = Math.max(0, p.blessDmg - dt);
  p.blessShot = Math.max(0, p.blessShot - dt);
  p.frenzy = Math.max(0, p.frenzy - dt);
  p.webSlow = Math.max(0, p.webSlow - dt);
  p.coucouT = Math.max(0, p.coucouT - dt);
  for(const s of p.actives) s.cd = Math.max(0, s.cd - dt);

  if(M.idleHeal > 0 && !keys['KeyW'] && !keys['KeyA'] && !keys['KeyS'] && !keys['KeyD'] && !joy.active){
    p.hp = Math.min(p.maxHp, p.hp + M.idleHeal * dt);
  }

  const overMul = p.overload > 0 ? M.overRegen : 1;
  const pz = zoneAt(p.x, p.y);
  p.energy = Math.min(p.maxEnergy, p.energy + 7 * M.enRegen * overMul * (pz && pz.kind === 'boost' ? 2.4 : 1) * dt);

  let ax = 0, ay = 0;
  if(keys['KeyW']) ay -= 1;
  if(keys['KeyS']) ay += 1;
  if(keys['KeyA']) ax -= 1;
  if(keys['KeyD']) ax += 1;
  const l = Math.hypot(ax, ay);
  if(l > 0){ ax /= l; ay /= l; }
  if(joy.active){ ax = joy.dx; ay = joy.dy; }   // 触屏摇杆（带死区的模拟量）
  p.moveDir.x = ax; p.moveDir.y = ay;

  if(p.dashTime <= 0){
    const boost = 1 + 0.09 * M.reboundPer * p.rebound;
    const accMul = (p.overload > 0 ? 1.35 : 1) * boost;
    p.vx += ax * CFG.accel * M.acc * accMul * dt;
    p.vy += ay * CFG.accel * M.acc * accMul * dt;
    const damp = Math.exp(-CFG.damp * dt);
    p.vx *= damp; p.vy *= damp;
    const sp = Math.hypot(p.vx, p.vy);
    const maxSp = CFG.maxSpeed * M.spd * (p.overload > 0 ? 1.12 : 1) * boost * (p.webSlow > 0 ? 0.55 : 1) * zoneSpeedMul(p.x, p.y);
    if(sp > maxSp){ p.vx = p.vx / sp * maxSp; p.vy = p.vy / sp * maxSp; }
  }

  p.x += p.vx * dt;
  p.y += p.vy * dt;

  const r = p.r;
  if(p.x < r){ p.x = r; p.vx = Math.abs(p.vx) * M.wallKeep; wallFeedback('l'); }
  if(p.x > world.w - r){ p.x = world.w - r; p.vx = -Math.abs(p.vx) * M.wallKeep; wallFeedback('r'); }
  if(p.y < r){ p.y = r; p.vy = Math.abs(p.vy) * M.wallKeep; wallFeedback('t'); }
  if(p.y > world.h - r){ p.y = world.h - r; p.vy = -Math.abs(p.vy) * M.wallKeep; wallFeedback('b'); }

  const hits = reflectSolids(p, p.r, M.wallKeep, (x, y) => {
    SFX.pillar();
    spawnParticles(x, y, 5, 0x5ffbf1, 140, 0.3, 2);
    spawnRing(x, y, 0x5ffbf1, 44, 0.28, 2);
    addReboundStack(x, y);
  });
  // 墙角脱困：明明在推方向却被夹住不动，沿障碍切向推一把
  if(hits && (p.moveDir.x || p.moveDir.y) && Math.hypot(p.vx, p.vy) < 70){
    const nx = p.hitNx || 0, ny = p.hitNy || 0;
    let tx = -ny, ty = nx;
    if(tx * p.moveDir.x + ty * p.moveDir.y < 0){ tx = -tx; ty = -ty; }
    p.vx += tx * 150; p.vy += ty * 150;
  }

  p.trail.push({ x: p.x, y: p.y, a: 1 });
  if(p.trail.length > 14) p.trail.shift();
  for(const t of p.trail) t.a *= 0.9;

  if(p.power > 0){
    const info = POWER_INFO[p.powerType];
    for(let i = 0; i < 3; i++){
      const sa = state.time * 3 + i * TAU / 3;
      const sx = p.x + Math.cos(sa) * 34, sy = p.y + Math.sin(sa) * 34;
      for(let j = ebullets.length - 1; j >= 0; j--){
        const b = ebullets[j];
        if(Math.hypot(b.x - sx, b.y - sy) < 14){
          spawnParticles(b.x, b.y, 6, info.color, 220, 0.35, 2.4);
          freeEBullet(b);
          ebullets.splice(j, 1);
        }
      }
    }
  }

  updateAim();
  if(keys['KeyJ']) tryFire();

  if(p.overloadPrev > 0 && p.overload <= 0 && M.kami) comboNova(p.x, p.y);
  p.overloadPrev = p.overload;
}

function wallFeedback(side){
  const sp = Math.hypot(player.vx, player.vy);
  if(side) wallGlow[side] = Math.min(1, wallGlow[side] + sp / 900);
  if(sp > 120){
    SFX.bounce();
    spawnParticles(player.x, player.y, 4, 0x5ffbf1, 130, 0.28, 2);
    addReboundStack(player.x, player.y);
  }
}

// ---------------- 子弹 ----------------
function updateBullets(dt){
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.life -= dt;

    if(b.homing > 0){
      let tg = null, td = 420 * 420;
      for(const e of enemies){
        const dx = e.x - b.x, dy = e.y - b.y;
        const d = dx * dx + dy * dy;
        if(d < td){ td = d; tg = e; }
      }
      if(tg){
        const sp = Math.hypot(b.vx, b.vy);
        const cur = Math.atan2(b.vy, b.vx);
        let diff = Math.atan2(tg.y - b.y, tg.x - b.x) - cur;
        while(diff > Math.PI) diff -= TAU;
        while(diff < -Math.PI) diff += TAU;
        const na = cur + clamp(diff, -b.homing * dt, b.homing * dt);
        b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
      }
    }

    b.x += b.vx * dt; b.y += b.vy * dt;

    let bounced = false;
    if(b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx); bounced = true; }
    if(b.x > world.w - b.r){ b.x = world.w - b.r; b.vx = -Math.abs(b.vx); bounced = true; }
    if(b.y < b.r){ b.y = b.r; b.vy = Math.abs(b.vy); bounced = true; }
    if(b.y > world.h - b.r){ b.y = world.h - b.r; b.vy = -Math.abs(b.vy); bounced = true; }

    if(reflectSolids(b, b.r, 1, (x, y) => {
      SFX.pillar();
      spawnRing(x, y, 0x7fe9ff, 34, 0.25, 2);
    })) bounced = true;

    if(bounced){
      b.bounces--;
      b.dmg *= (1.32 + M.bounceDmg);
      b.hot++;
      b.r = Math.min(8.5, b.r + 0.7);
      spawnParticles(b.x, b.y, 3, b.col, 120, 0.25, 2);
      if(b.bounces < 0){ freeBullet(b); bullets.splice(i, 1); continue; }
    }

    let hit = false;
    for(const e of enemies){
      if(b.hitIds.includes(e.id)) continue;
      const d = Math.hypot(b.x - e.x, b.y - e.y);
      if(d < e.r + b.r){
        const nx = (b.x - e.x) / (d || 1);
        const ny = (b.y - e.y) / (d || 1);
        let dmg = b.dmg;
        if(M.crit > 0 && Math.random() < M.crit){
          dmg *= M.critMul;
          addFloat(b.x, b.y - 16, '暴击', 0xff7a3d, 15);
        }
        if(M.slowOnHit > 0){ e.slowT = 0.65; e.slowAmt = Math.max(e.slowAmt, M.slowOnHit); }
        damageEnemy(e, dmg, nx * 150, ny * 150);
        if(M.shrapnel > 0 && Math.random() < M.shrapnel){
          for(let k = 0; k < 2; k++){
            const sa = Math.atan2(b.vy, b.vx) + rand(-1.1, 1.1);
            const made = mkBullet({
              x: b.x, y: b.y,
              vx: Math.cos(sa) * 620, vy: Math.sin(sa) * 620,
              r: 3.4, dmg: dmg * 0.35, life: 0.7, bounces: 0,
              col: 0xffc8a0, pierce: 0, homing: 0, hot: 0, hitIds: [e.id]
            });
            if(!made) break;
          }
        }
        spawnParticles(b.x, b.y, 8, b.col, 220, 0.4, 2.6);
        b.hitIds.push(e.id);
        hit = true;
        break;
      }
    }

    if(hit){
      if(b.pierce > 0) b.pierce--;
      else { freeBullet(b); bullets.splice(i, 1); continue; }
    }
    if(b.life <= 0){ freeBullet(b); bullets.splice(i, 1); }
  }
  if(bullets.length > 260){
