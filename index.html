    freeBullet(bullets[0]);
    bullets.shift();
  }
}

// 凑凑弹幕命中：玩家射速-90% · 伤害+150%（持续 5s，重复命中只刷新不叠加）
function applyCoucou(){
  const p = player;
  const had = p.coucouT > 0;
  p.coucouT = 5.0;
  if(!had){
    addFloat(p.x, p.y - 46, '凑凑弹幕！射速-90% · 伤害+150%', 0xffc83d, 16);
    spawnRing(p.x, p.y, 0xffc83d, 110, 0.5, 3);
    spawnParticles(p.x, p.y, 18, 0xffc83d, 260, 0.6, 2.6);
    SFX.coucou();
  }
}

function updateEBullets(dt){
  const stK = state.stasis > 0 ? 0.25 : 1;
  for(let i = ebullets.length - 1; i >= 0; i--){
    const b = ebullets[i];
    b.life -= dt;
    b.x += b.vx * dt * stK; b.y += b.vy * dt * stK;
    if(b.x < b.r || b.x > world.w - b.r) b.vx *= -1;
    if(b.y < b.r || b.y > world.h - b.r) b.vy *= -1;
    b.x = clamp(b.x, b.r, world.w - b.r);
    b.y = clamp(b.y, b.r, world.h - b.r);

    const d = Math.hypot(b.x - player.x, b.y - player.y);
    if(d < player.r + b.r){
      if(b.web) player.webSlow = 1.4;
      if(b.coucou) applyCoucou();
      hurtPlayer(b.dmg);
      spawnParticles(b.x, b.y, 10, 0xff3d6e, 220, 0.45, 3);
      freeEBullet(b); ebullets.splice(i, 1);
      continue;
    }
    if(b.life <= 0){ freeEBullet(b); ebullets.splice(i, 1); }
  }
  if(ebullets.length > 240){
    freeEBullet(ebullets[0]);
    ebullets.shift();
  }
}

// ---------------- 敌人更新 ----------------
function updateEnemies(dt){
  for(let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];
    if(!e) continue;   // 数组可能已被连锁/新星缩短
    e.hitFlash = Math.max(0, e.hitFlash - dt);
    e.wob += dt * 3;
    e.spawnT = Math.max(0, e.spawnT - dt);
    e.slowT = Math.max(0, e.slowT - dt);

    let slow = 1;
    if(e.slowT > 0) slow *= 1 - clamp(e.slowAmt, 0, 0.75);
    if(M.aura > 0 && Math.hypot(e.x - player.x, e.y - player.y) < 130) slow *= 1 - M.aura;
    if(e.spawnT > 0) slow *= 0.35;
    if(state.stasis > 0) slow *= 0.25;   // 常驻技能：时间凝滞

    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const nx = dx / d, ny = dy / d;
    // 攻击性随玩家等级百分比提升；全图索敌，距离越远移速加成越高（基于基础速度）
    const aggro = 1 + (state.level - 1) * 0.05;
    const spd = e.speed * slow * aggro * zoneSpeedMul(e.x, e.y) * (1 + clamp((d - 280) / 900, 0, 0.9));

    if(e.type === 'chaser' || e.type === 'mini' || e.type === 'pig'){
      // 猪猪：高速直冲 + 小幅蛇形，只撞击不射击
      const wob2 = e.type === 'pig' ? Math.sin(e.wob * 1.6) * 0.4 : 0;
      e.x += (nx + -ny * wob2) * spd * dt;
      e.y += (ny + nx * wob2) * spd * dt;
    } else if(e.type === 'splitter'){
      e.x += (nx + -ny * Math.sin(e.wob * 0.8) * 0.6) * spd * dt;
      e.y += (ny + nx * Math.sin(e.wob * 0.8) * 0.6) * spd * dt;
    } else if(e.type === 'turret'){
      const want = 250;
      const dir = d > want ? 1 : -1;
      e.x += nx * spd * dir * dt;
      e.y += ny * spd * dir * dt;
      e.x += -ny * Math.sin(e.wob) * 30 * slow * dt;
      e.y += nx * Math.sin(e.wob) * 30 * slow * dt;
      e.shootCd -= dt * slow * aggro;
      if(e.shootCd <= 0 && d < 700 && e.spawnT <= 0){
        e.shootCd = 1.7;
        const a = Math.atan2(dy, dx) + rand(-0.09, 0.09);
        mkEBullet({ x: e.x + Math.cos(a) * (e.r + 6), y: e.y + Math.sin(a) * (e.r + 6),
          vx: Math.cos(a) * 300, vy: Math.sin(a) * 300, r: 6, dmg: 9, life: 4, color: 0xb06bff });
        tone(300, 0.1, 'sawtooth', 0.07, 180);
      }
    } else if(e.type === 'tank'){
      e.x += nx * spd * dt;
      e.y += ny * spd * dt;
    } else if(e.type === 'stinger'){
      // 蜂刺：蛇形逼近，近身锁定后高速突刺
      if(e.tele > 0){
        e.tele -= dt * slow;
        spawnParticles(e.x, e.y, 1, 0xffd23d, 90, 0.22, 2);
        if(e.tele <= 0){ e.chargeT = 0.34; e.dirX = nx; e.dirY = ny; tone(520, 0.1, 'square', 0.05, 940); }
      } else if(e.chargeT > 0){
        e.chargeT -= dt;
        e.x += e.dirX * 640 * slow * dt;
        e.y += e.dirY * 640 * slow * dt;
      } else {
        e.x += (nx + -ny * Math.sin(e.wob) * 0.55) * spd * dt;
        e.y += (ny + nx * Math.sin(e.wob) * 0.55) * spd * dt;
        e.shootCd -= dt * slow * aggro;
        if(e.shootCd <= 0 && d < 360 && e.spawnT <= 0){
          e.shootCd = rand(2.2, 3.0);
          e.tele = 0.32;
        }
      }
    } else if(e.type === 'weaver'){
      // 织网者：保持中距环绕游走，三连点射
      const side = (e.id % 2 === 0) ? 1 : -1;
      const dir = d > 270 ? 1 : (d < 200 ? -1 : 0);
      e.x += (nx * dir + -ny * side * 0.9) * spd * dt;
      e.y += (ny * dir + nx * side * 0.9) * spd * dt;
      e.shootCd -= dt * slow * aggro;
      if(e.shootCd <= 0 && d < 640 && e.spawnT <= 0){
        e.shootCd = 2.5;
        const base = Math.atan2(dy, dx);
        for(let k = -1; k <= 1; k++){
          const a = base + k * 0.12;
          mkEBullet({ x: e.x + Math.cos(a) * (e.r + 6), y: e.y + Math.sin(a) * (e.r + 6),
            vx: Math.cos(a) * 330, vy: Math.sin(a) * 330, r: 5, dmg: 8, life: 3.6, color: 0x38b6ff });
        }
        tone(420, 0.09, 'sawtooth', 0.06, 260);
      }
    } else if(e.type === 'carrier'){
      // 孵化者：缓慢逼近，周期吐出迷你虫（同源在场限 3 只）
      e.x += nx * spd * dt;
      e.y += ny * spd * dt;
      e.shootCd -= dt * slow * aggro;
      if(e.shootCd <= 0 && e.spawnT <= 0){
        e.shootCd = 4.2;
        let brood = 0;
        for(const o of enemies) if(o.master === e.id) brood++;
        if(brood < 3){
          const m2 = spawnEnemyAt('mini', e.x + rand(-16, 16), e.y + rand(-16, 16), false, e.id);
          if(m2) spawnParticles(e.x, e.y, 8, 0xff5e3d, 180, 0.4, 2.6);
          tone(240, 0.14, 'square', 0.07, 140);
        }
      }
    } else if(e.type === 'boss'){
      updateBoss(e, dt, slow, aggro, spd, nx, ny, d, dx, dy);
      // 半血狂怒：提速、攻击更密、光环转红
      if(!e.enraged && e.hp < e.maxHp * 0.5){
        e.enraged = true;
        e.speed *= 1.3;
        addFloat(e.x, e.y - e.r - 24, '!! 狂怒 !!', 0xff5e3d, 18);
        spawnRing(e.x, e.y, 0xff5e3d, 138, 0.6, 3);
        spawnParticles(e.x, e.y, 30, 0xff5e3d, 380, 0.6, 3);
        state.shake = Math.max(state.shake, 12);
        tone(120, 0.5, 'sawtooth', 0.2, 60);
      }
    }

    e.x += e.kx * dt; e.y += e.ky * dt;
    e.kx *= Math.exp(-7 * dt); e.ky *= Math.exp(-7 * dt);

    // 卡死自救：连续 3.5 秒被障碍挡住过不去，就给 1.6 秒穿墙，避免敌人卡墙外、波次清不掉
    const blocked = pushOutSolids(e, dt);
    if(blocked && e.spawnT <= 0){
      e.stuckT = (e.stuckT || 0) + dt;
      if(e.stuckT > 3.5){ e.phaseT = 1.6; e.stuckT = 0; }
    } else {
      e.stuckT = 0;
    }
    if(e.phaseT > 0) e.phaseT -= dt;


    e.x = clamp(e.x, e.r, world.w - e.r);
    e.y = clamp(e.y, e.r, world.h - e.r);

    for(const o of enemies){
      if(o === e) continue;
      const ox = e.x - o.x, oy = e.y - o.y;
      const od = Math.hypot(ox, oy);
      const omin = e.r + o.r;
      if(od < omin && od > 0.0001){
        const push = (omin - od) * 0.5;
        e.x += ox / od * push; e.y += oy / od * push;
      }
    }

    const pd = Math.hypot(e.x - player.x, e.y - player.y);
    if(pd < e.r + player.r + (player.dashTime > 0 ? M.dashR : 0)){
      if(player.dashTime > 0){
        const kx = (e.x - player.x) / (pd || 1);
        const ky = (e.y - player.y) / (pd || 1);
        const hitDmg = CFG.dashDmg * M.dashDmg * (player.ramMul > 0 ? player.ramMul : 1) + 6 * player.rebound;
        damageEnemy(e, hitDmg, kx * 620, ky * 620);
        state.shake = Math.max(state.shake, 10);
        spawnParticles(e.x, e.y, 16, 0x5ffbf1, 340, 0.5, 3);
        spawnRing(e.x, e.y, 0x5ffbf1, 70, 0.35, 3);
        player.vx *= 0.6; player.vy *= 0.6;
        // 冲刺核心机制：撞人没撞死 CD -15%，撞死 CD -80%，每个敌人每次冲刺只结算一次
        if(!player.dashHits) player.dashHits = new Set();
        if(!player.dashHits.has(e.id)){
          player.dashHits.add(e.id);
          const killed = e.hp <= 0;
          const total = CFG.dashCd * M.dashCd;
          if(killed){
            player.dashCd = Math.max(0, player.dashCd - total * 0.8);
            addFloat(player.x, player.y - 44, '撞死 CD -80%', 0x7fb8ff, 13);
          } else {
            player.dashCd = Math.max(0, player.dashCd - total * 0.15);
            addFloat(player.x, player.y - 44, '撞人 CD -15%', 0x9fd8ff, 13);
          }
          if(killed && M.dashKillE > 0){
            player.energy = Math.min(player.maxEnergy, player.energy + M.dashKillE);
            addFloat(e.x, e.y - e.r - 24, '+' + Math.round(M.dashKillE) + ' 能量', 0x5ffbf1, 13);
          }
          if(M.dashChain > 0){
            const cn = splashDamage(e.x, e.y, 120, hitDmg * M.dashChain, 320);
            if(cn > 0){ spawnRing(e.x, e.y, 0x7fb8ff, 90, 0.3, 2); SFX.chain(); }
          }
          if(M.dashSlow > 0){ e.slowT = Math.max(e.slowT || 0, 1); e.slowAmt = Math.max(e.slowAmt || 0, M.dashSlow); }
          if(M.dashRebound > 0) for(let k2 = 0; k2 < M.dashRebound; k2++) addReboundStack(player.x, player.y);
        }
      } else if(e.bossKind === 8 && e.pokeActive){
        // 喵叶喵：戳飞 / 撅飞（弹球式强击退，撞墙还能叠反弹）
        const wasVuln = player.invuln <= 0;
        hurtPlayer(e.dmg * (e.pokeActive === 2 ? 1.3 : 1.1), e);
        const kx = (player.x - e.x) / (pd || 1);
        const ky = (player.y - e.y) / (pd || 1);
        const pw2 = e.pokeActive === 2 ? 780 : 980;
        player.vx += kx * pw2; player.vy += ky * pw2;
        e.kx -= kx * 120; e.ky -= ky * 120;
        if(wasVuln){
          addFloat(player.x, player.y - 34, e.pokeActive === 2 ? '被撅飞了！' : '被戳飞了！', 0xc4f04a, 15);
          tone(600, 0.12, 'square', 0.09, 300);
        }
        e.pokeActive = 0;
      } else {
        hurtPlayer(e.dmg, e);
        const kx = (player.x - e.x) / (pd || 1);
        const ky = (player.y - e.y) / (pd || 1);
        player.vx += kx * 380; player.vy += ky * 380;
        e.kx -= kx * 200; e.ky -= ky * 200;
      }
    }
  }
}

// ---------------- BOSS AI（按 bossKind 分派，弹幕规模随 bossTier 增强） ----------------
function updateBoss(e, dt, slow, aggro, spd, nx, ny, d, dx, dy){
  if(e.bossKind === 8){ updateMiaoYe(e, dt, slow, aggro, spd, nx, ny, d, dx, dy); return; }
  if(e.bossKind >= 5){ updateWuer(e, dt, slow, aggro, spd, nx, ny, d, dx, dy); return; }
  const kind = e.bossKind || 0;
  const tier = e.bossTier || 1;
  const pw = 1 + 0.18 * (tier - 1);
  const bCol = e.color;
  const aim = Math.atan2(dy, dx);
  const shot = (a, sp, rr, dm, cc, extra) => {
    const o = { x: e.x + Math.cos(a) * (e.r + 8), y: e.y + Math.sin(a) * (e.r + 8),
      vx: Math.cos(a) * sp * pw, vy: Math.sin(a) * sp * pw, r: rr, dmg: dm * pw, life: 5.5, color: cc };
    if(extra) Object.assign(o, extra);
    mkEBullet(o);
  };
  const summon = (cap, cdN, cdE, typeFn, label) => {
    e.summonCd -= dt * slow;
    if(e.summonCd > 0 || e.spawnT > 0) return;
    let adds = 0;
    for(const o of enemies) if(o.master === 'boss') adds++;
    if(adds >= (e.enraged ? cap[1] : cap[0])){ e.summonCd = 2.5; return; }
    e.summonCd = (e.enraged ? cdE : cdN) / Math.sqrt(pw);
    const n2 = e.enraged ? 4 : 3;
    for(let k = 0; k < n2; k++){
      const a = e.wob + k * TAU / n2;
      spawnEnemyAt(typeFn(),
        clamp(e.x + Math.cos(a) * (e.r + 34), 30, world.w - 30),
        clamp(e.y + Math.sin(a) * (e.r + 34), 30, world.h - 30), false, 'boss');
    }
    addFloat(e.x, e.y - e.r - 20, label, 0xff6fe0, 15);
    spawnRing(e.x, e.y, bCol, 120, 0.5, 2.5);
    tone(180, 0.3, 'square', 0.1, 340);
  };

  // 冲锋状态机（监督者 / 毁灭者 / 歼灭核心共用；毁灭者与歼灭核心可连锁多段）
  e.chargeCd -= dt * slow * aggro;
  if(e.tele > 0){
    e.tele -= dt * slow;
    spawnParticles(e.x, e.y, 2, bCol, 120, 0.4, 2.6);
    if(e.tele <= 0){ e.chargeT = 0.75; e.dirX = nx; e.dirY = ny; SFX.charge(); spawnRing(e.x, e.y, bCol, 90, 0.3, 4); }
    return;
  }
  if(e.chargeT > 0){
    e.chargeT -= dt;
    const cs = 950 * slow;
    e.x += e.dirX * cs * dt; e.y += e.dirY * cs * dt;
    spawnParticles(e.x, e.y, 2, bCol, 60, 0.3, 2.4);
    state.shake = Math.max(state.shake, 3);
    if(e.chargeT <= 0 && e.chainLeft > 0){ e.chainLeft--; e.tele = 0.38; }
    return;
  }

  if(kind === 1){
    // ---- 织网主母：中距环绕游走，减速网弹扇面 + 高频孵化蛛群 ----
    const side = (e.id % 2 === 0) ? 1 : -1;
    const dir = d > 320 ? 1 : (d < 240 ? -1 : 0);
    e.x += (nx * dir + -ny * side * 0.8) * spd * dt;
    e.y += (ny * dir + nx * side * 0.8) * spd * dt;
    e.shootCd -= dt * slow * aggro;
    if(e.shootCd <= 0 && e.spawnT <= 0){
      e.shootCd = (e.enraged ? 1.9 : 2.6) / pw;
      const n2 = Math.round((e.enraged ? 7 : 5) * Math.min(pw, 2));
      for(let k = 0; k < n2; k++) shot(aim + (k - (n2 - 1) / 2) * 0.18, 190, 7, 9, 0x7fd4ff, { web: true });
      addFloat(e.x, e.y - e.r - 16, '缚网', 0x7fd4ff, 13);
      tone(420, 0.12, 'sawtooth', 0.08, 240);
    }
    summon([5, 7], 7.5, 5.5, () => Math.random() < 0.5 ? 'stinger' : 'weaver', '孵化蛛群');
  } else if(kind === 2){
    // ---- 毁灭者：高速逼近，双螺旋弹幕倾泻 + 连锁毁灭冲锋 ----
    e.x += nx * spd * 1.15 * dt;
    e.y += ny * spd * 1.15 * dt;
    e.spiralT -= dt * slow * aggro;
    if(e.spiralT <= 0 && e.spawnT <= 0){
      e.spiralT = 0.13 / pw;
      const arms = e.enraged ? 3 : 2;
      for(let k = 0; k < arms; k++) shot(e.wob * 1.9 + k * TAU / arms, 235, 7, 10, 0xffa73d);
    }
    if(e.chargeCd <= 0 && e.spawnT <= 0 && d > 200){
      e.chargeCd = (e.enraged ? rand(4, 5.5) : rand(5.5, 7.5)) / Math.sqrt(pw);
      e.chainLeft = (e.enraged ? 3 : 2) + (tier >= 3 ? 1 : 0);
      e.tele = 0.5;
      spawnRing(e.x, e.y, bCol, 120, 0.55, 3);
      addFloat(e.x, e.y - e.r - 20, '!! 毁灭冲锋', bCol, 14);
    }
  } else if(kind === 3){
    // ---- 风暴先知：漂浮环绕 + 周期闪现，旋转双螺旋与带缺口的环形弹幕 ----
    const side3 = (e.id % 2 === 0) ? 1 : -1;
    e.x += (nx * 0.5 + -ny * side3 * 0.9) * spd * dt;
    e.y += (ny * 0.5 + nx * side3 * 0.9) * spd * dt;
    e.blinkCd -= dt * slow * aggro;
    if(e.blinkCd <= 0 && e.spawnT <= 0){
      e.blinkCd = (e.enraged ? 2.6 : 3.8) / Math.sqrt(pw);
      spawnParticles(e.x, e.y, 24, bCol, 340, 0.5, 3);
      spawnRing(e.x, e.y, bCol, 110, 0.4, 2.5);
      const na = Math.random() * TAU, nd = rand(240, 380);
      e.x = clamp(player.x + Math.cos(na) * nd, e.r + 30, world.w - e.r - 30);
      e.y = clamp(player.y + Math.sin(na) * nd, e.r + 30, world.h - e.r - 30);
      spawnParticles(e.x, e.y, 24, bCol, 340, 0.5, 3);
      spawnSparks(e.x, e.y, 8, bCol, 1.4);
      addFloat(e.x, e.y - e.r - 18, '闪现', bCol, 14);
      tone(680, 0.18, 'sine', 0.12, 180);
    }
    e.spiralT -= dt * slow * aggro;
    if(e.spiralT <= 0 && e.spawnT <= 0){
      e.spiralT = 0.16 / pw;
      for(let k = 0; k < 2; k++) shot(e.wob * 1.3 + k * Math.PI, 205, 7, 10, 0xd08cff);
    }
    e.ringCd -= dt * slow * aggro;
    if(e.ringCd <= 0 && e.spawnT <= 0){
      e.ringCd = (e.enraged ? 3.2 : 4.6) / pw;
      const n2 = Math.round(20 * Math.min(pw, 2.2));
      const gapA = Math.random() * TAU;
      for(let k = 0; k < n2; k++){
        const a = k * TAU / n2;
        let dd = Math.abs(((a - gapA) % TAU + TAU) % TAU);
        if(dd > Math.PI) dd = TAU - dd;
        if(dd < 0.55) continue;
        shot(a, 175, 7, 12, 0xb06bff);
      }
      spawnRing(e.x, e.y, bCol, 130, 0.5, 2.5);
      addFloat(e.x, e.y - e.r - 20, '风暴环', bCol, 14);
      tone(180, 0.3, 'sawtooth', 0.1, 60);
    }
  } else {
    // ---- 监督者（kind 0）与歼灭核心（kind 4）：瞄准弹幕 + 冲锋 + 召唤；核心额外带螺旋臂 ----
    e.x += nx * spd * dt;
    e.y += ny * spd * dt;
    e.shootCd -= dt * slow * aggro;
    if(e.shootCd <= 0 && e.spawnT <= 0){
      e.shootCd = (e.enraged ? 1.6 : 2.2) / pw;
      e.shotToggle = (e.shotToggle + 1) % 2;
      if(e.shotToggle === 0){
        for(let k = -2; k <= 2; k++) shot(aim + k * 0.26, 250, 8, 13, bCol);
      } else {
        const n2 = Math.round((e.enraged ? 14 : 10) * Math.min(pw, 2));
        for(let k = 0; k < n2; k++) shot(e.wob + k * TAU / n2, 210, 7, 11, 0xff6fe0);
      }
      tone(220, 0.2, 'sawtooth', 0.12, 90);
    }
    if(kind === 4){
      e.spiralT -= dt * slow * aggro;
      if(e.spiralT <= 0 && e.spawnT <= 0){
        e.spiralT = 0.17 / pw;
        for(let k = 0; k < 2; k++) shot(-e.wob * 1.6 + k * Math.PI, 215, 7, 10, 0xffe45c);
      }
    }
    if(e.chargeCd <= 0 && e.spawnT <= 0 && d > 220){
      e.chargeCd = (e.enraged ? rand(4.5, 6.5) : rand(6.5, 9.5)) / Math.sqrt(pw);
      if(kind === 4) e.chainLeft = e.enraged ? 2 : 1;
      e.tele = 0.55;
      spawnRing(e.x, e.y, bCol, 120, 0.55, 3);
      addFloat(e.x, e.y - e.r - 20, '!! 冲锋', bCol, 14);
    }
    summon([4, 6], 10.5, 7.5,
      () => (e.enraged && state.wave >= 10) || kind === 4 ? 'stinger' : 'mini', '召唤');
  }
}

// ---------------- 吾二 BOSS AI（第二只：黑化 / 温柔 / 害羞 随机一体） ----------------
// 三态移动与专属技能不同，但共用两招：
//   凑凑弹幕：扇形发射文字弹「凑凑」，命中后玩家射速-90% · 伤害+150%（持续 5s）
//   召唤猪猪：高速冲撞小弟，不发射子弹
function updateWuer(e, dt, slow, aggro, spd, nx, ny, d, dx, dy){
  const kind = e.wuerKind || 0;
  const bCol = e.color;
  const aim = Math.atan2(dy, dx);
  const pw = 1 + 0.18 * (e.bossTier - 1);
  const shot = (a, sp, rr, dm, cc, extra) => {
    const o = { x: e.x + Math.cos(a) * (e.r + 8), y: e.y + Math.sin(a) * (e.r + 8),
      vx: Math.cos(a) * sp * pw, vy: Math.sin(a) * sp * pw, r: rr, dmg: dm * pw, life: 5.5, color: cc };
    if(extra) Object.assign(o, extra);
    mkEBullet(o);
  };

  // ---- 害羞的吾二：周期隐身（隐身期停火 + 绕侧漂移，现身时环形弹幕爆发） ----
  if(kind === 2){
    e.stealthT -= dt * slow;
    if(e.stealth === 0 && e.stealthT <= 0 && e.spawnT <= 0){
      e.stealth = 1; e.stealthT = 3.0;
      addFloat(e.x, e.y - e.r - 16, '隐身……', bCol, 14);
      spawnParticles(e.x, e.y, 16, bCol, 260, 0.5, 2.6);
      tone(760, 0.22, 'sine', 0.1, 240);
    } else if(e.stealth === 1 && e.stealthT <= 0){
      e.stealth = 0; e.stealthT = 6.0;
      spawnRing(e.x, e.y, bCol, 130, 0.5, 3);
      spawnSparks(e.x, e.y, 8, bCol, 1.4);
      addFloat(e.x, e.y - e.r - 16, '现身！', bCol, 15);
      const n2 = 10;
      for(let k = 0; k < n2; k++) shot(e.wob + k * TAU / n2, 185, 7, 9, bCol);
      tone(300, 0.28, 'sawtooth', 0.11, 640);
    }
    const target = e.stealth === 1 ? 0.13 : 1;
    e.vis += (target - e.vis) * Math.min(1, dt * 4.5);
  } else {
    e.vis = 1;
  }
  const hidden = kind === 2 && e.stealth === 1;

  // ---- 黑化的吾二：黑化冲锋（预警 → 高速直线猛冲） ----
  if(kind === 0){
    if(e.tele > 0){
      e.tele -= dt * slow;
      spawnParticles(e.x, e.y, 3, bCol, 130, 0.4, 2.6);
      if(e.tele <= 0){ e.chargeT = 0.6; SFX.charge(); spawnRing(e.x, e.y, bCol, 90, 0.3, 4); }
      return;
    }
    if(e.chargeT > 0){
      e.chargeT -= dt;
      const cs = 1020 * slow;
      e.x += e.dirX * cs * dt; e.y += e.dirY * cs * dt;
      spawnParticles(e.x, e.y, 2, bCol, 60, 0.3, 2.4);
      state.shake = Math.max(state.shake, 3);
      return;
    }
    e.chargeCd -= dt * slow * aggro;
    if(e.chargeCd <= 0 && e.spawnT <= 0 && d > 130){
      e.chargeCd = (e.enraged ? rand(3.5, 5) : rand(5, 7)) / Math.sqrt(pw);
      e.tele = 0.42; e.dirX = nx; e.dirY = ny;
      spawnRing(e.x, e.y, bCol, 120, 0.55, 3);
      addFloat(e.x, e.y - e.r - 18, '!! 黑化冲锋', bCol, 14);
      tone(140, 0.3, 'sawtooth', 0.12, 420);
    }
  }

  // ---- 移动 ----
  if(kind === 0){
    e.x += nx * spd * dt; e.y += ny * spd * dt;                       // 黑化：高速直冲
  } else if(kind === 1){
    const side = (e.id % 2 === 0) ? 1 : -1;                            // 温柔：缓慢环绕保持中距
    const dir = d > 300 ? 1 : (d < 220 ? -1 : 0);
    e.x += (nx * dir + -ny * side * 0.55) * spd * dt;
    e.y += (ny * dir + nx * side * 0.55) * spd * dt;
  } else if(hidden){
    const side = (e.id % 2 === 0) ? 1 : -1;                            // 害羞：隐身期绕侧快速漂移
    e.x += (nx * 0.5 + -ny * side * 1.1) * spd * 1.7 * dt;
    e.y += (ny * 0.5 + nx * side * 1.1) * spd * 1.7 * dt;
  } else {
    e.x += nx * spd * dt; e.y += ny * spd * dt;                       // 害羞：现身期正常逼近
  }

  // ---- 常规攻击（隐身中的害羞停火） ----
  if(!hidden){
    e.shootCd -= dt * slow * aggro;
    if(e.shootCd <= 0 && e.spawnT <= 0){
      if(kind === 0){
        e.shootCd = (e.enraged ? 1.4 : 1.9) / pw;
        for(let k = -1; k <= 1; k++) shot(aim + k * 0.2, 300, 7, 10, bCol);
        tone(180, 0.15, 'sawtooth', 0.09, 90);
      } else if(kind === 1){
        e.shootCd = (e.enraged ? 2.1 : 2.7) / pw;
        shot(aim + rand(-0.06, 0.06), 205, 7, 8, bCol);
        tone(260, 0.12, 'sine', 0.06, 200);
      } else {
        e.shootCd = (e.enraged ? 1.7 : 2.3) / pw;
        for(let k = -1; k <= 1; k++) shot(aim + k * 0.24, 285, 7, 11, bCol);
        tone(330, 0.13, 'square', 0.08, 200);
      }
    }
  }

  // ---- 温柔的吾二：温柔乡（预警 0.9s → 300 范围减速 + 轻伤） ----
  if(kind === 1){
    if(e.slowWarn > 0){
      e.slowWarn -= dt;
      if(Math.random() < dt * 26){
        spawnParticles(e.x + rand(-300, 300), e.y + rand(-300, 300), 1, 0x9dffd8, 30, 0.5, 2);
      }
      if(e.slowWarn <= 0){
        spawnRing(e.x, e.y, 0x9dffd8, 130, 0.55, 4);
        spawnParticles(e.x, e.y, 26, 0x9dffd8, 320, 0.6, 2.6);
        addFloat(e.x, e.y - e.r - 18, '温柔乡', 0x9dffd8, 15);
        tone(520, 0.32, 'sine', 0.1, 260);
        if(Math.hypot(player.x - e.x, player.y - e.y) < 300 + player.r){
          player.webSlow = Math.max(player.webSlow, 1.6);
          hurtPlayer(6);
          addFloat(player.x, player.y - 30, '被温柔包裹', 0x9dffd8, 13);
        }
      }
    } else {
      e.slowRingCd -= dt * slow;
      if(e.slowRingCd <= 0 && e.spawnT <= 0){
        e.slowRingCd = e.enraged ? 5.5 : 7;
        e.slowWarn = 0.9;
        addFloat(e.x, e.y - e.r - 18, '温柔乡·酝酿', 0x9dffd8, 13);
      }
    }
  }

  // ---- 共用：凑凑弹幕（文字弹「凑凑」：命中后玩家射速-90% · 伤害+150%，持续 5s） ----
  e.coucouCd -= dt * slow * aggro;
  if(e.coucouCd <= 0 && e.spawnT <= 0){
    e.coucouCd = (e.enraged ? 6.5 : 9) / Math.sqrt(pw);
    const n2 = e.enraged ? 7 : 5;
    for(let k = 0; k < n2; k++){
      shot(aim + (k - (n2 - 1) / 2) * 0.24, 150, 12, 6, 0xffd7f4, { coucou: true });
    }
    addFloat(e.x, e.y - e.r - 18, '凑凑弹幕！', 0xffd7f4, 16);
    spawnRing(e.x, e.y, 0xffd7f4, 120, 0.5, 3);
    SFX.coucou();
  }

  // ---- 共用：召唤猪猪（只撞击 · 不发射子弹 · 速度高 · 撞击频率高） ----
  e.pigCd -= dt * slow;
  if(e.pigCd <= 0 && e.spawnT <= 0){
    e.pigCd = e.enraged ? 5 : 6.5;
    let pigs = 0;
    for(const o of enemies) if(o.type === 'pig' && o.master === 'boss') pigs++;
    const cap = e.enraged ? 7 : 5;
    if(pigs < cap){
      for(let k = 0; k < 2; k++){
        const a = e.wob + k * Math.PI + Math.PI / 2;
        spawnEnemyAt('pig',
          clamp(e.x + Math.cos(a) * (e.r + 30), 30, world.w - 30),
          clamp(e.y + Math.sin(a) * (e.r + 30), 30, world.h - 30), false, 'boss');
      }
      addFloat(e.x, e.y - e.r - 20, '召唤 · 猪猪', 0xff9ad5, 14);
      spawnRing(e.x, e.y, 0xff9ad5, 110, 0.5, 2.5);
      SFX.piggy();
    }
  }
}

// ---------------- 喵叶喵 AI（第一只 BOSS：沉默的戳戳怪） ----------------
// 零弹幕（她不发言）。「戳一戳」：叶隐瞬移到玩家背后 → 亮「！」蓄力 → 短突进戳飞玩家；
// 「撅」：她唯一会说的话，撅臀高速冲撞，撞墙会把自己撞懵（输出破绽）。
function updateMiaoYe(e, dt, slow, aggro, spd, nx, ny, d, dx, dy){
  const bCol = e.color;
  const pw = 1 + 0.18 * ((e.bossTier || 1) - 1);
  e.pokeActive = 0;   // 每帧重置，突进相里重新置位
  switch(e.myState){
    case 'blink': {   // 叶隐：淡出，瞬移到玩家背后
      e.myT -= dt * slow;
      e.vis = Math.max(0.12, e.vis - dt * 5);
      if(Math.random() < 0.3) spawnParticles(e.x, e.y, 1, bCol, 90, 0.5, 2.2);
      if(e.myT <= 0){
        let bx2 = -player.moveDir.x, by2 = -player.moveDir.y;      // 逆着玩家移动方向落点
        if(Math.hypot(bx2, by2) < 0.2){ const a = rand(0, TAU); bx2 = Math.cos(a); by2 = Math.sin(a); }
        spawnParticles(e.x, e.y, 14, bCol, 260, 0.5, 2.6);
        e.x = clamp(player.x + bx2 * 175, e.r + 24, world.w - e.r - 24);
        e.y = clamp(player.y + by2 * 175, e.r + 24, world.h - e.r - 24);
        spawnParticles(e.x, e.y, 14, bCol, 260, 0.5, 2.6);
        e.vis = 1;
        e.myState = 'wind'; e.myT = 0.32;
        const dd = Math.hypot(player.x - e.x, player.y - e.y) || 1; // 锁定突进方向（给玩家反应窗口）
        e.dirX = (player.x - e.x) / dd; e.dirY = (player.y - e.y) / dd;
        addFloat(e.x, e.y - e.r - 16, '！', 0xffffff, 16);
        tone(880, 0.08, 'square', 0.06, 660);
      }
      return;
    }
    case 'wind': {    // 戳前蓄力：原地颤抖
      e.myT -= dt * slow;
      e.x += rand(-1, 1) * 0.6; e.y += rand(-1, 1) * 0.6;
      if(e.myT <= 0){ e.myState = 'poke'; e.myT = 0.26; tone(500, 0.1, 'sawtooth', 0.08, 900); }
      return;
    }
    case 'poke': {    // 戳！高速短突进（命中把玩家当弹球戳飞，见碰撞分支）
      e.myT -= dt;
      e.pokeActive = 1;
      const cs = 1150 * slow;
      e.x += e.dirX * cs * dt; e.y += e.dirY * cs * dt;
      spawnParticles(e.x, e.y, 2, bCol, 70, 0.3, 2.2);
      if(e.myT <= 0){ e.myState = 'stalk'; e.myCd = (e.enraged ? 2.2 : 3.2) / Math.sqrt(pw); }
      return;
    }
    case 'buttTele': {  // 撅！蓄力（冲撞方向在出手瞬间锁定，蓄力期可预判）
      e.myT -= dt * slow;
      if(Math.random() < 0.4) spawnParticles(e.x, e.y, 2, bCol, 120, 0.4, 2.4);
      state.shake = Math.max(state.shake, 1.5);
      if(e.myT <= 0){
        const dd = Math.hypot(player.x - e.x, player.y - e.y) || 1;
        e.dirX = (player.x - e.x) / dd; e.dirY = (player.y - e.y) / dd;
        e.myState = 'butt'; e.myT = 0.75;
        SFX.charge(); spawnRing(e.x, e.y, bCol, 90, 0.3, 4);
      }
      return;
    }
    case 'butt': {    // 撅臀冲撞：高速直线，撞墙把自己撞懵（破绽）
      e.myT -= dt;
      e.pokeActive = 2;
      const cs = 840 * slow;
      e.x += e.dirX * cs * dt; e.y += e.dirY * cs * dt;
      spawnParticles(e.x, e.y, 3, bCol, 80, 0.3, 2.4);
      state.shake = Math.max(state.shake, 3);
      if(e.x <= e.r + 2 || e.x >= world.w - e.r - 2 || e.y <= e.r + 2 || e.y >= world.h - e.r - 2){
        e.myState = 'stun'; e.myT = 0.9;
        state.shake = Math.max(state.shake, 16);
        spawnRing(e.x, e.y, 0xffffff, 130, 0.4, 3);
        spawnParticles(e.x, e.y, 22, bCol, 320, 0.6, 3);
        addFloat(e.x, e.y - e.r - 16, '…', bCol, 15);
        tone(120, 0.3, 'square', 0.12, 80);
        return;
      }
      if(e.myT <= 0){ e.myState = 'stalk'; e.myButtCd = (e.enraged ? 5.5 : 8) / Math.sqrt(pw); }
      return;
    }
    case 'stun': {    // 撞懵打转：输出窗口
      e.myT -= dt * slow;
      if(Math.random() < 0.2) spawnParticles(e.x, e.y, 1, 0xffffff, 60, 0.4, 2);
      if(e.myT <= 0){ e.myState = 'stalk'; e.myButtCd = (e.enraged ? 5.5 : 8) / Math.sqrt(pw); }
      return;
    }
  }
  // stalk：沉默环绕保持中距，等待出手（她一句话也不说，零弹幕）
  const side = (e.id % 2 === 0) ? 1 : -1;
  const dir = d > 310 ? 1 : (d < 210 ? -0.7 : 0);
  e.x += (nx * dir + -ny * side * 0.6) * spd * dt;
  e.y += (ny * dir + nx * side * 0.6) * spd * dt;
  e.myButtCd -= dt * slow * aggro;
  e.myCd -= dt * slow * aggro;
  if(e.myButtCd <= 0 && e.spawnT <= 0 && d > 150){
    e.myState = 'buttTele'; e.myT = 0.55;
    addFloat(e.x, e.y - e.r - 16, '撅！', bCol, 18);   // 她唯一会说的话
    tone(160, 0.25, 'sawtooth', 0.1, 320);
  } else if(e.myCd <= 0 && e.spawnT <= 0 && d < 560){
    e.myState = 'blink'; e.myT = 0.35;
    addFloat(e.x, e.y - e.r - 16, '…', bCol, 14);      // 不说话
    tone(700, 0.15, 'sine', 0.07, 500);
  }
}

// ---------------- 环 / 粒子 ----------------
function updateRings(dt){
  for(let i = rings.length - 1; i >= 0; i--){
    const r = rings[i];
    r.life -= dt;
    if(r.life <= 0){ rel(r.s); rings.splice(i, 1); continue; }
    const t = 1 - r.life / r.maxLife;
    r.r = r.maxR * (1 - Math.pow(1 - t, 3));
  }
}

function updateParticles(dt){
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life <= 0){ rel(p.spr); particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.exp(-2.4 * dt); p.vy *= Math.exp(-2.4 * dt);
  }
  for(let i = floats.length - 1; i >= 0; i--){
    const f = floats[i];
    f.life -= dt;
    f.y += f.vy * dt;
    f.vy *= Math.exp(-2 * dt);
    if(f.life <= 0){ rel(f.t); floats.splice(i, 1); }
  }
  for(let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i];
    s.life -= dt;
    if(s.life <= 0){ rel(s.spr); sparks.splice(i, 1); continue; }
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.vx *= Math.exp(-6 * dt); s.vy *= Math.exp(-6 * dt);
  }
  for(let i = shards.length - 1; i >= 0; i--){
    const s = shards[i];
    s.life -= dt;
    if(s.life <= 0){ rel(s.spr); shards.splice(i, 1); continue; }
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.vx *= Math.exp(-2.2 * dt); s.vy *= Math.exp(-2.2 * dt);
    s.rot += s.vrot * dt;
  }
  for(let i = pluses.length - 1; i >= 0; i--){
    const s = pluses[i];
    s.life -= dt;
    if(s.life <= 0){ rel(s.spr); pluses.splice(i, 1); continue; }
    s.y += s.vy * dt;
    s.vy *= Math.exp(-1.6 * dt);
  }
}

// ---------------- 主更新 ----------------
function update(dt){
  updateBackground(dt);
  updateMeteors(dt);
  if(state.mode === 'paused'){
    // ESC 暂停：战场与时间冻结，仅背景呼吸；衰减震屏/闪光避免定格抖动
    state.shake *= Math.exp(-7 * dt);
    state.flash = Math.max(0, state.flash - dt * 2.2);
    state.novaFlash = Math.max(0, state.novaFlash - dt * 2.4);
    return;
  }
  updateRings(dt);

  state.time += dt;
  state.shake *= Math.exp(-7 * dt);
  state.flash = Math.max(0, state.flash - dt * 2.2);
  state.novaFlash = Math.max(0, state.novaFlash - dt * 2.4);
  state.hitStop = Math.max(0, state.hitStop - dt);

  if(state.comboTimer > 0){
    state.comboTimer -= dt;
    if(state.comboTimer <= 0) state.combo = 0;
  }

  if(state.mode === 'playing'){
    state.stasis = Math.max(0, state.stasis - dt);
    state.magnetize = Math.max(0, state.magnetize - dt);
    updatePlayer(dt);
    updateBullets(dt);
    updateEnemies(dt);
    updateEBullets(dt);
    updatePickups(dt);
    updateSpawner(dt);
    updateStorms(dt);
  }
  updateParticles(dt);
  if(state.mode !== 'cards') updateCamera(dt);
}

// ---------------- 视觉同步（Pixi） ----------------
function syncBackground(){
  bgLayer.x = -cam.x * 0.10;
  bgLayer.y = -cam.y * 0.10;
  dustLayer.x = -cam.x * 0.18;
  dustLayer.y = -cam.y * 0.18;

  for(const n of nebulae){
    const pulse = 0.75 + 0.25 * Math.sin(n.phase);
    const s = n.spr;
    s.position.set(n.x, n.y);
    s.scale.set(n.r * 2 / 128);
    s.tint = n.color;
    s.alpha = n.a * pulse;
  }
  for(const d of dust){
    const tw = 0.5 + 0.5 * Math.sin(d.phase);
    const s = d.spr;
    s.position.set(d.x, d.y);
    s.scale.set(d.r * 2 / 64);
    s.tint = 0x9fe8ff;
    s.alpha = d.a * (0.35 + tw * 0.65);
  }
  for(const m of meteors){
    const s = m.spr;
    const sp = Math.hypot(m.vx, m.vy) || 1;
    s.position.set(m.x, m.y);
    s.rotation = Math.atan2(m.vy, m.vx);
    s.scale.set(90 / 64, 3);
    s.tint = 0xcaf3ff;
    s.alpha = clamp(m.life / m.maxLife, 0, 1) * 0.5;
  }
}

function syncWalls(){
  const pulse = 0.25 + 0.12 * Math.sin(state.time * 2.2);
  const sides = [
    { s: WALL.l, g: wallGlow.l }, { s: WALL.r, g: wallGlow.r },
    { s: WALL.t, g: wallGlow.t }, { s: WALL.b, g: wallGlow.b }
  ];
  for(const it of sides){
    it.s.alpha = clamp(pulse + it.g * 0.75, 0, 1) * 0.55;
    it.s.tint = 0x5af0ff;
  }
  WALL.fl.alpha = wallGlow.l * 0.9; WALL.fr.alpha = wallGlow.r * 0.9;
  WALL.ft.alpha = wallGlow.t * 0.9; WALL.fb.alpha = wallGlow.b * 0.9;

  const t = state.time, cs = 22;
  const corners = [[0, 0], [world.w, 0], [0, world.h], [world.w, world.h]];
  for(let i = 0; i < 4; i++){
    const p = POSTS[i];
    p.post.position.set(corners[i][0], corners[i][1]);
    p.post.rotation = t * (i % 2 ? 0.5 : -0.5);
    p.post.scale.set(1.2);
    p.post.tint = 0x5ffbf1;
    p.post.alpha = 0.6;
    p.glow.position.set(corners[i][0], corners[i][1]);
    p.glow.scale.set(0.5);
    p.glow.tint = 0x5ffbf1;
    p.glow.alpha = 0.25 + 0.12 * Math.sin(t * 3 + i);
  }
}

function wallPoly(g, w, inset){
  const hw = w.w / 2 - (inset || 0), hh = w.h / 2 - (inset || 0);
  const cos = Math.cos(w.rot), sin = Math.sin(w.rot);
  const pt = (px, py) => [w.x + px * cos - py * sin, w.y + px * sin + py * cos];
  const a = pt(-hw, -hh), b = pt(hw, -hh), c = pt(hw, hh), d = pt(-hw, hh);
  g.moveTo(a[0], a[1]).lineTo(b[0], b[1]).lineTo(c[0], c[1]).lineTo(d[0], d[1]).closePath();
}

// 正多边形柱体路径（蜂窝/晶簇），phase 决定朝向
function pillarPoly(g, q, inset){
  const n = q.sides, R = q.r - (inset || 0), a0 = q.phase;
  for(let i = 0; i < n; i++){
    const a = a0 + i / n * TAU;
    const px = q.x + Math.cos(a) * R, py = q.y + Math.sin(a) * R;
    if(i === 0) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.closePath();
}

// 静态地形：只在生成地图 / 尺寸变化时画一次，绝不每帧重绘
function buildMapStatic(){
  if(!gmap) return;
  const g = gmap, th = curTheme;
  g.clear();
  // 多边形柱体：静态实体 + 主题描边
  for(const q of pillars){
    if(q.sides < 3) continue;
    pillarPoly(g, q, 0);   g.fill({ color: th.fill, alpha: 0.9 });
    pillarPoly(g, q, 0);   g.stroke({ width: 2.6, color: th.accent, alpha: 0.55 });
    pillarPoly(g, q, 4.5); g.stroke({ width: 1, color: th.glow, alpha: 0.5 });
  }
  for(const z of zones){
    const c = z.kind === 'slow' ? 0x9b6bff : 0x5affc8;
    g.circle(z.x, z.y, z.r).fill({ color: c, alpha: 0.055 });
    g.circle(z.x, z.y, z.r).stroke({ width: 1.6, color: c, alpha: 0.26 });
  }
  for(const w of walls){
    wallPoly(g, w, 0); g.fill({ color: th.fill, alpha: 0.94 });
    wallPoly(g, w, 0); g.stroke({ width: 10, color: th.accent, alpha: 0.09 });
    wallPoly(g, w, 0); g.stroke({ width: 3.5, color: th.accent2, alpha: 0.26 });
    wallPoly(g, w, 0); g.stroke({ width: 1.3, color: th.glow, alpha: 0.66 });
    wallPoly(g, w, 5.5); g.stroke({ width: 1, color: th.accent, alpha: 0.16 });
  }
}

// 动态部分：每帧只画很少量的圆点与扩散环
function drawMapFx(){
  if(!gmapFx) return;
  const g = gmapFx, t = state.time;
  g.clear();
  if(!zones.length && !walls.length) return;

  for(const z of zones){
    const pulse = 0.5 + 0.5 * Math.sin(t * 1.3 + z.phase);
    const c = z.kind === 'slow' ? 0x9b6bff : 0x5affc8;
    const k = (t * 0.38 + z.phase / TAU) % 1;
    g.circle(z.x, z.y, z.r * k).stroke({ width: 1.2, color: c, alpha: 0.22 * (1 - k) });
    if(z.kind === 'boost'){
      const s = 9 + pulse * 4;
      g.moveTo(z.x, z.y - s).lineTo(z.x + s, z.y).lineTo(z.x, z.y + s).lineTo(z.x - s, z.y).closePath()
        .fill({ color: c, alpha: 0.16 }).stroke({ width: 1.2, color: c, alpha: 0.5 });
    } else {
      for(let i = 0; i < 3; i++){
        const a = t * 0.85 + z.phase + i / 3 * TAU;
        g.circle(z.x + Math.cos(a) * z.r * 0.52, z.y + Math.sin(a) * z.r * 0.52, 3.6)
          .fill({ color: c, alpha: 0.28 + pulse * 0.18 });
      }
    }
  }

  for(const w of walls){
    const flick = 0.5 + 0.5 * Math.sin(t * 1.7 + w.phase);
    const cos = Math.cos(w.rot), sin = Math.sin(w.rot), ex = w.w / 2 - 3;
    for(const s of [-1, 1]){
      const px = ex * s;
      g.circle(w.x + px * cos, w.y + px * sin, 3.2 + flick * 1.4)
        .fill({ color: curTheme.glow, alpha: 0.30 + flick * 0.25 });
    }
  }
}

function syncPillars(){
  for(const q of pillars){
    const pulse = 0.5 + 0.5 * Math.sin(state.time * 2 + q.phase);
    const [halo, ring, ring2, d1, d2, inner] = q.sprites;
    halo.texture = TEX.glow;
    ring.texture = TEX.ring;
    ring2.texture = TEX.ring;
    d1.texture = TEX.dot;
    d2.texture = TEX.dot;
    const th = curTheme;
    halo.position.set(q.x, q.y); halo.scale.set(q.r * 5.6 / 128); halo.tint = th.accent; halo.alpha = 0.24 + pulse * 0.14;
    ring.position.set(q.x, q.y); ring.scale.set(q.r * 2.3 / 128); ring.tint = th.accent2; ring.alpha = 0.6 + pulse * 0.3;
    ring2.position.set(q.x, q.y); ring2.scale.set(q.r * 1.25 / 128); ring2.tint = th.accent2; ring2.alpha = 0.28;
    const ra = q.ringA + state.time * q.spin;
    d1.position.set(q.x + Math.cos(ra) * (q.r + 9), q.y + Math.sin(ra) * (q.r + 9));
    d1.scale.set(5.2 / 64); d1.tint = th.glow; d1.alpha = 0.5 + pulse * 0.35;
    const rb = ra + Math.PI;
    d2.position.set(q.x + Math.cos(rb) * (q.r + 9), q.y + Math.sin(rb) * (q.r + 9));
    d2.scale.set(4 / 64); d2.tint = th.glow; d2.alpha = 0.4;
    inner.position.set(q.x, q.y);
    inner.rotation = state.time * 0.35 + q.phase;
    inner.scale.set(q.r * 0.9 / 96);
    inner.tint = th.accent2;
    inner.alpha = 0.18 + pulse * 0.16;
    inner.texture = TEX['p' + ['Mini','Tank','Turret'][q.shape % 3]];
  }
}

function syncStorms(){
  for(const s of storms){
    const [fill, ring] = s.sprites;
    if(s.phase === 'warn'){
      const k = 1 - s.t / 1.25;
      fill.texture = TEX.glow;
      fill.position.set(s.x, s.y);
      fill.scale.set(s.r * 2 * Math.max(0.05, k) / 128);
      fill.tint = 0xff8c28;
      fill.alpha = 0.30 + k * 0.22;
      ring.position.set(s.x, s.y);
      ring.rotation += 0.03;
      ring.scale.set(s.r * 2.2 / 128);
      ring.tint = 0xff8c28;
      ring.alpha = 0.5 + 0.4 * Math.sin(state.time * 10);
      ring.texture = TEX.dashRing;
    } else {
      fill.position.set(s.x, s.y);
      fill.scale.set(s.r * 2.2 / 128);
      fill.tint = 0xffb45a;
      fill.alpha = clamp(s.t / 0.45, 0, 1) * 0.5;
      fill.texture = TEX.glow;
      ring.visible = false;
    }
  }
}

function syncPickups(){
  for(const u of pickups){
    const [glow, core, dot, tether] = u.sprites;
    const fade = u.life > 2 ? 1 : (0.35 + 0.65 * (u.life / 2));
    const pulse = 0.7 + 0.3 * Math.sin(u.phase * 2);
    let cc = 0x5ffbf1;
    if(u.kind === 'heal') cc = 0x5affc8;
    else if(u.kind === 'shield') cc = 0x7fb8ff;
    else if(u.kind === 'power') cc = POWER_INFO[u.pw].color;
    // 外光（半径 34）
    glow.position.set(u.x, u.y);
    glow.scale.set(68 / 128);
    glow.tint = cc;
    glow.alpha = 0.5 * fade * pulse;
    // 图标（原版尺寸：7~10px 半径）
    const texR = u.kind === 'heal' ? 16 : u.kind === 'energy' ? 19 : 18;
    const wantR = u.kind === 'energy' ? 7 * pulse : u.kind === 'power' ? 10 * pulse : u.kind === 'heal' ? 8 : 9 * pulse;
    core.position.set(u.x, u.y);
    core.rotation = u.phase * 0.6;
    core.scale.set(wantR / texR);
    core.tint = cc;
    core.alpha = fade;
    core.texture = u.kind === 'heal' ? TEX.kHeal : u.kind === 'shield' ? TEX.kShield : u.kind === 'power' ? TEX.kPower : TEX.kEnergy;
    // 中心白点
    dot.position.set(u.x, u.y);
    dot.scale.set(5.6 / 64);
    dot.tint = 0xffffff;
    dot.alpha = fade;

    // 磁吸牵引线（进入吸附范围才显示）
    if(tether){
      const mr = 165 * M.magnet;
      const pd = Math.hypot(player.x - u.x, player.y - u.y);
      const inRange = state.mode === 'playing' && pd < mr && pd > 28;
      tether.visible = inRange;
      if(inRange){
        const k = 1 - pd / mr;
        tether.texture = TEX.tether;
        tether.anchor.set(0, 0.5);
        tether.position.set(u.x, u.y);
        tether.rotation = Math.atan2(player.y - u.y, player.x - u.x);
        tether.scale.set(pd * 0.9 / 64, 3.4 / 64);
        tether.tint = cc;
        tether.alpha = 0.16 + k * 0.44;
      }
    }
  }
}

function syncEnemies(){
  for(const e of enemies){
    const [halo, rim, body, darkCore, core, hpBg, hpFill] = e.sprites;
    const spawnK = clamp(1 - e.spawnT / (e.type === 'boss' ? 1.25 : 0.45), 0, 1);
    const flash = e.hitFlash > 0;
    // BOSS 本体/描边/泛光用 4× 高清贴图（单位 168），吾二用专属造型，其他敌人沿用原贴图（单位 42）
    const bodyTex = e.type === 'boss' ? (e.bossKind === 8 ? TEX.pMiaoYe : e.bossKind >= 5 ? TEX.pWuer[e.bossKind - 5] : TEX.pBossBig) : TEX[TEX_OF[e.type]];
    const bodyU = e.type === 'boss' ? 168 : 42;
    // 呼吸：本体半径 3% 脉动，增加活物感
    const sr = e.r * (0.55 + spawnK * 0.45) * (1 + 0.03 * Math.sin(state.time * 4 + e.wob));
    const rot = e.type === 'turret' ? state.time * 0.8
      : e.type === 'mini' ? state.time * 2 + e.wob
      : e.type === 'splitter' ? -state.time * 1.1
      : e.type === 'stinger' ? (e.chargeT > 0 ? Math.atan2(e.dirY, e.dirX) : Math.atan2(player.y - e.y, player.x - e.x)) + Math.PI / 2
      : e.type === 'weaver' ? state.time * 1.4 + e.wob
      : e.type === 'carrier' ? state.time * 0.35
      : e.type === 'pig' ? state.time * 2.2 + e.wob
      : e.type === 'boss' ? (e.bossKind >= 5 ? Math.sin(state.time * 1.7 + e.wob) * 0.07 : state.time * (e.enraged ? 1.1 : 0.5))   // 吾二有脸，不旋转，只轻摇
      : e.type === 'tank' ? state.time * 0.5 : 0;

    // 混合模式：实色层必须走普通混合（参考版是 source-over 实色多边形 + 2px 白描边 +
    // 不透明暗核）；只有外光/亮核/传送门/光环用叠加。全部走 add 会让白边与本体相加烧成白色。
    halo.blendMode = 'add';
    rim.blendMode = 'normal';
    body.blendMode = 'normal';
    darkCore.blendMode = 'normal';
    core.blendMode = 'add';
    if(hpBg) hpBg.blendMode = 'normal';
    if(hpFill) hpFill.blendMode = 'normal';

    // 外光（参考版：半径 3r 的同色辉光）
    // 贴图必须每帧重设：POOL.enemy 全槽位共享，回收的精灵可能残留 ringBig/pBossBig 等贴图
    halo.texture = TEX.glow;
    halo.position.set(e.x, e.y);
    halo.scale.set(e.r * 6 / 128);
    halo.tint = e.color;
    halo.alpha = 0.35;

    // 本体填充透明度（参考版：0.35 + spawnK * 0.65）
    const bodyA = 0.35 + spawnK * 0.65;
    const slowed = e.slowT > 0;
    const mainTint = flash ? 0xffffff : (slowed ? 0x9fd8ff : e.color);

    // 本体贴合泛光（等价于参考版多边形的 shadowBlur 20：沿轮廓外扩的同色光）
    const bloom = e.sprites[9];
    if(bloom){
      bloom.texture = bodyTex;
      bloom.rotation = rot;
      bloom.position.set(e.x, e.y);
      bloom.scale.set(sr * 1.34 / bodyU);
      bloom.tint = flash ? 0xffffff : (slowed ? 0x9fd8ff : e.color);
      bloom.alpha = 0.34;
      bloom.blendMode = 'add';
    }

    // 白色描边：比本体大 9%，垫在下面即为参考版那圈 2px 白边
    rim.position.set(e.x, e.y);
    rim.texture = bodyTex;
    rim.rotation = rot;
    rim.scale.set(sr * 1.09 / bodyU);
    rim.tint = 0xffffff;
    rim.alpha = bodyA * 0.85;

    // 本体：实色多边形（填充 0.85，顶点半径 = scaledR）
    body.position.set(e.x, e.y);
    body.texture = bodyTex;
    body.rotation = rot;
    body.scale.set(sr / bodyU);
    body.tint = mainTint;
    body.alpha = bodyA * 0.85;

    // 暗核：#0a0c14 实心圆，半径 0.42R（参考版为不透明）；吾二缩小到 0.62× 读作脸部的「核心鼻」
    const wu = e.bossKind >= 5;
    darkCore.texture = TEX.darkCore;
    darkCore.position.set(e.x, e.y);
    darkCore.scale.set(sr * 0.84 * (wu ? 0.62 : 1) / 128);
    darkCore.tint = 0x0a0c14;
    darkCore.alpha = 1;

    // 脉动亮核：半径 0.2R，alpha 0.6 + 0.4·sin(t·6 + wob)
    core.texture = TEX.dot;
    core.position.set(e.x, e.y);
    core.scale.set(sr * 0.4 * (wu ? 0.7 : 1) / 64);
    core.tint = mainTint;
    core.alpha = 0.6 + 0.4 * Math.sin(state.time * 6 + e.wob);

    // 入场传送门（spawnT 期间收缩）
    const portal = e.sprites[7];
    if(portal){
      if(e.spawnT > 0){
        const k = clamp(e.spawnT / 0.45, 0, 1);
        portal.texture = TEX.portal;
        portal.visible = true;
        portal.position.set(e.x, e.y);
        portal.rotation = state.time * 2.2;
        portal.scale.set((e.r * 4.6 * k + e.r * 1.6) / 128);
        portal.tint = e.color;
        portal.alpha = 0.2 + 0.8 * k;
      } else {
        portal.visible = false;
      }
    }

    // BOSS 双光环（内虚线外细环，反向旋转；狂怒后转橙红）
    const aura = e.sprites[8];
    if(aura){
      const auraCol = e.enraged ? 0xff5e3d : e.color;
      aura.texture = TEX.dashRingBig;
      aura.position.set(e.x, e.y);
      aura.rotation = state.time * 1.5;
      aura.scale.set(e.r * 4.6 / 256);
      aura.tint = auraCol;
      aura.alpha = 0.32 + 0.24 * Math.sin(state.time * 4);
      const aura2 = e.sprites[14];
      if(aura2){
        aura2.texture = TEX.ringBig;
        aura2.blendMode = 'add';
        aura2.position.set(e.x, e.y);
        aura2.rotation = -state.time * 0.9;
        aura2.scale.set(e.r * 2.6 / 115.2);
        aura2.tint = auraCol;
        aura2.alpha = 0.16 + 0.1 * Math.sin(state.time * 3 + 1);
      }
    }

    // 轨道细环（环绕本体的发丝环，BOSS 更大）
    const orbit = e.sprites[10];
    if(orbit){
      const oR = e.type === 'boss' ? sr * 1.7 : sr * 1.45;
      orbit.texture = TEX.ringBig;
      orbit.blendMode = 'add';
      orbit.visible = e.spawnT <= 0.2;
      orbit.position.set(e.x, e.y);
      orbit.rotation = state.time * 0.7 + e.wob;
      orbit.scale.set(oR / 115.2);
      orbit.tint = flash ? 0xffffff : e.color;
      orbit.alpha = (e.type === 'boss' ? 0.4 : e.elite ? 0.34 : 0.22) * bodyA;
    }
    // 指向玩家的眼珠（本体边缘小三角，读出敌意方向）
    const eye = e.sprites[11];
    if(eye){
      const aa = Math.atan2(player.y - e.y, player.x - e.x);
      eye.texture = TEX.chev;
      eye.blendMode = 'add';
      eye.visible = e.type !== 'mini' && e.spawnT <= 0 && !(e.bossKind >= 5);   // 吾二有五官，不再叠方向眼珠
      eye.position.set(e.x + Math.cos(aa) * sr * 0.72, e.y + Math.sin(aa) * sr * 0.72);
      eye.rotation = aa + Math.PI / 2;
      eye.scale.set((e.type === 'boss' ? 0.5 : 0.3) * (sr / e.r));
      eye.tint = flash ? 0xffffff : mainTint;
      eye.alpha = 0.55 * bodyA;
    }

    // 内部旋弧（机械内构，与本体反向旋转，藏在暗核外圈）
    const arc = e.sprites[12];
    if(arc){
      arc.texture = TEX.arc;
      arc.blendMode = 'add';
      arc.visible = e.type !== 'mini' && spawnK >= 1;
      arc.position.set(e.x, e.y);
      arc.rotation = -rot * 1.6 + e.wob;
      arc.scale.set(sr * 0.62 / 54);
      arc.tint = flash ? 0xffffff : e.color;
      arc.alpha = 0.45 * bodyA;
    }
    // 精英金环（缓慢旋转的金色发丝环）
    const eliteRim = e.sprites[13];
    if(eliteRim){
      eliteRim.texture = TEX.ring;
      eliteRim.blendMode = 'add';
      eliteRim.position.set(e.x, e.y);
      eliteRim.rotation = state.time * 0.9;
      eliteRim.scale.set(sr * 1.32 / 57.6);
      eliteRim.tint = 0xffc83d;
      eliteRim.alpha = 0.5 + 0.2 * Math.sin(state.time * 5 + e.wob);
    }

    // 吾二隐身（害羞的吾二）：整体淡出（BOSS 头顶已无血条，公平性由屏幕上的 BOSS 血条保证）
    if(e.bossKind >= 5 && e.vis !== undefined && e.vis < 0.999){
      for(let si = 0; si < e.sprites.length; si++){
        if(si === 5 || si === 6) continue;   // hpBg / hpFill 不参与隐身淡出
        const s2 = e.sprites[si];
        if(s2) s2.alpha *= e.vis;
      }
    }

    if(hpBg && hpFill){
      // BOSS 头顶不显示血条：屏幕上已有 BOSS 血条（死亡细胞式分段坠落）
      if(e.hp < e.maxHp && e.type !== 'boss'){
        const w = e.r * 2.4;
        const h = e.elite ? 4 : 3;
        hpBg.texture = TEX.bar;
        hpBg.visible = true;
        hpBg.anchor.set(0, 0.5);
        hpBg.position.set(e.x - w / 2, e.y - e.r - 12);
        hpBg.scale.set(w / 256, h / 256);
        hpBg.tint = 0x000000;
        hpBg.alpha = 0.55;
        hpFill.texture = TEX.bar;
        hpFill.visible = true;
        hpFill.anchor.set(0, 0.5);
        hpFill.position.set(e.x - w / 2, e.y - e.r - 12);
        hpFill.scale.set(w / 256 * clamp(e.hp / e.maxHp, 0, 1), h / 256);
        hpFill.tint = e.elite ? 0xffc83d : e.color;
        hpFill.alpha = 1;
      } else {
        hpBg.visible = false;
        hpFill.visible = false;
      }
    }
  }
}

function syncBullets(){
  for(const b of bullets){
    const sp = Math.hypot(b.vx, b.vy) || 1;
    const ang = Math.atan2(b.vy, b.vx);
    const tl = Math.max(10, 0.022 * sp);
    // 拖尾（参考版：lineWidth = r*0.9，圆头，长 0.022×速度）
    const t = b.spr3;
    t.position.set(b.x - (b.vx / sp) * tl * 0.5, b.y - (b.vy / sp) * tl * 0.5);
    t.rotation = ang;
    t.scale.set(tl / 64, (b.r * 0.96) / 16);
    t.tint = b.col;
    t.alpha = 0.55;
    // 外光（参考版：半径 4r，中心 0.7 透明度）
    const g = b.spr;
    g.position.set(b.x, b.y);
    g.scale.set(b.r * 8 / 128);
    g.tint = b.col;
    g.alpha = 0.7;
    // 贴芯光晕（替代参考版的 shadowBlur 16）
    const hl = b.spr4;
    hl.texture = TEX.halo;
    hl.position.set(b.x, b.y);
    hl.scale.set(b.r * 4.8 / 64);
    hl.tint = b.col;
    hl.alpha = 0.8;
    // 白芯（实心圆，半径精确 = r）
    const c = b.spr2;
    c.position.set(b.x, b.y);
    c.texture = TEX.core;
    c.scale.set(b.r / 31);
    c.tint = 0xffffff;
    c.alpha = 1;
  }
  for(const b of ebullets){
    if(b.coucou){
      // 凑凑文字弹：外光 + 「凑凑」贴图（隐藏环与白点）
      const t2 = b.spr2;
      t2.texture = TEX.coucou;
      t2.position.set(b.x, b.y);
      t2.scale.set(b.r * 2.4 / 40);
      t2.tint = b.color;
      t2.alpha = 0.95;
      const g2 = b.spr;
      g2.position.set(b.x, b.y);
      g2.scale.set(b.r * 5 / 128);
      g2.tint = b.color;
      g2.alpha = 0.55;
      b.spr3.visible = false;
      continue;
    }
    // 外光
    const g = b.spr;
    g.position.set(b.x, b.y);
    g.scale.set(b.r * 8 / 128);
    g.tint = b.color;
    g.alpha = 0.6;
    // 彩色环
    const r2 = b.spr2;
    r2.position.set(b.x, b.y);
    r2.texture = TEX.orb;
    r2.scale.set(b.r * 2.7 / 64);
    r2.tint = b.color;
    r2.alpha = 1;
    // 白点
    const c = b.spr3;
    c.position.set(b.x, b.y);
    c.texture = TEX.core;
    c.scale.set(b.r * 0.85 / 64);
    c.tint = 0xffffff;
    c.alpha = 1;
  }
}

function syncSparks(){
  for(const s of sparks){
    const a = clamp(s.life / s.maxLife, 0, 1);
    const o = s.spr;
    o.position.set(s.x, s.y);
    o.rotation = s.rot + state.time * 0.7;
    o.scale.set(s.size * (0.55 + a * 0.85) / 64);
    o.tint = s.col;
    o.alpha = a;
  }
  for(const s of shards){
    const a = clamp(s.life / s.maxLife, 0, 1);
    const o = s.spr;
    o.position.set(s.x, s.y);
    o.rotation = s.rot;
    o.scale.set(s.size * (0.7 + a * 0.5) / 48);
    o.tint = s.col;
    o.alpha = a * 0.95;
  }
  for(const s of pluses){
    const a = clamp(s.life / s.maxLife, 0, 1);
    const o = s.spr;
    o.position.set(s.x, s.y);
    o.rotation = s.rot;
    o.scale.set(s.size / 14);
    o.tint = s.col;
    o.alpha = a * (0.4 + 0.6 * (1 - a));
  }
}

function syncRings(){
  for(const r of rings){
    const a = clamp(r.life / r.maxLife, 0, 1);
    const s = r.s;
    s.position.set(r.x, r.y);
    s.texture = TEX.ring;
    s.scale.set(r.r * 2.3 / 128);
    s.tint = r.color;
    s.alpha = a * 0.9;
  }
}

function syncParticles(){
  for(const p of particles){
    const a = clamp(p.life / p.maxLife, 0, 1);
    const s = p.spr;
    s.position.set(p.x, p.y);
    s.scale.set(p.size * a * 2 / 128);
    s.tint = p.color;
    s.alpha = a;
  }
  for(const f of floats){
    const a = clamp(f.life / f.maxLife, 0, 1);
    const pop = 1 + (1 - a) * 0.3;
    f.t.position.set(f.x, f.y);
    f.t.scale.set(pop);
    f.t.alpha = a;
  }
}

// 玩家长相
const PV = {};
function updatePlayerVisual(){
  const p = player;
  const powCol = p.power > 0 ? POWER_INFO[p.powerType].color : null;
  const mainCol = (p.blessDmg > 0 || p.blessShot > 0 || p.coucouT > 0) ? 0xffc83d : (p.overload > 0 ? 0xffe45c : (powCol || 0x5ffbf1));
  const blinkA = p.invuln > 0 ? (0.62 + 0.38 * Math.sin(state.time * 24)) : 1;
  // 等级阶段：每 3 级一阶（0~4），驱动轨道菱形数量与品质色
  const tier = clamp(Math.floor((state.level - 1) / 3), 0, 4);
  const tierCol = TIER_COL[tier];

  const alive = state.mode !== 'dead';
  PV.group.forEach(s => { s.visible = alive && (s.userData === undefined || true); });

  // 拖尾（冲刺时偶数节点变为残影球体）
  const dashing = p.dashTime > 0;
  for(let i = 0; i < PV.trail.length; i++){
    const s = PV.trail[i];
    const t = p.trail[i];
    if(!t){ s.visible = false; continue; }
    const k = (i + 1) / PV.trail.length;
    s.visible = alive;
    s.position.set(t.x, t.y);
    s.tint = mainCol;
    if(dashing && i % 2 === 0){
      s.texture = TEX.ball;
      s.scale.set(p.r * k * 1.4 / 30);
      s.alpha = 0.3 * k * blinkA;
    } else {
      s.texture = TEX.glow;
      s.scale.set(p.r * k * 1.7 / 128);
      s.alpha = k * 0.32 * t.a * blinkA;
    }
  }
  PV.halo.visible = alive;
  PV.halo.position.set(p.x, p.y);
  PV.halo.scale.set(p.r * 11 / 128);
  PV.halo.tint = mainCol;
  PV.halo.alpha = 0.55 * blinkA;

  PV.ball.visible = alive;
  PV.ball.position.set(p.x, p.y);
  PV.ball.scale.set(p.r / 30 * (1 + tier * 0.05));
  PV.ball.tint = p.overload > 0 ? 0xffe45c : (powCol || 0x7ffcf3);
  PV.ball.alpha = blinkA;

  // 球体贴合泛光（参考版 shadowBlur 26：沿球轮廓外扩发光）
  PV.ballBloom.visible = alive;
  PV.ballBloom.position.set(p.x, p.y);
  PV.ballBloom.scale.set(p.r * 1.55 / 30);
  PV.ballBloom.tint = p.overload > 0 ? 0xffe45c : (powCol || 0x5ffbf1);
  PV.ballBloom.alpha = 0.42 * blinkA;

  // 反应堆双环（正反转细环，替代原呼吸圈；过载时金色加速）
  const over = p.overload > 0;
  PV.reactor.visible = alive;
  PV.reactor.position.set(p.x, p.y);
  PV.reactor.rotation = state.time * (over ? 2.6 : 1.1);
  PV.reactor.scale.set((p.r + 5) / 57.6);
  PV.reactor.tint = mainCol;
  PV.reactor.alpha = (over ? 0.55 : 0.32) * blinkA;
  PV.reactor2.visible = alive;
  PV.reactor2.position.set(p.x, p.y);
  PV.reactor2.rotation = -state.time * (over ? 3.4 : 1.7);
  PV.reactor2.scale.set((p.r + 9) / 56);
  PV.reactor2.tint = mainCol;
  PV.reactor2.alpha = (over ? 0.45 : 0.22) * blinkA;

  PV.aim.visible = alive;
  PV.aim.position.set(p.x + Math.cos(p.angle) * (p.r + 6), p.y + Math.sin(p.angle) * (p.r + 6));
  PV.aim.rotation = p.angle;
  PV.aim.scale.set(0.9, 1);
  PV.aim.tint = mainCol;
  PV.aim.alpha = 0.35 * blinkA;
  // 瞄准端点小三角
  PV.aimTip.visible = alive;
  PV.aimTip.position.set(p.x + Math.cos(p.angle) * (p.r + 64), p.y + Math.sin(p.angle) * (p.r + 64));
  PV.aimTip.rotation = p.angle + Math.PI / 2;
  PV.aimTip.scale.set(0.3);
  PV.aimTip.tint = mainCol;
  PV.aimTip.alpha = 0.4 * blinkA;

  // 反弹层
  const sp = Math.hypot(p.vx, p.vy);
  const back = sp > 30 ? Math.atan2(p.vy, p.vx) + Math.PI : p.angle + Math.PI;
  for(let i = 0; i < PV.reb.length; i++){
    const s = PV.reb[i];
    const on = i < p.rebound;
    s.visible = alive && on;
    if(!on) continue;
    const dist = p.r + 10 + i * 7 + (Math.sin(state.time * 9) + 1) * 2;
    s.position.set(p.x + Math.cos(back) * dist, p.y + Math.sin(back) * dist);
    s.rotation = back + Math.PI / 2;
    s.scale.set(0.5);
    s.tint = 0xffb347;
    s.alpha = (0.5 - i * 0.12) * blinkA;
  }

  // 护盾（旋转六边形细边 + 层数卫星点）
  PV.shieldRing.visible = alive && p.shield > 0;
  if(p.shield > 0){
    PV.shieldRing.texture = TEX.hex;
    PV.shieldRing.position.set(p.x, p.y);
    PV.shieldRing.rotation = state.time * 0.8;
    PV.shieldRing.scale.set((p.r + 12) / 42);
    PV.shieldRing.tint = 0x7fb8ff;
    PV.shieldRing.alpha = 0.75 * blinkA;
  }
  for(let i = 0; i < PV.shieldDots.length; i++){
    const s = PV.shieldDots[i];
    const on = i < p.shield;
    s.visible = alive && on;
    if(!on) continue;
    const sa = state.time * 2 + i * Math.PI;
    s.position.set(p.x + Math.cos(sa) * (p.r + 11), p.y + Math.sin(sa) * (p.r + 11));
    s.scale.set(6 / 64);
    s.tint = 0x7fb8ff;
    s.alpha = 0.9;
  }

  // 过载环（对齐参考版：实心圆环 + 呼吸半径）
  PV.overRing.visible = alive && p.overload > 0;
  if(p.overload > 0){
    PV.overRing.texture = TEX.ring;
    PV.overRing.position.set(p.x, p.y);
    PV.overRing.scale.set((p.r + 9 + Math.sin(state.time * 8) * 2) * 2.2 / 128);
    PV.overRing.rotation = 0;
    PV.overRing.tint = 0xffe45c;
    PV.overRing.alpha = 0.6 * blinkA;
  }

  // 强化环：剩余时间圆弧（对齐参考版 arc 画法，逐帧 Graphics 描边）
  PV.powRing.visible = false;
  ggrid.clear();
  if(state.mode !== 'title' && state.mode !== 'dead' && player.power > 0 && player.powerType){
    const k = clamp(player.power / player.powerMax, 0, 1);
    ggrid.arc(player.x, player.y, player.r + 15, -Math.PI / 2, -Math.PI / 2 + TAU * k)
         .stroke({ width: 1.2, color: POWER_INFO[player.powerType].color, alpha: 0.85 });
  }
  // 凑凑弹幕倒计时环（金色外环）
  if(state.mode !== 'title' && state.mode !== 'dead' && player.coucouT > 0){
    ggrid.arc(player.x, player.y, player.r + 22, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(player.coucouT / 5, 0, 1))
         .stroke({ width: 2, color: 0xffc83d, alpha: 0.8 });
  }

  // 强化碎片（仍用精灵，跟随球体）
  const hasPow = p.power > 0 && !!powCol;
  for(let i = 0; i < PV.shards.length; i++){
    const s = PV.shards[i];
    const on = hasPow;
    s.visible = alive && on;
    if(!on) continue;
    const sa = state.time * 3 + i * TAU / 3;
    s.position.set(p.x + Math.cos(sa) * 34, p.y + Math.sin(sa) * 34);
    s.scale.set(7 / 64);
    s.tint = powCol;
    s.alpha = 0.95;
  }

  // 球心旋转十字
  const vspd = Math.hypot(p.vx, p.vy);
  PV.spin.visible = alive;
  PV.spin.position.set(p.x, p.y);
  PV.spin.rotation = state.time * 1.6 + vspd * 0.012;
  PV.spin.scale.set(p.r * 1.5 / 64);
  PV.spin.tint = 0xffffff;
  PV.spin.alpha = 0.7 * blinkA;

  // 冲刺充能环（冷却中显示）
  const dashMax = Math.max(0.01, CFG.dashCd * M.dashCd);
  const chargeK = clamp(1 - p.dashCd / dashMax, 0, 1);
  PV.charge.visible = alive && chargeK < 0.999;
  if(chargeK < 0.999){
    PV.charge.position.set(p.x, p.y);
    PV.charge.rotation = -Math.PI / 2 + chargeK * TAU;
    PV.charge.scale.set((p.r + 5) * 2.2 / 128);
    PV.charge.tint = 0x7fb8ff;
    PV.charge.alpha = 0.5;
  }

  // 高速尾迹线
  const lk = clamp((vspd - 240) / 420, 0, 1);
  const backA = Math.atan2(p.vy, p.vx) + Math.PI;
  for(let i = 0; i < PV.lines.length; i++){
    const o = PV.lines[i];
    const on = alive && lk > 0.05;
    o.visible = on;
    if(!on) continue;
    const dist = p.r + 8 + i * 10 + Math.sin(state.time * 18 + i * 2) * 3;
    o.texture = TEX.streak;
    o.position.set(p.x + Math.cos(backA) * dist, p.y + Math.sin(backA) * dist);
    o.rotation = backA;
    o.scale.set((26 + i * 12) * lk / 64, (0.06 + (4.2 - i * 1.2) / 64) * lk);
    o.tint = mainCol;
    o.alpha = 0.52 * lk * blinkA;
  }

  // 等级轨道菱形：1 阶 2 颗起，每阶 +1，颜色 = 当前品质
  const orbN = [0, 2, 3, 4, 5][tier];
  for(let i = 0; i < PV.orbitals.length; i++){
    const s = PV.orbitals[i];
    const on = alive && i < orbN;
    s.visible = on;
    if(!on) continue;
    const a = state.time * (1.4 + tier * 0.25) + i * TAU / orbN;
    const rr = p.r + 13 + Math.sin(state.time * 3 + i * 2) * 2;
    s.position.set(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr);
    s.rotation = a + Math.PI / 2;
    s.scale.set(0.4 + tier * 0.05);
    s.tint = p.overload > 0 ? 0xffe45c : tierCol;
    s.alpha = 0.85 * blinkA;
  }

  // 陀螺仪双细弧（常显，反向旋转）
  for(const [s, dir] of [[PV.gyro1, 1], [PV.gyro2, -1]]){
    s.visible = alive;
    s.position.set(p.x, p.y);
    s.rotation = dir * state.time * 2.4 + (dir < 0 ? Math.PI : 0);
    s.scale.set((p.r + 4) / 54);
    s.tint = mainCol;
    s.alpha = 0.5 * blinkA;
  }

  // 三阶以上：外层虚线刻度环
  PV.ring3.visible = alive && tier >= 3;
  if(tier >= 3){
    PV.ring3.position.set(p.x, p.y);
    PV.ring3.rotation = state.time * 0.5;
    PV.ring3.scale.set((p.r + 18 + tier * 2) / 56);
    PV.ring3.tint = tierCol;
    PV.ring3.alpha = 0.3 * blinkA;
  }
}

// ---------------- HUD ----------------
const HT = {};
const HS = {};
function buildHUD(){
  hudG = new Pixi.Graphics();
  hudLayer.addChild(hudG);

  // 血条扫光
  HS.sheen = new Pixi.Sprite(TEX.glow);
  HS.sheen.anchor.set(0.5);
  HS.sheen.blendMode = 'add';
  HS.sheen.alpha = 0;
  hudLayer.addChild(HS.sheen);

  // 渐变条填充（原版 = createLinearGradient + shadowBlur，这里烘焙成贴图）
  HS.barHP = new Pixi.Sprite(TEX.barHP); HS.barHP.anchor.set(0, 0.5); hudLayer.addChild(HS.barHP);
  HS.barEN = new Pixi.Sprite(TEX.barEN); HS.barEN.anchor.set(0, 0.5); hudLayer.addChild(HS.barEN);
  HS.barXP = new Pixi.Sprite(TEX.barXP); HS.barXP.anchor.set(0, 0.5); hudLayer.addChild(HS.barXP);

  // 霓虹辉光池（垫在文字/血条下方，替代 shadowBlur）
  HS.glow = [];
  for(let i = 0; i < 16; i++){
    const g = new Pixi.Sprite(TEX.glow);
    g.anchor.set(0.5);
    g.blendMode = 'add';
    g.visible = false;
    hudLayer.addChild(g);
    HS.glow.push(g);
  }

  // 技能格（每个键一张烘焙贴图）
  HS.skBox = [];
  for(let i = 0; i < 4; i++){
    const s = new Pixi.Sprite(TEX.skJ);
    s.anchor.set(0.5);
    hudLayer.addChild(s);
    HS.skBox.push(s);
  }
  HS.skOn = new Pixi.Sprite(TEX.skOn);
  HS.skOn.anchor.set(0.5);
  HS.skOn.visible = false;
  hudLayer.addChild(HS.skOn);

  // 小地图雷达横扫
  HS.sweep = new Pixi.Sprite(TEX.tether);
  HS.sweep.anchor.set(0, 0.5);
  HS.sweep.blendMode = 'add';
  HS.sweep.visible = false;
  hudLayer.addChild(HS.sweep);

  const mk = (size, align = 'left', weight = '700') => {
    const t = new Pixi.Text({ text: '', style: { fontFamily: '"Courier New", monospace', fontSize: size, fontWeight: weight, fill: 0xffffff } });
    t.anchor.set(align === 'right' ? 1 : align === 'center' ? 0.5 : 0, 0);
    hudLayer.addChild(t);
    return t;
  };
  HT.hp = mk(12); HT.en = mk(10); HT.lv = mk(12); HT.cards = mk(10);
  HT.coucou = mk(11);
  HT.score = mk(28, 'right'); HT.wave = mk(13, 'right'); HT.foe = mk(11, 'right');
  HT.combo = mk(30, 'center'); HT.power = mk(12); HT.boss = mk(11, 'center'); HT.boss2 = mk(11, 'center');
  HT.shield = mk(11); HT.rebound = mk(11); HT.boost = mk(11);
  for(const k in HT) HT[k].resolution = 2;
  // 少量阴影：真实 dropShadow（参考版靠 shadowBlur 做霓虹），只给需要发光的几处
  neon(HT.score, 0x5ffbf1, 18);
  neon(HT.combo, 0xffe45c, 22);
  neon(HT.boss, 0xff2fd0, 12);
  neon(HT.boss2, 0xff2fd0, 12);
}

// 少量阴影：Pixi Text 自带 dropShadow（distance 0 = 对称辉光），替代参考版的 shadowBlur
function neon(t, color, blur){
  if(!t) return t;
  t.style.dropShadow = { color, alpha: 0.85, blur, distance: 0, angle: 0 };
  return t;
}

// 字号按需切换（Pixi Text 改字号会重建纹理，相同则不动）
function setFs(t, s){ if(t && t.style.fontSize !== s) t.style.fontSize = s; }

// 辉光工具（替代原版 shadowBlur）
function glowAt(i, cx, cy, w, h, color, strength){
  const g = HS.glow && HS.glow[i];
  if(!g) return;
  g.visible = strength > 0.002;
  g.position.set(cx, cy);
  g.scale.set(Math.max(0.02, w / 64), Math.max(0.02, h / 64));
  g.tint = color;
  g.alpha = strength;
}
function glowText(i, t, color, strength){
  if(!t || !t.visible || !t.text){
    const g = HS.glow && HS.glow[i];
    if(g) g.visible = false;
    return;
  }
  const w = Number.isFinite(t.width) ? Math.max(12, t.width) : 64;
  const fs = (t.style && t.style.fontSize) || 14;
  const ax = (t.anchor && t.anchor.x) || 0;
  const cx = t.x + (ax === 1 ? -w / 2 : ax === 0.5 ? 0 : w / 2);
  glowAt(i, cx, t.y + fs * 0.55, w * 1.4, fs * 2.0, color, strength);
}

function drawHUD(dt){
  const touchHud = uiTouch;
  const pad = touchHud ? 14 : 22;
  const hk = touchHud ? 0.8 : 1;   // 触屏端左上 HUD 整体收窄系数
  const p = player;
  hudG.clear();
  for(const g of HS.glow) g.visible = false;

  const bw = Math.min(touchHud ? 170 : 300, W * 0.32);
  // ---- 生命条（渐变贴图 + 辉光 + 刻度，复刻原版 bar；触屏端按 hk 收窄） ----
  const hpk = clamp(p.hp / p.maxHp, 0, 1);
  hudG.roundRect(pad, pad, bw, 16 * hk, 8 * hk).fill({ color: 0xffffff, alpha: 0.08 }).stroke({ width: 1, color: 0xffffff, alpha: 0.15 });
  for(let i = 1; i < 4; i++){
    hudG.moveTo(pad + bw * i / 4, pad + 3 * hk).lineTo(pad + bw * i / 4, pad + 13 * hk).stroke({ width: 1, color: 0xffffff, alpha: 0.14 });
  }
  HS.barHP.visible = hpk > 0.015;
  HS.barHP.position.set(pad, pad + 8 * hk);
  HS.barHP.scale.set(Math.max(2, bw * hpk) / 128, hk);
  HS.barHP.alpha = 0.97;
  glowAt(0, pad + bw * hpk * 0.5, pad + 8 * hk, bw * hpk * 1.12, 32 * hk, 0xff2d55, 0.30);
  HT.hp.text = `HP  ${Math.ceil(p.hp)} / ${Math.round(p.maxHp)}`;
  HT.hp.position.set(pad + 8 * hk, pad + 2 * hk);
  HT.hp.style.fill = 0xdcdcdc;
  setFs(HT.hp, touchHud ? 10 : 12);
  if(HS.sheen){
    const k = (state.time * 0.3) % 1;
    HS.sheen.position.set(pad + bw * k, pad + 8 * hk);
    HS.sheen.scale.set(46 / 64, 17 * hk / 64);
    HS.sheen.rotation = 0;
    HS.sheen.tint = 0xffffff;
    HS.sheen.alpha = 0.16 * Math.sin(k * Math.PI) * clamp(hpk, 0.2, 1);
  }

  // ---- 能量条 ----
  const ey = pad + 24 * hk;
  const enk = clamp(p.energy / p.maxEnergy, 0, 1);
  hudG.roundRect(pad, ey, bw * 0.82, 11 * hk, 6 * hk).fill({ color: 0xffffff, alpha: 0.08 });
  for(let i = 1; i < 5; i++){
    hudG.moveTo(pad + bw * 0.82 * i / 5, ey + 2 * hk).lineTo(pad + bw * 0.82 * i / 5, ey + 9 * hk).stroke({ width: 1, color: 0xffffff, alpha: 0.12 });
  }
  HS.barEN.visible = enk > 0.015;
  HS.barEN.position.set(pad, ey + 5.5 * hk);
  HS.barEN.scale.set(Math.max(2, bw * 0.82 * enk) / 128, 11 * hk / 16);
  HS.barEN.alpha = 0.95;
  glowAt(1, pad + bw * 0.82 * enk * 0.5, ey + 5.5 * hk, bw * 0.82 * enk * 1.12, 22 * hk, 0x5ffbf1, 0.26);
  HT.en.text = `ENERGY  ${Math.floor(p.energy)}`;
  HT.en.style.fill = 0xb3f5f5;
  HT.en.position.set(pad + 6 * hk, ey + 1 * hk);
  setFs(HT.en, touchHud ? 8 : 10);

  // ---- 等级 / 经验（菱形徽标 + 经验条） ----
  const ly = pad + 40 * hk;
  const xpk = clamp(state.xp / state.xpNeed, 0, 1);
  const dx0 = pad + 7 * hk, dy0 = ly + 3.5 * hk;
  hudG.moveTo(dx0, dy0 - 5 * hk).lineTo(dx0 + 5 * hk, dy0).lineTo(dx0, dy0 + 5 * hk).lineTo(dx0 - 5 * hk, dy0)
    .closePath().stroke({ width: 1.2, color: 0xffe45c, alpha: 0.85 });
  hudG.roundRect(pad + 16 * hk, ly, 104 * hk, 7 * hk, 3.5 * hk).fill({ color: 0xffffff, alpha: 0.08 });
  HS.barXP.visible = xpk > 0.015;
  HS.barXP.position.set(pad + 16 * hk, ly + 3.5 * hk);
  HS.barXP.scale.set(Math.max(2, 104 * hk * xpk) / 128, 7 * hk / 16);
  HS.barXP.alpha = 0.95;
  glowAt(2, pad + 16 * hk + 52 * hk * Math.max(xpk, 0.06), ly + 3.5 * hk, 104 * hk * Math.max(xpk, 0.06) + 26 * hk, 16 * hk, 0xffa73d, 0.16);
  HT.lv.text = `LV ${state.level}`;
  HT.lv.style.fill = 0xffe45c;
  HT.lv.position.set(pad + 128 * hk, ly - 5 * hk);
  setFs(HT.lv, touchHud ? 10 : 12);

  // ---- 状态行 ----
  let sy = ly + 14 * hk;
  HT.shield.text = p.shield > 0 ? `◈ 护盾 ×${p.shield}` : '';
  HT.shield.style.fill = 0x7fb8ff;
  HT.shield.position.set(pad + 2, sy);
  setFs(HT.shield, touchHud ? 9 : 11);
  sy += 14 * hk;
  HT.rebound.text = p.rebound > 0 ? `⚡ 反弹 ×${p.rebound}` : '';
  HT.rebound.style.fill = 0xffb347;
  HT.rebound.position.set(pad + 2, sy);
  setFs(HT.rebound, touchHud ? 9 : 11);
  sy += 14 * hk;
  if(p.coucouT > 0){
    HT.coucou.text = `凑凑 ${p.coucouT.toFixed(1)}s · 射速-90% · 伤害+150%`;
    HT.coucou.style.fill = 0xffc83d;
    HT.coucou.position.set(pad + 2, sy);
    setFs(HT.coucou, touchHud ? 9 : 11);
    sy += 14 * hk;
  } else HT.coucou.text = '';
  if(state.cards.length){
    const last = state.cards[state.cards.length - 1];
    HT.cards.text = `卡牌 ${state.cards.length} · 上级 ${TIER_NAME[last.t]}`;
    HT.cards.style.fill = last.c;
    HT.cards.position.set(pad + 2, sy);
  } else HT.cards.text = '';
  setFs(HT.cards, touchHud ? 8 : 10);

  // 强化状态
  if(p.power > 0 && p.powerType){
    const info = POWER_INFO[p.powerType];
    const wy = sy + 18 * hk;
    const k = p.power / p.powerMax;
    hudG.roundRect(pad, wy, 130 * hk, 22 * hk, 6 * hk).fill({ color: 0x0a0e1a, alpha: 0.85 }).stroke({ width: 1.5, color: info.color, alpha: 0.95 });
    HT.power.text = `${info.name}  ${p.power.toFixed(1)}s`;
    HT.power.style.fill = info.color;
    HT.power.position.set(pad + 9 * hk, wy + 5 * hk);
    setFs(HT.power, touchHud ? 10 : 12);
    hudG.roundRect(pad, wy + 19 * hk, 130 * hk * k, 3 * hk, 1.5 * hk).fill({ color: info.color, alpha: 0.5 });
    glowAt(3, pad + 65 * hk, wy + 11 * hk, 164 * hk, 36 * hk, info.color, 0.14);
  } else HT.power.text = '';

  // 分数（触屏端缩小字号，给画面让位）
  const scSize = touchHud ? 21 : 28;
  if(HT.score.style.fontSize !== scSize) HT.score.style.fontSize = scSize;
  const wvSize = touchHud ? 10 : 13;
  if(HT.wave.style.fontSize !== wvSize) HT.wave.style.fontSize = wvSize;
  const foSize = touchHud ? 9 : 11;
  if(HT.foe.style.fontSize !== foSize) HT.foe.style.fontSize = foSize;
  HT.score.text = String(state.score).padStart(6, '0');
  HT.score.style.fill = 0x5ffbf1;
  HT.score.position.set(W - pad, pad - 4);
  const scw = HT.score.width || 0;
  hudG.moveTo(W - pad - scw, pad + 28).lineTo(W - pad, pad + 28).stroke({ width: 1, color: 0x5ffbf1, alpha: 0.4 });
  hudG.moveTo(W - pad - scw - 14, pad + 24).lineTo(W - pad - scw - 9, pad + 28).lineTo(W - pad - scw - 14, pad + 32).lineTo(W - pad - scw - 19, pad + 28)
    .closePath().stroke({ width: 1, color: 0x5ffbf1, alpha: 0.5 });
  HT.wave.text = touchHud ? `W${state.wave} · 敌 ${enemies.length + state.spawnQueue.length}` : `WAVE ${state.wave}`;
  HT.wave.style.fill = 0xffffff;
  HT.wave.position.set(W - pad, pad + (touchHud ? 22 : 30));
  HT.foe.text = touchHud ? '' : `残敌 ${enemies.length + state.spawnQueue.length}`;
  HT.foe.style.fill = 0x9fb0c8;
  HT.foe.position.set(W - pad, pad + 48);

  // ---- 连击（带倒计时环） ----
  if(state.combo > 1){
    const heat = clamp(state.combo / 30, 0, 1);
    HT.combo.text = `×${state.combo} COMBO`;
    HT.combo.style.fontSize = 30 + heat * 16;
    const ccombo = heat > 0.6 ? 0xff7a3d : 0xffe45c;
    if(HT.combo.style.fill !== ccombo){
      HT.combo.style.fill = ccombo;
      if(HT.combo.style.dropShadow) HT.combo.style.dropShadow.color = ccombo;
    }
    HT.combo.position.set(W / 2, 30);
    const kTim = clamp(state.comboTimer / (3 + M.comboKeep), 0, 1);
    hudG.arc(W / 2, 48, 76, -Math.PI / 2, -Math.PI / 2 + TAU * kTim)
        .stroke({ width: 1.5, color: ccombo, alpha: 0.45 });
  } else HT.combo.text = '';

  // ---- 波次提示（已改为世界内小字浮标，不再有全屏横幅/扫光） ----

  // ---- 技能条 / 常驻技能格（触屏端由 DOM 摇杆与按钮接管，底部技能栏整体隐藏） ----
  if(touchHud){
    for(const b of HS.skBox) b.visible = false;
    HS.skOn.visible = false;
    for(const t of textHUD.skills) t.visible = false;
    for(const t of textHUD.skillsName) t.visible = false;
    for(const t of textHUD.skillsCd) t.visible = false;
    for(const t of textHUD.actKey) t.visible = false;
    for(const t of textHUD.actName) t.visible = false;
    for(const t of textHUD.actCd) t.visible = false;
  }
  if(!touchHud){
  const skills = [
    { key: 'J', name: '射击', cd: 0, max: 0, c: 0x5ffbf1 },
    { key: 'K', name: M.dashCharges > 0 ? '冲刺×' + Math.max(0, p.charges) : '冲刺', cd: p.charges > 0 ? 0 : p.dashCd, max: CFG.dashCd * M.dashCd, c: 0x7fb8ff },
    { key: 'H', name: '修复', cd: p.healCd, max: 3.5, c: 0x5affc8 },
    { key: 'SPC', name: '过载', cd: p.overload > 0 ? -1 : 0, max: 0, c: 0xffe45c }
  ];
  const skTex = [TEX.skJ, TEX.skK, TEX.skH, TEX.skS];
  const size = 46;
  const syy = H - size - 22;
  let skOnShown = false;
  for(let i = 0; i < 4; i++){
    const s = skills[i];
    const cxs = sx0(i) + size / 2, cys = syy + size / 2;
    const box = HS.skBox[i];
    box.texture = skTex[i];
    box.visible = true;
    box.position.set(cxs, cys);
    box.scale.set(size / 96);
    box.alpha = s.cd > 0 ? 0.4 : 1;
    const skGlow = s.cd === -1 ? 0.30 + 0.14 * Math.sin(state.time * 10)
      : s.cd > 0 ? 0.05 : 0.16;
    glowAt(9 + i, cxs, cys, size * 2.4, size * 2.4, s.c, skGlow);
    if(s.cd === -1){
      HS.skOn.visible = true;
      HS.skOn.position.set(cxs, cys);
      HS.skOn.scale.set(size / 96);
      HS.skOn.alpha = 0.16 + 0.16 * Math.sin(state.time * 10);
      skOnShown = true;
    }
    if(s.cd > 0 && s.max > 0){
      hudG.moveTo(cxs, cys);
      hudG.arc(cxs, cys, size, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(s.cd / s.max, 0, 1));
      hudG.closePath().fill({ color: 0x000000, alpha: 0.55 });
    }
  }
  if(!skOnShown) HS.skOn.visible = false;

  textHUD.skills.forEach((t, i) => {
    const s = skills[i];
    t.text = s.key;
    t.style.fill = s.c;
    t.position.set(sx0(i) + size / 2, syy + size / 2 - 12);
    t.visible = true;
    textHUD.skillsName[i].text = s.name;
    textHUD.skillsName[i].style.fill = 0x9fb0c8;
    textHUD.skillsName[i].position.set(sx0(i) + size / 2, syy + size / 2 + 4);
    textHUD.skillsName[i].visible = true;
    const cdT = textHUD.skillsCd && textHUD.skillsCd[i];
    if(cdT){
      if(s.cd > 0){
        cdT.text = s.cd.toFixed(1);
        cdT.style.fill = 0xffffff;
        cdT.position.set(sx0(i) + size / 2, syy + size / 2 - 6);
        cdT.visible = true;
      } else cdT.visible = false;
    }
  });

  // ---- 常驻技能格（选卡获得的主动技能，1/2/3 释放） ----
  const asz = 42, agap = 10;
  const ax0 = sx0(0) - (asz * 3 + agap * 2 + 18);
  const ay = syy + 2;
  for(let i = 0; i < 3; i++){
    const ax = ax0 + i * (asz + agap);
    const s = p.actives[i];
    const def = s ? ACTIVE_BY_ID[s.id] : null;
    const col = def ? def.c : 0x3d4b60;
    hudG.roundRect(ax, ay, asz, asz, 8)
      .fill({ color: 0x0a0e1a, alpha: def ? 0.85 : 0.45 })
      .stroke({ width: 1.4, color: col, alpha: def ? 0.9 : 0.4 });
    // 角括号（与选卡界面同语言）
    const abl = 7;
    hudG.moveTo(ax - 2, ay - 2 + abl).lineTo(ax - 2, ay - 2).lineTo(ax - 2 + abl, ay - 2)
      .moveTo(ax + asz + 2 - abl, ay - 2).lineTo(ax + asz + 2, ay - 2).lineTo(ax + asz + 2, ay - 2 + abl)
      .moveTo(ax - 2, ay + asz + 2 - abl).lineTo(ax - 2, ay + asz + 2).lineTo(ax - 2 + abl, ay + asz + 2)
      .moveTo(ax + asz + 2 - abl, ay + asz + 2).lineTo(ax + asz + 2, ay + asz + 2).lineTo(ax + asz + 2, ay + asz + 2 - abl)
      .stroke({ width: 1, color: col, alpha: def ? 0.6 : 0.25 });
    glowAt(13 + i, ax + asz / 2, ay + asz / 2, asz * 2.2, asz * 2.2, col, def ? (s.cd > 0 ? 0.04 : 0.15) : 0);
    if(s && s.cd > 0){
      hudG.moveTo(ax + asz / 2, ay + asz / 2);
      hudG.arc(ax + asz / 2, ay + asz / 2, asz, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(s.cd / def.cd, 0, 1));
      hudG.closePath().fill({ color: 0x000000, alpha: 0.55 });
    }
    // 阶位刻度点
    if(s){
      for(let k = 0; k < s.lv; k++){
        hudG.circle(ax + asz / 2 + (k - (s.lv - 1) / 2) * 6, ay + asz - 4, 1.4).fill({ color: col, alpha: 0.95 });
      }
    }
    const kT = textHUD.actKey[i];
    kT.text = String(i + 1);
    kT.style.fill = col;
    kT.position.set(ax + asz / 2, ay + 2);
    kT.visible = true;
    const nT = textHUD.actName[i];
    nT.text = def ? def.n : '空';
    nT.style.fill = def ? 0xd8e6f5 : 0x3d4b60;
    nT.position.set(ax + asz / 2, ay + asz / 2 + 1);
    nT.visible = true;
    const cT = textHUD.actCd[i];
    if(s && s.cd > 0){
      cT.text = s.cd.toFixed(1);
      cT.style.fill = 0xffffff;
      cT.position.set(ax + asz / 2, ay + asz / 2 - 7);
      cT.visible = true;
    } else cT.visible = false;
  }

  }
  drawMinimap();
  drawBossBar(dt);
}

function sx0(i){
  const size = 46, gap = 12;
  const total = 4 * size + 3 * gap;
  return W / 2 - total / 2 + i * (size + gap);
}

function drawMinimap(){
  // 触屏端收窄小地图，给战斗画面让出视野
  const touchMini = uiTouch;
  const mw = touchMini ? 104 : 150, mh = touchMini ? 78 : 112;
  const mx = W - mw - (touchMini ? 12 : 22), my = touchMini ? 76 : 96;
  hudG.roundRect(mx, my, mw, mh, 8).fill({ color: 0x080a14, alpha: 0.62 }).stroke({ width: 1.2, color: 0x5ffbf1, alpha: 0.35 });
  // 四角括号（与选卡界面同语言）
  const bl = 10;
  hudG.moveTo(mx - 5, my - 5 + bl).lineTo(mx - 5, my - 5).lineTo(mx - 5 + bl, my - 5)
    .moveTo(mx + mw + 5 - bl, my - 5).lineTo(mx + mw + 5, my - 5).lineTo(mx + mw + 5, my - 5 + bl)
    .moveTo(mx - 5, my + mh + 5 - bl).lineTo(mx - 5, my + mh + 5).lineTo(mx - 5 + bl, my + mh + 5)
    .moveTo(mx + mw + 5 - bl, my + mh + 5).lineTo(mx + mw + 5, my + mh + 5).lineTo(mx + mw + 5, my + mh + 5 - bl)
    .stroke({ width: 1.2, color: 0x5ffbf1, alpha: 0.5 });
  // 雷达同心环
  hudG.ellipse(mx + mw / 2, my + mh / 2, mw * 0.32, mh * 0.32).stroke({ width: 1, color: 0x5ffbf1, alpha: 0.12 });
  hudG.ellipse(mx + mw / 2, my + mh / 2, mw * 0.48, mh * 0.48).stroke({ width: 1, color: 0x5ffbf1, alpha: 0.08 });
  // 雷达横扫
  if(HS.sweep){
    HS.sweep.visible = true;
    HS.sweep.texture = TEX.tether;
    HS.sweep.position.set(mx + mw / 2, my + mh / 2);
    HS.sweep.rotation = state.time * 1.5;
    HS.sweep.scale.set(mw * 0.92 / 64, mh * 0.9 / 16);
    HS.sweep.tint = 0x9ff6ff;
    HS.sweep.alpha = 0.22;
  }
  const sx = mw / world.w, sy = mh / world.h;
  hudG.rect(mx + cam.x * sx, my + cam.y * sy, (W / cam.zoom) * sx, (H / cam.zoom) * sy)
       .stroke({ width: 1, color: 0xffffff, alpha: 0.22 });
  for(const z of zones){
    const zc = z.kind === 'slow' ? 0x9b6bff : 0x5affc8;
    hudG.circle(mx + z.x * sx, my + z.y * sy, Math.max(3, z.r * sx)).fill({ color: zc, alpha: 0.13 });
    hudG.circle(mx + z.x * sx, my + z.y * sy, Math.max(3, z.r * sx)).stroke({ width: 1, color: zc, alpha: 0.5 });
  }
  for(const q of pillars){
    hudG.circle(mx + q.x * sx, my + q.y * sy, Math.max(2, q.r * sx)).stroke({ width: 1, color: curTheme.accent2, alpha: 0.75 });
  }
  for(const w of walls){
    const hw = w.w / 2 * sx, hh = w.h / 2 * sy;
    const cos = Math.cos(w.rot), sin = Math.sin(w.rot);
    const cx = mx + w.x * sx, cy = my + w.y * sy;
    const pt = (px, py) => [cx + px * cos - py * sin, cy + px * sin + py * cos];
    const a = pt(-hw, -hh), b = pt(hw, -hh), c = pt(hw, hh), d = pt(-hw, hh);
    hudG.moveTo(a[0], a[1]).lineTo(b[0], b[1]).lineTo(c[0], c[1]).lineTo(d[0], d[1]).closePath()
      .fill({ color: curTheme.accent, alpha: 0.55 });
  }
  for(const u of pickups){
    const cc = u.kind === 'heal' ? 0x5affc8 : u.kind === 'shield' ? 0x7fb8ff : u.kind === 'power' ? 0xffe45c : 0x5ffbf1;
    hudG.rect(mx + u.x * sx - 1.5, my + u.y * sy - 1.5, 3, 3).fill({ color: cc, alpha: 0.8 });
  }
  for(const s of storms){
    hudG.circle(mx + s.x * sx, my + s.y * sy, 3.2).fill({ color: 0xff8c28, alpha: 0.85 });
  }
  for(const e of enemies){
    // 隐身中的吾二在小地图上只剩一个淡点（保留可追踪性，但不暴露精确位置）
    const ma = (e.bossKind >= 5 && e.stealth === 1) ? 0.22 : 0.95;
    hudG.circle(mx + e.x * sx, my + e.y * sy, e.type === 'boss' ? 4.5 : e.elite ? 3.2 : 2.6).fill({ color: e.elite ? 0xffc83d : e.color, alpha: ma });
  }
  hudG.circle(mx + player.x * sx, my + player.y * sy, 3.4).fill({ color: 0xffffff, alpha: 1 });
}

function drawBossBar(dt){
  const bs = enemies.filter(e => e.type === 'boss').slice(0, 2);
  if(!bs.length){
    HT.boss.text = ''; if(HT.boss2) HT.boss2.text = '';
    state.bossBars = {};
    return;
  }
  dt = dt || 0.016;
  const dual = bs.length > 1;
  // 清理已死亡 BOSS 的血条状态
  const ids = new Set(bs.map(x => x.id));
  for(const key in state.bossBars) if(!ids.has(+key)) delete state.bossBars[key];

  const bw = uiTouch ? Math.min(300, W * 0.5) : Math.min(470, W * 0.56);
  const bx = W / 2 - bw / 2;
  // 双子 BOSS（喵雅喵的祝福）：上下两条独立血条，各自颜色、名字与坠落碎块
  const bh = dual ? (uiTouch ? 8 : 15) : (uiTouch ? 10 : 22);
  const gap = dual ? (uiTouch ? 5 : 12) : 0;
  const byTop = uiTouch ? 6 : (dual ? H - 122 : H - 106);

  bs.forEach((b, bi) => {
    const by = byTop + bi * (bh + gap);
    const S = state.bossBars[b.id] || (state.bossBars[b.id] = { k: 1, chunks: [], cutT: 0 });
    const k = clamp(b.hp / b.maxHp, 0, 1);
    const barCol = b.enraged ? 0xff5e3d : b.color;
    // 死亡细胞式分段坠落：掉血部分碎成硬边方块，阶梯延迟剥落、受重力坠落消散（每条独立）
    if(k < S.k - 1e-4){
      const lost = S.k - k;
      const n = clamp(Math.round(lost * bw / bh), 1, 6);            // 块数随损失量，单块接近正方形
      for(let i = 0; i < n; i++){
        S.chunks.push({ x0: k + lost * i / n, x1: k + lost * (i + 1) / n, y: 0, v: 0, t: -(n - 1 - i) * 0.05 });
      }
      if(S.chunks.length > 18) S.chunks.splice(0, S.chunks.length - 18);
      S.cutT = 0.3;                                                  // 断口灼热计时
    }
    S.k = k;
    // 外框双线 + 底座（整条直角硬边，对标 demo 的像素断切感）
    hudG.rect(bx - 4, by - 4, bw + 8, bh + 8).stroke({ width: 1, color: barCol, alpha: 0.3 });
    hudG.rect(bx, by, bw, bh).fill({ color: 0x0a0614, alpha: 0.82 });
    hudG.rect(bx, by, bw * k, bh).fill({ color: barCol, alpha: 0.95 });
    // 坠落碎块（画在主条之后、凹槽之前，剥落瞬间与血条严丝合缝）
    for(let i = S.chunks.length - 1; i >= 0; i--){
      const c = S.chunks[i];
      c.t += dt;
      if(c.t > 0){ c.v += 520 * dt; c.y += c.v * dt; }
      const p = clamp(c.t / 0.7, 0, 1);
      if(p >= 1){ S.chunks.splice(i, 1); continue; }
      hudG.rect(bx + bw * c.x0, by + c.y, bw * (c.x1 - c.x0) + 0.5, bh)
        .fill({ color: 0xffffff, alpha: 0.95 * (1 - p) });
    }
    // 十格凹槽（分段读数）
    for(let i = 1; i < 10; i++){
      hudG.rect(bx + bw * i / 10 - 1, by + 2, 2, bh - 4).fill({ color: 0x0a0614, alpha: 0.85 });
    }
    hudG.rect(bx, by, bw, bh).stroke({ width: 1.5, color: barCol, alpha: 0.85 });
    // 断口灼热（画最上层，掉血瞬间断口一道亮白 + 同色光晕）
    if(S.cutT > 0){
      S.cutT -= dt;
      const ca = clamp(S.cutT / 0.3, 0, 1);
      hudG.rect(bx + bw * k - 1.5, by - 3, 3, bh + 6).fill({ color: 0xffffff, alpha: 0.9 * ca });
      glowAt(5 + bi * 2, bx + bw * k, by + bh / 2, 34, bh + 34, barCol, 0.65 * ca);
    }
    // 狂怒相位线（50%）
    hudG.moveTo(bx + bw / 2, by - 5).lineTo(bx + bw / 2, by + bh + 5).stroke({ width: 1.5, color: 0xffffff, alpha: 0.35 });
    glowAt(4 + bi * 2, bx + bw * k * 0.5, by + bh / 2, bw * k + 60, bh + 18, barCol, 0.18);
    // 两端菱形铆钉
    for(const ex of [bx - 14, bx + bw + 14]){
      hudG.moveTo(ex, by + bh / 2 - 7).lineTo(ex + 7, by + bh / 2).lineTo(ex, by + bh / 2 + 7).lineTo(ex - 7, by + bh / 2).closePath()
        .fill({ color: 0x0a0614, alpha: 0.9 });
      hudG.moveTo(ex, by + bh / 2 - 7).lineTo(ex + 7, by + bh / 2).lineTo(ex, by + bh / 2 + 7).lineTo(ex - 7, by + bh / 2).closePath()
        .stroke({ width: 1.2, color: barCol, alpha: 0.9 });
    }
  });

  // 名称：单 BOSS 大字原名上方格式；双子每条左侧小字、各自配色（一眼区分两只吾二）
  if(!dual){
    const b = bs[0], barCol = b.enraged ? 0xff5e3d : b.color;
    HT.boss.anchor.set(0.5, 0);
    HT.boss.text = b.enraged ? `狂 怒 · ${bossNameOf(b)}` : `${bossNameOf(b)}  ${bossEnOf(b)}`;
    HT.boss.style.fill = b.enraged ? 0xffb09a : 0xffd7f4;
    setFs(HT.boss, uiTouch ? 9 : 11);
    const nameY = uiTouch ? byTop + bh + 2 : byTop - 18;
    HT.boss.position.set(W / 2, nameY);
    if(HT.boss2) HT.boss2.text = '';
    // 名称两侧装饰线
    const nbw = HT.boss.width || 120;
    hudG.moveTo(W / 2 - nbw / 2 - 42, nameY + 6).lineTo(W / 2 - nbw / 2 - 12, nameY + 6).stroke({ width: 1, color: barCol, alpha: 0.5 });
    hudG.moveTo(W / 2 + nbw / 2 + 12, nameY + 6).lineTo(W / 2 + nbw / 2 + 42, nameY + 6).stroke({ width: 1, color: barCol, alpha: 0.5 });
  } else {
    bs.forEach((b, bi) => {
      const T = bi === 0 ? HT.boss : HT.boss2;
      if(!T) return;
      T.anchor.set(1, 0.5);
      T.text = (b.enraged ? '狂怒 · ' : '') + bossNameOf(b);
