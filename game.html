    scrGlow(2, W / 2, p.help.y + 110, W * 0.52, 250, 0x5ffbf1, 0.12);
  }
  if(state.mode === 'dead'){
    const d = SCR.dead._parts;
    scrGlow(5, W / 2, d.d2.y + 62, 480, 170, 0x5ffbf1, 0.14);
    d.d2.text =
      `得分  ${state.score}\n最高分  ${state.best}\n抵达波次  ${state.wave} · 等级 ${state.level} · 卡牌 ${state.cards.length}`;
  }
}

// ---------------- 主循环 ----------------
let lastT = 0;

function frame(ticker){
  const rawMs = ticker.deltaMS || 16.7;
  const raw = Math.min(0.05, rawMs / 1000);
  let dt = raw;

  if(state.hitStop > 0){
    state.hitStop = Math.max(0, state.hitStop - raw);
    dt *= 0.25;
  }

  update(dt);

  // 摄像机 / 世界
  const sh = state.shake;
  const shx = sh > 0.3 ? rand(-sh, sh) : 0;
  const shy = sh > 0.3 ? rand(-sh, sh) : 0;
  worldLayer.scale.set(cam.zoom);
  worldLayer.position.set(-cam.x * cam.zoom + shx, -cam.y * cam.zoom + shy);

  syncBackground();
  syncStars();
  syncWallPulses();
  syncWalls();
  syncPillars();
  syncStorms();
  syncPickups();
  syncEnemies();
  syncBullets();
  syncRings();
  syncParticles();
  syncSparks();
  updatePlayerVisual();

  grow.clear();
  if(state.mode !== 'title'){
    // 地面网格
    const s = 64;
    const vx0 = cam.x - s, vy0 = cam.y - s;
    const vx1 = cam.x + W / cam.zoom + s, vy1 = cam.y + H / cam.zoom + s;
    const startX = Math.floor(vx0 / s) * s + (state.time * 14) % s;
    for(let x = startX; x < vx1; x += s){ grow.moveTo(x, vy0); grow.lineTo(x, vy1); }
    const startY = Math.floor(vy0 / s) * s + (state.time * 14) % s;
    for(let y = startY; y < vy1; y += s){ grow.moveTo(vx0, y); grow.lineTo(vx1, y); }
    grow.stroke({ width: 1, color: 0x1de9ff, alpha: 0.10 });
  }
  PV.group.forEach(s => { if(state.mode === 'title') s.visible = false; });

  // HUD
  const showHud = state.mode === 'playing' || state.mode === 'cards';
  hudG.visible = showHud;
  for(const k in HT) HT[k].visible = showHud;
  if(HS.sheen) HS.sheen.visible = showHud;
  textHUD.visible = showHud;
  for(const t of textHUD.skills) t.visible = showHud;
  for(const t of textHUD.skillsName) t.visible = showHud;
  for(const t of textHUD.skillsCd) t.visible = showHud;
  if(!showHud){
    for(const b of HS.skBox) b.visible = false;
    HS.skOn.visible = false;
    HS.barHP.visible = HS.barEN.visible = HS.barXP.visible = false;
    if(HS.sweep) HS.sweep.visible = false;
  }
  if(showHud) drawHUD();
  updateMarkers();
  if(state.mode === 'cards' && CARD_UI.length){
    if(cardUI && cardUI._tGlow) cardUI._tGlow.alpha = 0.09 + 0.05 * Math.sin(state.time * 3);
    for(const it of CARD_UI){
      if(it.ring) it.ring.rotation = state.time * 0.9;
      const on = it.i === state.sel;
      const tIn = clamp((state.time - it.born) / 0.42, 0, 1);
      const ease = 1 - Math.pow(1 - tIn, 3);
      it.curScale = lerp(it.curScale, on ? 1.05 : 1, 1 - Math.exp(-14 * dt));
      it.holder.scale.set(it.curScale);
      it.holder.position.set(it.cx + it.w / 2, it.baseY + it.h / 2 + (1 - ease) * 42);
      it.holder.alpha = ease;
      it.glow.alpha = (on ? 0.16 + 0.07 * Math.sin(state.time * 5.5) : 0.045) * ease;
    }
  }
  syncScreens();

  // 屏幕效果
  dangerEl.style.opacity = state.mode === 'playing'
    ? String(clamp(1 - player.hp / (player.maxHp * 0.35), 0, 1) * (0.6 + 0.4 * Math.sin(state.time * 7)))
    : '0';
  flashEl.style.opacity = String(clamp(state.flash * 1.1, 0, 0.55));
  novaEl.style.opacity = String(clamp(state.novaFlash * 1.2, 0, 0.6));

  // 性能自适应
  perf.ema = perf.ema * 0.94 + rawMs * 0.06;
  if(state.time - perf.lastCheck > 2){
    perf.lastCheck = state.time;
    if(!perf.low && perf.ema > 22){
      perf.low = true;
      state.particleCap = 420;
    }
    if(!perf.resDropped && perf.ema > 30){
      perf.resDropped = true;
      try { app.renderer.resolution = 1; app.renderer.resize(W, H); } catch(e){}
    }
  }
}

// ---------------- 初始化 ----------------
let dangerEl = document.getElementById('danger');
let flashEl = document.getElementById('flash');
let novaEl = document.getElementById('nova');
const WALL = {};
const POSTS = [];
const MARKERS = [];
const textHUD = { skills: [], skillsName: [], skillsCd: [], visible: true };

async function main(){
  const P = await ensurePixi();
  if(!P){
    errEl.textContent = 'PixiJS 未能就绪：脚本已下载但没有暴露全局（已尝试 PIXI / Pixi / pixi 与 ESM 动态导入兜底）。请检查 CDN 是否被拦截，或改用本地 pixi.min.js。';
    errEl.style.display = 'flex';
    return;
  }
  Pixi = P;          // 写入模块内命名空间：之后所有 Pixi.xxx 引用都由它解析
  console.log('[弹核球] PixiJS 就绪，来源: ' + pixiGlobalName);
  app = new Pixi.Application();
  await app.init({
    background: 0x05060d,
    resizeTo: window,
    antialias: false,
    resolution: Math.min(2, window.devicePixelRatio || 1),
    autoDensity: true,
    preference: 'webgl'
  });
  document.body.appendChild(app.canvas);

  W = window.innerWidth; H = window.innerHeight;
  computeWorld();
  buildTextures();

  starFarLayer = new Pixi.Container();
  starNearLayer = new Pixi.Container();
  bgLayer = new Pixi.Container();
  dustLayer = new Pixi.Container();
  worldLayer = new Pixi.Container();
  hudLayer = new Pixi.Container();
  app.stage.addChild(starFarLayer, starNearLayer, bgLayer, dustLayer, worldLayer, hudLayer);

  POOL = {
    starFar: mkPool(TEX.core, 150, starFarLayer, true),
    starNear: mkPool(TEX.core, 70, starNearLayer, true),
    wallPulse: mkPool(TEX.line, 8, worldLayer, true),
    spark: mkPool(TEX.spark, 140, worldLayer, true),
    shard: mkPool(TEX.shard, 90, worldLayer, true),
    tether: mkPool(TEX.tether, 40, worldLayer, true),
    portal: mkPool(TEX.portal, 44, worldLayer, true),
    bossAura: mkPool(TEX.dashRing, 2, worldLayer, true),
    neb: mkPool(TEX.glow, 8, bgLayer, true),
    dust: mkPool(TEX.dot, 120, dustLayer, true),
    meteor: mkPool(TEX.streak, 5, bgLayer, true),
    part: mkPool(TEX.glow, 900, worldLayer, true),
    ring: mkPool(TEX.ring, 44, worldLayer, true),
    bullet: mkPool(TEX.glow, 260, worldLayer, true),
    bulletCore: mkPool(TEX.bullet, 260, worldLayer, true),
    bulletTrail: mkPool(TEX.trail, 260, worldLayer, true),
    bulletHalo: mkPool(TEX.halo, 260, worldLayer, true),
    ebullet: mkPool(TEX.glow, 240, worldLayer, true),
    ebulletRing: mkPool(TEX.orb, 240, worldLayer, true),
    ebulletCore: mkPool(TEX.core, 240, worldLayer, true),
    enemyBloom: mkPool(TEX.dot, 44, worldLayer, true),
    enemy: mkPool(TEX.dot, 44 * 9, worldLayer, true),
    plus: mkPool(TEX.plus, 16, worldLayer, true),
    pillar: mkPool(TEX.dot, 8 * 6, worldLayer, true),
    storm: mkPool(TEX.dashRing, 6, worldLayer, true),
    pkGlow: mkPool(TEX.glow, 40, worldLayer, true),
    pkCore: mkPool(TEX.kEnergy, 40, worldLayer, true),
    pkDot: mkPool(TEX.core, 40, worldLayer, true),
    float: []
  };
  // 飘字池
  for(let i = 0; i < 34; i++){
    const t = new Pixi.Text({ text: '', style: { fontFamily: '"Courier New", monospace', fontSize: 16, fontWeight: 'bold', fill: 0xffffff } });
    t.anchor.set(0.5);
    t.visible = false;
    worldLayer.addChild(t);
    t._used = false;
    POOL.float.push(t);
  }
  POOL.float.get = function(){
    for(let i = 0; i < POOL.float.length; i++){
      const t = POOL.float[i];
      if(!t._used){ t._used = true; t.visible = true; return t; }
    }
    return null;
  };

  // 地面网格压到最底层（先于所有池化精灵绘制）
  grow = new Pixi.Graphics();
  worldLayer.addChildAt(grow, 0);
  ggrid = new Pixi.Graphics();
  worldLayer.addChildAt(ggrid, 1);
  makeStars();
  makeWallPulses();

  // 连击热力光（已按需求移除全局泛光）

  // 边墙
  const mkEdge = (rot, x, y, sw, sh) => {
    const s = new Pixi.Sprite(TEX.edge);
    s.anchor.set(0.5);
    s.blendMode = 'add';
    s.rotation = rot;
    s.position.set(x, y);
    s.scale.set(sw / 64, sh / 64);
    worldLayer.addChild(s);
    return s;
  };
  const mkFlash = (rot, x, y, len, th) => {
    const s = new Pixi.Sprite(TEX.line);
    s.anchor.set(0.5);
    s.blendMode = 'add';
    s.rotation = rot;
    s.position.set(x, y);
    s.scale.set(len / 64, th / 64);
    s.alpha = 0;
    s.tint = 0xbdf6ff;
    worldLayer.addChild(s);
    return s;
  };
  WALL.l = mkEdge(0, 6, world.h / 2, 12, world.h);
  WALL.r = mkEdge(Math.PI, world.w - 6, world.h / 2, 12, world.h);
  WALL.t = mkEdge(Math.PI / 2, world.w / 2, 6, 12, world.w);
  WALL.b = mkEdge(-Math.PI / 2, world.w / 2, world.h - 6, 12, world.w);
  WALL.fl = mkFlash(Math.PI / 2, 4, world.h / 2, world.h, 14);
  WALL.fr = mkFlash(Math.PI / 2, world.w - 4, world.h / 2, world.h, 14);
  WALL.ft = mkFlash(0, world.w / 2, 4, world.w, 14);
  WALL.fb = mkFlash(0, world.w / 2, world.h - 4, world.w, 14);

  for(let i = 0; i < 4; i++){
    const post = new Pixi.Sprite(TEX.post);
    post.anchor.set(0.5);
    post.blendMode = 'add';
    worldLayer.addChild(post);
    const glow = new Pixi.Sprite(TEX.glow);
    glow.anchor.set(0.5);
    glow.blendMode = 'add';
    worldLayer.addChild(glow);
    POSTS.push({ post, glow });
  }

  // 玩家视觉
  const addS = (tex, blend = true) => {
    const s = new Pixi.Sprite(tex);
    s.anchor.set(0.5);
    if(blend) s.blendMode = 'add';
    worldLayer.addChild(s);
    return s;
  };
  PV.trail = [];
  for(let i = 0; i < 14; i++) PV.trail.push(addS(TEX.glow));
  PV.halo = addS(TEX.glow);
  PV.ball = new Pixi.Sprite(TEX.ball);
  PV.ball.anchor.set(0.5);
  worldLayer.addChild(PV.ball);
  // 球体贴合泛光（等价于参考版球体的 shadowBlur 26）
  PV.ballBloom = new Pixi.Sprite(TEX.ball);
  PV.ballBloom.anchor.set(0.5);
  PV.ballBloom.blendMode = 'add';
  worldLayer.addChild(PV.ballBloom);
  PV.reactor = addS(TEX.ring);
  PV.reactor2 = addS(TEX.dashRing);
  PV.aim = addS(TEX.aim);
  PV.aim.anchor.set(0, 0.5);
  PV.aimTip = addS(TEX.chev);
  PV.spin = new Pixi.Sprite(TEX.spin);
  PV.spin.anchor.set(0.5);
  PV.spin.blendMode = 'add';
  worldLayer.addChild(PV.spin);
  PV.charge = addS(TEX.dashRing);
  PV.lines = [addS(TEX.streak), addS(TEX.streak), addS(TEX.streak)];
  PV.reb = [addS(TEX.chev), addS(TEX.chev), addS(TEX.chev)];
  PV.shieldRing = addS(TEX.ring);
  PV.shieldDots = [addS(TEX.dot), addS(TEX.dot), addS(TEX.dot)];
  PV.overRing = addS(TEX.dashRing);
  PV.powRing = addS(TEX.ring);
  PV.shards = [addS(TEX.dot), addS(TEX.dot), addS(TEX.dot)];
  PV.group = [PV.halo, PV.ball, PV.ballBloom, PV.reactor, PV.reactor2, PV.aim, PV.aimTip, PV.spin, PV.charge]
    .concat(PV.trail, PV.reb, [PV.shieldRing], PV.shieldDots, [PV.overRing, PV.powRing], PV.shards, PV.lines);

  buildHUD();
  // 技能文字
  const sz = 46;
  const skCols = [0x5ffbf1, 0x7fb8ff, 0x5affc8, 0xffe45c];
  for(let i = 0; i < 4; i++){
    const t = new Pixi.Text({ text: '', style: { fontFamily: '"Courier New", monospace', fontSize: 14, fontWeight: 'bold', fill: 0xffffff } });
    t.anchor.set(0.5, 0);
    neon(t, skCols[i], 7);
    hudLayer.addChild(t);
    textHUD.skills.push(t);
    const n = new Pixi.Text({ text: '', style: { fontFamily: '"Courier New", monospace', fontSize: 9, fontWeight: 'bold', fill: 0x9fb0c8 } });
    n.anchor.set(0.5, 0);
    hudLayer.addChild(n);
    textHUD.skillsName.push(n);
    const cd = new Pixi.Text({ text: '', style: { fontFamily: '"Courier New", monospace', fontSize: 12, fontWeight: 'bold', fill: 0xffffff } });
    cd.anchor.set(0.5, 0);
    hudLayer.addChild(cd);
    textHUD.skillsCd.push(cd);
  }
  textHUD.container = null;

  for(let i = 0; i < 16; i++){
    const m = new Pixi.Sprite(TEX.chev);
    m.anchor.set(0.5);
    m.blendMode = 'add';
    m.visible = false;
    hudLayer.addChild(m);
    MARKERS.push(m);
  }

  buildScreens();
  layoutScreens();

  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for(const k in keys) keys[k] = false; });
  window.addEventListener('resize', () => {
    W = window.innerWidth; H = window.innerHeight;
    computeWorld();
    makeNebulae();
    makeDust();
    layoutScreens();
    // 边墙重排
    WALL.l.position.set(6, world.h / 2); WALL.l.scale.set(12 / 64, world.h / 64);
    WALL.r.position.set(world.w - 6, world.h / 2); WALL.r.scale.set(12 / 64, world.h / 64);
    WALL.t.position.set(world.w / 2, 6); WALL.t.scale.set(12 / 64, world.w / 64);
    WALL.b.position.set(world.w / 2, world.h - 6); WALL.b.scale.set(12 / 64, world.w / 64);
    WALL.fl.position.set(4, world.h / 2); WALL.fl.scale.set(world.h / 64, 14 / 64);
    WALL.fr.position.set(world.w - 4, world.h / 2); WALL.fr.scale.set(world.h / 64, 14 / 64);
    WALL.ft.position.set(world.w / 2, 4); WALL.ft.scale.set(world.w / 64, 14 / 64);
    WALL.fb.position.set(world.w / 2, world.h - 4); WALL.fb.scale.set(world.w / 64, 14 / 64);
    if(state.mode === 'cards') buildCardUI();
  });
  app.stage.eventMode = 'static';
  app.stage.hitArea = new Pixi.Rectangle(0, 0, W, H);
  app.stage.on('pointertap', () => {
    if(state.mode === 'title'){ audioInit(); startGame(); }
    else if(state.mode === 'dead'){ audioInit(); startGame(); }
  });

  player.x = world.w / 2;
  player.y = world.h / 2;
  makePillars();
  makeNebulae();
  makeDust();
  cam.x = clamp(player.x - W / 2, 0, Math.max(0, world.w - W));
  cam.y = clamp(player.y - H / 2, 0, Math.max(0, world.h - H));

  lastT = performance.now();
  app.ticker.add(frame);
}

try { main(); } catch(e){ console.error(e); }
</script>
