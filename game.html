  cam.x = clamp(player.x - W / 2, 0, Math.max(0, world.w - W));
  cam.y = clamp(player.y - H / 2, 0, Math.max(0, world.h - H));
}

// ---------------- 技能 ----------------
function tryDash(){
  const p = player;
  if(p.dashCd > 0) return;
  let dx = p.moveDir.x, dy = p.moveDir.y;
  if(!dx && !dy){ dx = Math.cos(p.angle); dy = Math.sin(p.angle); }
  const l = Math.hypot(dx, dy) || 1;
  dx /= l; dy /= l;
  p.vx = dx * CFG.dashSpeed; p.vy = dy * CFG.dashSpeed;
  p.dashTime = CFG.dashTime;
  p.dashCd = CFG.dashCd * M.dashCd;
  p.invuln = Math.max(p.invuln, CFG.dashTime + 0.12 + M.dashInv);
  if(M.dashEnergy > 0) p.energy = Math.min(p.maxEnergy, p.energy + M.dashEnergy);
  if(M.dashBurstN){
    // (保留位：无卡使用)
  }
  state.shake = Math.max(state.shake, 7);
  SFX.dash();
  spawnParticles(p.x, p.y, 20, 0x5ffbf1, 340, 0.45, 3.2);
  spawnRing(p.x, p.y, 0x5ffbf1, 70, 0.35, 3);
}

function tryHeal(){
  const p = player;
  if(p.healCd > 0 || p.energy < 30 || p.hp >= p.maxHp) return;
  p.energy -= 30;
  p.healCd = 3.5;
  const amt = 26 * M.heal;
  p.hp = Math.min(p.maxHp, p.hp + amt);
  addFloat(p.x, p.y - 26, '+' + Math.round(amt), 0x5affc8, 18);
  spawnParticles(p.x, p.y, 22, 0x5affc8, 180, 0.7, 3);
  spawnPlus(p.x, p.y, 0x5affc8);
  spawnRing(p.x, p.y, 0x5affc8, 90, 0.5, 3);
  SFX.heal();
}

function tryOverload(){
  const p = player;
  const cost = CFG.overloadCost * M.overCost;
  if(p.overload > 0 || p.energy < cost) return;
  p.energy -= cost;
  p.overload = CFG.overloadTime * M.overTime;
  state.shake = Math.max(state.shake, 15);
  state.flash = 0.5;
  spawnParticles(p.x, p.y, 46, 0xffe45c, 480, 0.8, 3.5);
  spawnSparks(p.x, p.y, 10, 0xffe45c, 2);
  spawnShards(p.x, p.y, 10, 0xffe45c, 1.4);
  SFX.overload();
  addFloat(p.x, p.y - 30, 'OVERLOAD!', 0xffe45c, 20);
}

// ---------------- 等级 / 经验 / 卡牌 ----------------
function xpNeed(l){ return Math.round(34 + 22 * l + l * l * 1.6); }

function gainXp(v){
  v = v * M.xp;
  state.xp += v;
  let leveled = false;
  while(state.xp >= state.xpNeed){
    state.xp -= state.xpNeed;
    state.level++;
    state.xpNeed = xpNeed(state.level);
    state.pending++;
    leveled = true;
  }
  if(leveled && state.mode === 'playing') openCards();
}

function rollTier(){
  const L = state.level;
  const w = [
    Math.max(6, 46 - L * 3.2),
    30,
    Math.min(34, 13 + L * 1.5),
    Math.min(18, 3.5 + L * 1.1),
    Math.min(11, 0.8 + L * 0.75)
  ];
  const tot = w[0] + w[1] + w[2] + w[3] + w[4];
  let r = Math.random() * tot;
  for(let i = 0; i < 5; i++){ r -= w[i]; if(r <= 0) return i; }
  return 0;
}

function rollOffer(){
  const seen = {};
  const out = [];
  let guard = 0;
  while(out.length < 3 && guard < 300){
    guard++;
    const i = Math.floor(Math.random() * CARD_DEFS.length);
    if(seen[i]) continue;
    seen[i] = 1;
    out.push({ def: CARD_DEFS[i], tier: rollTier() });
  }
  return out;
}

function refreshDerived(){
  const oldMax = player.maxHp;
  player.maxHp = Math.round(Math.max(40, 100 * M.hpMul) + M.hpAdd);
  if(player.maxHp > oldMax) player.hp += player.maxHp - oldMax;
  player.hp = clamp(player.hp, 1, player.maxHp);
  player.maxEnergy = Math.round(100 + M.enMax);
  player.energy = Math.min(player.energy, player.maxEnergy);
}

function openCards(){
  if(state.mode === 'dead') return;
  state.offer = rollOffer();
  state.mode = 'cards';
  buildCardUI();
  SFX.levelup();
}

function pickOffer(i){
  if(state.mode !== 'cards') return;
  const o = state.offer[i];
  if(!o) return;
  o.def.a(M, o.def.v[o.tier]);
  state.cards.push({ n: o.def.n, t: o.tier, c: o.def.c });
  refreshDerived();
  SFX.card();
  addFloat(player.x, player.y - 40, o.def.n, o.def.c, 18);
  spawnRing(player.x, player.y, o.def.c, 150, 0.5, 4);
  spawnParticles(player.x, player.y, 24, o.def.c, 300, 0.6, 3);
  state.pending--;
  if(state.pending > 0){
    state.offer = rollOffer();
    buildCardUI();
  } else {
    state.mode = 'playing';
    clearCardUI();
  }
}

// ---------------- 拾取物 ----------------
function spawnPickup(x, y, kind){
  const glow = POOL.pkGlow.get(), core = POOL.pkCore.get(), dot = POOL.pkDot.get(), tether = POOL.tether.get();
  if(!glow || !core || !dot){ rel(glow); rel(core); rel(dot); rel(tether); return; }
  const u = {
    x, y, vx: rand(-140, 140), vy: rand(-140, 140), kind,
    life: 13 + M.pickLife, maxLife: 13 + M.pickLife,
    phase: Math.random() * TAU, sprites: [glow, core, dot, tether]
  };
  if(kind === 'power') u.pw = POWER_TYPES[Math.floor(Math.random() * POWER_TYPES.length)];
  pickups.push(u);
  if(pickups.length > 36){
    const drop = pickups.shift();
    for(const s of drop.sprites) rel(s);
  }
}

function dropLoot(e){
  const dm = Math.min(3, M.drop);
  if(e.type === 'boss'){
    for(let i = 0; i < 6; i++) spawnPickup(e.x + rand(-34, 34), e.y + rand(-34, 34), 'energy');
    spawnPickup(e.x, e.y, 'heal');
    spawnPickup(e.x + 22, e.y - 10, 'power');
    spawnPickup(e.x - 22, e.y + 12, 'shield');
    return;
  }
  if(e.type === 'mini'){
    if(Math.random() < 0.16 * dm) spawnPickup(e.x, e.y, 'energy');
    return;
  }
  const r = Math.random();
  if(r < 0.28 * dm) spawnPickup(e.x, e.y, 'energy');
  else if(r < 0.38 * dm) spawnPickup(e.x, e.y, 'power');
  else if(r < 0.44 * dm) spawnPickup(e.x, e.y, 'heal');
  else if(r < 0.47 * dm) spawnPickup(e.x, e.y, 'shield');
}

function collectPickup(u){
  const p = player;
  if(u.kind === 'energy'){
    const amt = 14 * M.pickE;
    p.energy = Math.min(p.maxEnergy, p.energy + amt);
    addFloat(u.x, u.y - 10, '+' + Math.round(amt), 0x5ffbf1, 13);
    spawnParticles(u.x, u.y, 6, 0x5ffbf1, 160, 0.35, 2.2);
    SFX.pickup();
  } else if(u.kind === 'heal'){
    const amt = 12 * M.pickE;
    p.hp = Math.min(p.maxHp, p.hp + amt);
    addFloat(u.x, u.y - 10, '+' + Math.round(amt) + ' HP', 0x5affc8, 15);
    spawnParticles(u.x, u.y, 8, 0x5affc8, 180, 0.4, 2.4);
    spawnPlus(u.x, u.y, 0x5affc8);
    SFX.heal();
  } else if(u.kind === 'shield'){
    p.shield = Math.min(M.shieldCap, p.shield + 1);
    addFloat(u.x, u.y - 10, '护盾', 0x7fb8ff, 15);
    spawnParticles(u.x, u.y, 10, 0x7fb8ff, 200, 0.45, 2.6);
    spawnRing(u.x, u.y, 0x7fb8ff, 60, 0.4, 3);
    SFX.shieldUp();
  } else {
    const info = POWER_INFO[u.pw];
    p.powerType = u.pw;
    p.powerMax = 9;
    p.power = p.powerMax;
    addFloat(u.x, u.y - 12, info.name, info.color, 17);
    spawnParticles(u.x, u.y, 16, info.color, 240, 0.6, 3);
    spawnRing(u.x, u.y, info.color, 80, 0.55, 3.5);
    SFX.power();
  }
}

function updatePickups(dt){
  const p = player;
  const magnet = 165 * M.magnet;
  for(let i = pickups.length - 1; i >= 0; i--){
    const u = pickups[i];
    u.life -= dt; u.phase += dt * 3;
    if(u.life <= 0){ for(const s of u.sprites) rel(s); pickups.splice(i, 1); continue; }
    const dx = p.x - u.x, dy = p.y - u.y;
    const d = Math.hypot(dx, dy) || 1;
    if(state.mode === 'playing' && d < magnet){
      const pull = (1 - d / magnet) * 1900;
      u.vx += (dx / d) * pull * dt;
      u.vy += (dy / d) * pull * dt;
    }
    u.vx *= Math.exp(-2.2 * dt); u.vy *= Math.exp(-2.2 * dt);
    u.x += u.vx * dt; u.y += u.vy * dt;
    u.x = clamp(u.x, 14, world.w - 14);
    u.y = clamp(u.y, 14, world.h - 14);
    if(state.mode === 'playing' && d < p.r + 20){
      collectPickup(u);
      for(const s of u.sprites) rel(s);
      pickups.splice(i, 1);
    }
  }
}

// ---------------- 敌人 ----------------
const BASE = {
  chaser:   { hp: 34,  r: 15, speed: 122, color: 0xff3d6e, dmg: 12, score: 10 },
  turret:   { hp: 26,  r: 14, speed: 78,  color: 0xb06bff, dmg: 0,  score: 15 },
  tank:     { hp: 115, r: 26, speed: 60,  color: 0xffa73d, dmg: 22, score: 30 },
  splitter: { hp: 62,  r: 21, speed: 96,  color: 0x86ff5e, dmg: 14, score: 22 },
  mini:     { hp: 16,  r: 10, speed: 178, color: 0xc8ff8f, dmg: 8,  score: 8  },
  boss:     { hp: 620, r: 44, speed: 54,  color: 0xff2fd0, dmg: 32, score: 250 }
};
const TEX_OF = { chaser:'pChaser', turret:'pTurret', tank:'pTank', splitter:'pSplitter', mini:'pMini', boss:'pBoss' };

function spawnEnemyAt(type, x, y){
  const b = BASE[type];
  const hpScale = (1 + (state.wave - 1) * 0.17) * M.foeHp;
  const hp = b.hp * hpScale;
  const halo = POOL.enemy.get(), rim = POOL.enemy.get(), body = POOL.enemy.get();
  const darkCore = POOL.enemy.get(), core = POOL.enemy.get();
  const hpBg = POOL.enemy.get(), hpFill = POOL.enemy.get();
  const orbit = POOL.enemy.get(), eye = POOL.enemy.get();
  const portal = POOL.portal.get();
  const bloom = POOL.enemyBloom.get();
  const aura = type === 'boss' ? POOL.bossAura.get() : null;
  if(!halo || !rim || !body || !darkCore || !core || !orbit || !eye){
    rel(halo); rel(rim); rel(body); rel(darkCore); rel(core); rel(hpBg); rel(hpFill); rel(portal); rel(aura); rel(bloom); rel(orbit); rel(eye);
    return;
  }
  enemies.push({
    id: ++idSeq, type, x, y, vx: 0, vy: 0, r: b.r,
    hp, maxHp: hp,
    speed: b.speed * (1 + (state.wave - 1) * 0.02) * M.foeSpd,
    color: b.color, dmg: b.dmg, score: b.score,
    hitFlash: 0, shootCd: rand(1.0, 2.0), wob: Math.random() * TAU,
    kx: 0, ky: 0,
    spawnT: type === 'mini' ? 0.2 : 0.45,
    chargeCd: rand(5, 8), tele: 0, chargeT: 0, dirX: 0, dirY: 0, shotToggle: 0,
    slowT: 0, slowAmt: 0,
    sprites: [halo, rim, body, darkCore, core, hpBg, hpFill, portal, aura, bloom, orbit, eye]
  });
  spawnRing(x, y, b.color, b.r * 3.4, 0.45, 2.5);
}

function spawnEnemy(type){
  const m = 70;
  let x = 0, y = 0;
  for(let k = 0; k < 6; k++){
    const side = Math.floor(Math.random() * 4);
    if(side === 0){ x = rand(m, world.w - m); y = m; }
    else if(side === 1){ x = world.w - m; y = rand(m, world.h - m); }
    else if(side === 2){ x = rand(m, world.w - m); y = world.h - m; }
    else { x = m; y = rand(m, world.h - m); }
    if(Math.hypot(x - player.x, y - player.y) > 450) break;
  }
  spawnEnemyAt(type, x, y);
}

function startWave(n){
  state.wave = n;
  const q = [];
  const count = Math.min(14, Math.round((3 + n * 1.55) * Math.min(1.6, M.spawnMul || 1)));
  for(let i = 0; i < count; i++){
    const r = Math.random();
    let t = 'chaser';
    if(n >= 2 && r < 0.30) t = 'turret';
    else if(n >= 3 && r < 0.44) t = 'tank';
    else if(n >= 4 && r < 0.56) t = 'splitter';
    q.push(t);
  }
  if(n % 5 === 0) q.push('boss');
  state.spawnQueue = q;
  state.spawnTimer = 0.5;
  SFX.wave();
  addFloat(player.x, player.y - 120, 'WAVE ' + n, 0x5ffbf1, 20);
  spawnRing(player.x, player.y, 0x5ffbf1, Math.max(W, H) * 0.7, 0.85, 5);
}

function updateSpawner(dt){
  if(state.spawnQueue.length > 0){
    state.spawnTimer -= dt;
    if(state.spawnTimer <= 0){
      state.spawnTimer = Math.max(0.22, 0.62 - state.wave * 0.02) * M.spawnDelay;
      spawnEnemy(state.spawnQueue.shift());
    }
  } else if(enemies.length === 0){
    if(!state.waveClear){
      state.waveClear = true;
      const bonus = Math.round(50 * state.wave * M.score);
      state.score += bonus;
      if(M.waveShield > 0){
        player.shield = Math.min(M.shieldCap, player.shield + M.waveShield);
      }
      addFloat(player.x, player.y - 70, 'WAVE CLEAR  +' + bonus, 0xffe45c, 18);
      spawnRing(player.x, player.y, 0x5ffbf1, Math.max(W, H) * 0.9, 1.1, 5);
      spawnRing(player.x, player.y, 0xffe45c, Math.max(W, H) * 0.7, 0.9, 3);
      SFX.clear();
      gainXp(14 + state.wave * 2);
      player.energy = Math.min(player.maxEnergy, player.energy + 25);
    }
    state.waveTimer -= dt;
    if(state.waveTimer <= 0){
      state.waveClear = false;
      startWave(state.wave + 1);
      state.waveTimer = 2.6;
    }
  }
}

// ---------------- 伤害 ----------------
function damageEnemy(e, dmg, kx, ky){
  if(e.hp <= 0) return;
  if(M.exec > 0 && e.hp < e.maxHp * 0.35) dmg *= 1 + M.exec;
  e.hp -= dmg;
  e.hitFlash = 0.14;
  e.kx += kx; e.ky += ky;
  if(M.ls > 0 && state.mode === 'playing'){
    player.hp = Math.min(player.maxHp, player.hp + dmg * M.ls);
  }
  addFloat(e.x + rand(-8, 8), e.y - e.r, Math.round(dmg), 0xffe45c, 14);
  spawnParticles(e.x, e.y, 4, e.color, 200, 0.35, 2.6);
  spawnSparks(e.x, e.y, 2, e.color, 0.9);
  SFX.hit();
  if(e.hp <= 0) killEnemy(e);
}

// 范围溅射：先快照再遍历，并做存活校验。
// 直接在 enemies 上倒序下标遍历有隐患——一次波及多杀会让数组缩短，后续 enemies[i] 变 undefined。
function splashDamage(x, y, radius, dmg, kxScale){
  const list = enemies.slice();
  let hits = 0;
  for(const o of list){
    if(!o || o.hp <= 0 || enemies.indexOf(o) < 0) continue;
    const d = Math.hypot(o.x - x, o.y - y);
    if(d < radius + o.r){
      hits++;
      damageEnemy(o, dmg, (o.x - x) / (d || 1) * kxScale, (o.y - y) / (d || 1) * kxScale);
    }
  }
  return hits;
}

function killEnemy(e){
  const idx = enemies.indexOf(e);
  if(idx < 0) return;
  enemies.splice(idx, 1);
  for(const s of e.sprites) rel(s);

  state.combo++;
  state.comboTimer = 3.0 + M.comboKeep;
  if(state.combo > 0 && state.combo % 10 === 0){
    state.novaFlash = Math.max(state.novaFlash, 0.26);
    spawnRing(player.x, player.y, 0xffe45c, 280, 0.5, 4);
    spawnSparks(player.x, player.y, 6, 0xffe45c, 1.4);
  }
  const mult = 1 + state.combo * M.comboScale;
  const gain = Math.round(e.score * mult * M.score);
  state.score += gain;

  if(state.combo % Math.max(4, M.novaEvery) === 0) comboNova(e.x, e.y);

  if(M.killHeal > 0) player.hp = Math.min(player.maxHp, player.hp + M.killHeal);
  gainXp(e.score * 0.5 + 3);

  player.energy = Math.min(player.maxEnergy, player.energy + (e.type === 'boss' ? 45 : 6));
  state.shake = Math.max(state.shake, e.type === 'boss' ? 22 : 6);

  const isBoss = e.type === 'boss';
  spawnParticles(e.x, e.y, isBoss ? 90 : 24, e.color, isBoss ? 620 : 340, 0.85, 3.6);
  spawnRing(e.x, e.y, e.color, isBoss ? 320 : 90, isBoss ? 0.9 : 0.45, isBoss ? 6 : 3);
  spawnShards(e.x, e.y, isBoss ? 22 : 7, e.color, isBoss ? 1.9 : 1);
  spawnSparks(e.x, e.y, isBoss ? 12 : 4, e.color, isBoss ? 2.2 : 1.2);
  addFloat(e.x, e.y - 14, '+' + gain, 0x5ffbf1, isBoss ? 26 : 16);
  SFX.kill();

  // 击杀爆炸（卡片）
  if(M.boomR > 0 && !isBoss){
    spawnRing(e.x, e.y, 0xff9a6a, M.boomR, 0.3, 3);
    splashDamage(e.x, e.y, M.boomR, M.boomD, 200);
  }

  dropLoot(e);

  const chainR = (isBoss ? 180 : 92) * M.chainR;
  const chainDmg = (isBoss ? 60 : 12 + state.wave * 1.2) * M.chainD;
  const chained = splashDamage(e.x, e.y, chainR, chainDmg, 260);
  if(chained > 0){
    spawnRing(e.x, e.y, 0xffb347, chainR, 0.4, 3);
    SFX.chain();
    addFloat(e.x, e.y - e.r - 26, 'CHAIN ×' + chained, 0xffb347, 15);
  }

  if(e.type === 'splitter'){
    const minis = Math.max(0, 2 - 0);
    for(let i = 0; i < minis; i++) spawnEnemyAt('mini', e.x + rand(-20, 20), e.y + rand(-20, 20));
    addFloat(e.x, e.y - e.r - 40, 'SPLIT!', 0x86ff5e, 14);
    SFX.split();
  }

  if(isBoss){ state.flash = 0.6; state.hitStop = 0.12; }
}

function hurtPlayer(dmg, src){
  const p = player;
  if(p.invuln > 0 || state.mode !== 'playing') return;

  if(p.shield > 0){
    p.shield--;
    p.invuln = 0.6;
    addFloat(p.x, p.y - 30, '护盾抵挡', 0x7fb8ff, 16);
    spawnRing(p.x, p.y, 0x7fb8ff, 120, 0.45, 4);
    spawnParticles(p.x, p.y, 18, 0x7fb8ff, 300, 0.5, 2.8);
    SFX.shieldBreak();
    return;
  }

  dmg *= M.dmgTaken;
  if(M.thorns > 0 && src) damageEnemy(src, M.thorns, 0, 0);

  p.hp -= dmg;
  p.invuln = 0.75 + M.invuln;
  p.hitFlash = 0.3;
  p.rebound = 0;
  state.combo = 0; state.comboTimer = 0;
  state.shake = Math.max(state.shake, 14);
  state.flash = 0.35;
  state.hitStop = 0.05;
  spawnParticles(p.x, p.y, 20, 0xff3d6e, 300, 0.6, 3);
  spawnRing(p.x, p.y, 0xff3d6e, 110, 0.45, 3.5);
  spawnShards(p.x, p.y, 9, 0xff3d6e, 1.2);
  spawnSparks(p.x, p.y, 4, 0xff3d6e, 1.3);
  SFX.hurt();

  if(p.hp <= 0){
    if(M.revives - p.reviveUsed > 0){
      p.reviveUsed++;
      p.hp = p.maxHp * 0.5;
      p.invuln = 2.5;
      spawnRing(p.x, p.y, 0xffffff, 380, 1.0, 6);
      spawnParticles(p.x, p.y, 60, 0xffffff, 460, 0.9, 3.6);
      addFloat(p.x, p.y - 40, '不屈复活', 0xffffff, 22);
      state.flash = 0.5;
      return;
    }
    p.hp = 0;
    state.mode = 'dead';
    state.best = Math.max(state.best, state.score);
    state.shake = 26;
    spawnParticles(p.x, p.y, 70, 0x5ffbf1, 520, 1.2, 4);
    spawnRing(p.x, p.y, 0x5ffbf1, 420, 1.2, 6);
    spawnRing(p.x, p.y, 0xff3d6e, 300, 0.9, 4);
    SFX.dead();
  }
}

// ---------------- 风暴 ----------------
function updateStorms(dt){
  state.stormCd -= dt;
  if(state.stormCd <= 0 && storms.length < 2 && state.wave >= 3){
    state.stormCd = rand(7, 12);
    let x = 0, y = 0, guard = 0;
    do{
      x = rand(180, world.w - 180);
      y = rand(180, world.h - 180);
      guard++;
    } while(guard < 20 && Math.hypot(x - player.x, y - player.y) < 300);
    const fill = POOL.storm.get(), ring = POOL.storm.get();
    if(fill && ring) storms.push({ x, y, r: rand(120, 190), phase: 'warn', t: 1.25, sprites: [fill, ring] });
    SFX.stormWarn();
  }
  for(let i = storms.length - 1; i >= 0; i--){
    const s = storms[i];
    s.t -= dt;
    if(s.phase === 'warn' && s.t <= 0){
      s.phase = 'blast';
      s.t = 0.45;
      spawnRing(s.x, s.y, 0xff8c28, s.r * 1.15, 0.5, 5);
      spawnParticles(s.x, s.y, 26, 0xff8c28, 420, 0.6, 3);
      spawnShards(s.x, s.y, 12, 0xff8c28, 1.3);
      state.shake = Math.max(state.shake, 8);
      SFX.stormBlast();
      splashDamage(s.x, s.y, s.r, 30 + state.wave * 2, 420);
      const pd = Math.hypot(player.x - s.x, player.y - s.y);
      if(pd < s.r && !M.stormSafe) hurtPlayer(14);
    } else if(s.phase === 'blast' && s.t <= 0){
      for(const sp of s.sprites) rel(sp);
      storms.splice(i, 1);
    }
  }
}

// ---------------- 玩家 ----------------
function updateAim(){
  let best = null, bd = Infinity;
  for(const e of enemies){
    const d = (e.x - player.x) ** 2 + (e.y - player.y) ** 2;
    if(d < bd){ bd = d; best = e; }
  }
  if(best) player.angle = Math.atan2(best.y - player.y, best.x - player.x);
  else {
    const sp = Math.hypot(player.vx, player.vy);
    if(sp > 60) player.angle = Math.atan2(player.vy, player.vx);
  }
}

function tryFire(){
  const p = player;
  if(p.fireCd > 0 || state.mode !== 'playing') return;

  const over = p.overload > 0;
  const pow = p.power > 0 ? p.powerType : null;
  let rate = CFG.fireRate * M.rate;
  if(pow === 'rapid') rate *= 0.55;
  p.fireCd = Math.max(0.03, rate);

  const a = p.angle;
  const muzzle = p.r + 8;
  let dmg = CFG.bulletDmg * M.dmg * CFG_OVERMUL(over);
  const baseCol = over ? 0xffe45c : (pow ? POWER_INFO[pow].color : 0x5ffbf1);
  p.shotN++;

  const angles = [0];
  if(pow === 'triple') angles.length = 0, angles.push(-0.17, 0, 0.17);
  for(let k = 1; k <= M.extraShots; k++){
    angles.push(0.16 * k, -0.16 * k);
  }

  for(const off of angles){
    const aa = a + off + rand(-0.02, 0.02);
    const big = 1;
    const made = mkBullet({
      x: p.x + Math.cos(aa) * muzzle,
      y: p.y + Math.sin(aa) * muzzle,
      vx: Math.cos(aa) * CFG.bulletSpeed * M.bSpd,
      vy: Math.sin(aa) * CFG.bulletSpeed * M.bSpd,
      r: (over ? 6 : 5) * M.bR * big,
      dmg: (pow === 'pierce' ? dmg * 1.25 : dmg) * big,
      life: 2.2 * M.bLife,
      bounces: 4 + M.bounce,
      col: baseCol,
      pierce: (pow === 'pierce' ? 3 : 0) + M.pierce,
      homing: pow === 'homing' ? 5.5 : M.homing,
      hot: 0, hitIds: []
    });
    if(!made) break;
  }

  p.vx -= Math.cos(a) * (over ? 34 : 52) / Math.max(0.4, Math.sqrt(M.dmg));
  p.vy -= Math.sin(a) * (over ? 34 : 52) / Math.max(0.4, Math.sqrt(M.dmg));

  spawnParticles(p.x + Math.cos(a) * muzzle, p.y + Math.sin(a) * muzzle, 4, baseCol, 160, 0.22, 2.2);
  SFX.shoot();
}
function CFG_OVERMUL(over){ return over ? 2 : 1; }

function addReboundStack(x, y){
  const p = player;
  if(p.rebound >= M.reboundMax){ p.reboundT = 2.5; return; }
  p.rebound++;
  p.reboundT = 2.5;
  spawnRing(x, y, 0xffb347, 40, 0.3, 2);
  addFloat(x, y - 20, '反弹 ×' + p.rebound, 0xffb347, 12);
}

function updatePlayer(dt){
  const p = player;
  p.invuln = Math.max(0, p.invuln - dt);
  p.fireCd = Math.max(0, p.fireCd - dt);
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.healCd = Math.max(0, p.healCd - dt);
  p.overload = Math.max(0, p.overload - dt);
  p.hitFlash = Math.max(0, p.hitFlash - dt);
  p.dashTime = Math.max(0, p.dashTime - dt);
  p.power = Math.max(0, p.power - dt);
  if(p.power <= 0) p.powerType = null;
  p.reboundT = Math.max(0, p.reboundT - dt);
  if(p.reboundT <= 0) p.rebound = 0;

  if(M.idleHeal > 0 && !keys['KeyW'] && !keys['KeyA'] && !keys['KeyS'] && !keys['KeyD']){
    p.hp = Math.min(p.maxHp, p.hp + M.idleHeal * dt);
  }

  const overMul = p.overload > 0 ? M.overRegen : 1;
  p.energy = Math.min(p.maxEnergy, p.energy + 7 * M.enRegen * overMul * dt);

  let ax = 0, ay = 0;
  if(keys['KeyW']) ay -= 1;
  if(keys['KeyS']) ay += 1;
  if(keys['KeyA']) ax -= 1;
  if(keys['KeyD']) ax += 1;
  const l = Math.hypot(ax, ay);
  if(l > 0){ ax /= l; ay /= l; }
  p.moveDir.x = ax; p.moveDir.y = ay;

  if(p.dashTime <= 0){
    const boost = 1 + 0.09 * M.reboundPer * p.rebound;
    const accMul = (p.overload > 0 ? 1.35 : 1) * boost;
    p.vx += ax * CFG.accel * M.acc * accMul * dt;
    p.vy += ay * CFG.accel * M.acc * accMul * dt;
    const damp = Math.exp(-CFG.damp * dt);
    p.vx *= damp; p.vy *= damp;
    const sp = Math.hypot(p.vx, p.vy);
    const maxSp = CFG.maxSpeed * M.spd * (p.overload > 0 ? 1.12 : 1) * boost;
    if(sp > maxSp){ p.vx = p.vx / sp * maxSp; p.vy = p.vy / sp * maxSp; }
  }

  p.x += p.vx * dt;
  p.y += p.vy * dt;

  const r = p.r;
  if(p.x < r){ p.x = r; p.vx = Math.abs(p.vx) * M.wallKeep; wallFeedback('l'); }
  if(p.x > world.w - r){ p.x = world.w - r; p.vx = -Math.abs(p.vx) * M.wallKeep; wallFeedback('r'); }
  if(p.y < r){ p.y = r; p.vy = Math.abs(p.vy) * M.wallKeep; wallFeedback('t'); }
  if(p.y > world.h - r){ p.y = world.h - r; p.vy = -Math.abs(p.vy) * M.wallKeep; wallFeedback('b'); }

  for(const q of pillars){
    const dx = p.x - q.x, dy = p.y - q.y;
    const d = Math.hypot(dx, dy);
    const min = q.r + p.r;
    if(d < min && d > 0.0001){
      const nx = dx / d, ny = dy / d;
      p.x = q.x + nx * min; p.y = q.y + ny * min;
      const dot = p.vx * nx + p.vy * ny;
      if(dot < 0){
        p.vx -= 2 * dot * nx; p.vy -= 2 * dot * ny;
        p.vx *= M.wallKeep; p.vy *= M.wallKeep;
        if(Math.abs(dot) > 90){
          SFX.pillar();
          spawnParticles(p.x, p.y, 5, 0x5ffbf1, 140, 0.3, 2);
          spawnRing(p.x, p.y, 0x5ffbf1, 44, 0.28, 2);
          addReboundStack(p.x, p.y);
        }
      }
    }
  }

  p.trail.push({ x: p.x, y: p.y, a: 1 });
  if(p.trail.length > 14) p.trail.shift();
  for(const t of p.trail) t.a *= 0.9;

  if(p.power > 0){
    const info = POWER_INFO[p.powerType];
    for(let i = 0; i < 3; i++){
      const sa = state.time * 3 + i * TAU / 3;
      const sx = p.x + Math.cos(sa) * 34, sy = p.y + Math.sin(sa) * 34;
      for(let j = ebullets.length - 1; j >= 0; j--){
        const b = ebullets[j];
        if(Math.hypot(b.x - sx, b.y - sy) < 14){
          spawnParticles(b.x, b.y, 6, info.color, 220, 0.35, 2.4);
          freeEBullet(b);
          ebullets.splice(j, 1);
        }
      }
    }
  }

  updateAim();
  if(keys['KeyJ']) tryFire();

  if(p.overloadPrev > 0 && p.overload <= 0 && M.kami) comboNova(p.x, p.y);
  p.overloadPrev = p.overload;
}

function wallFeedback(side){
  const sp = Math.hypot(player.vx, player.vy);
  if(side) wallGlow[side] = Math.min(1, wallGlow[side] + sp / 900);
  if(sp > 120){
    SFX.bounce();
    spawnParticles(player.x, player.y, 4, 0x5ffbf1, 130, 0.28, 2);
    addReboundStack(player.x, player.y);
  }
}

// ---------------- 子弹 ----------------
function updateBullets(dt){
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.life -= dt;

    if(b.homing > 0){
      let tg = null, td = 420 * 420;
      for(const e of enemies){
        const dx = e.x - b.x, dy = e.y - b.y;
        const d = dx * dx + dy * dy;
        if(d < td){ td = d; tg = e; }
      }
      if(tg){
        const sp = Math.hypot(b.vx, b.vy);
        const cur = Math.atan2(b.vy, b.vx);
        let diff = Math.atan2(tg.y - b.y, tg.x - b.x) - cur;
        while(diff > Math.PI) diff -= TAU;
        while(diff < -Math.PI) diff += TAU;
        const na = cur + clamp(diff, -b.homing * dt, b.homing * dt);
        b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
      }
    }

    b.x += b.vx * dt; b.y += b.vy * dt;

    let bounced = false;
    if(b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx); bounced = true; }
    if(b.x > world.w - b.r){ b.x = world.w - b.r; b.vx = -Math.abs(b.vx); bounced = true; }
    if(b.y < b.r){ b.y = b.r; b.vy = Math.abs(b.vy); bounced = true; }
    if(b.y > world.h - b.r){ b.y = world.h - b.r; b.vy = -Math.abs(b.vy); bounced = true; }

    for(const q of pillars){
      const dx = b.x - q.x, dy = b.y - q.y;
      const d = Math.hypot(dx, dy);
      if(d < q.r + b.r && d > 0.0001){
        const nx = dx / d, ny = dy / d;
        b.x = q.x + nx * (q.r + b.r);
        b.y = q.y + ny * (q.r + b.r);
        const dot = b.vx * nx + b.vy * ny;
        b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny;
        bounced = true;
        SFX.pillar();
        spawnRing(b.x, b.y, 0x7fe9ff, 34, 0.25, 2);
      }
    }

    if(bounced){
      b.bounces--;
      b.dmg *= (1.32 + M.bounceDmg);
      b.hot++;
      b.r = Math.min(8.5, b.r + 0.7);
      spawnParticles(b.x, b.y, 3, b.col, 120, 0.25, 2);
      if(b.bounces < 0){ freeBullet(b); bullets.splice(i, 1); continue; }
    }

    let hit = false;
    for(const e of enemies){
      if(b.hitIds.includes(e.id)) continue;
      const d = Math.hypot(b.x - e.x, b.y - e.y);
      if(d < e.r + b.r){
        const nx = (b.x - e.x) / (d || 1);
        const ny = (b.y - e.y) / (d || 1);
        let dmg = b.dmg;
        if(M.crit > 0 && Math.random() < M.crit){
          dmg *= M.critMul;
          addFloat(b.x, b.y - 16, '暴击', 0xff7a3d, 15);
        }
        if(M.slowOnHit > 0){ e.slowT = 0.65; e.slowAmt = Math.max(e.slowAmt, M.slowOnHit); }
        damageEnemy(e, dmg, nx * 150, ny * 150);
        if(M.shrapnel > 0 && Math.random() < M.shrapnel){
          for(let k = 0; k < 2; k++){
            const sa = Math.atan2(b.vy, b.vx) + rand(-1.1, 1.1);
            const made = mkBullet({
              x: b.x, y: b.y,
              vx: Math.cos(sa) * 620, vy: Math.sin(sa) * 620,
              r: 3.4, dmg: dmg * 0.35, life: 0.7, bounces: 0,
              col: 0xffc8a0, pierce: 0, homing: 0, hot: 0, hitIds: [e.id]
            });
            if(!made) break;
          }
        }
        spawnParticles(b.x, b.y, 8, b.col, 220, 0.4, 2.6);
        b.hitIds.push(e.id);
        hit = true;
        break;
      }
    }

    if(hit){
      if(b.pierce > 0) b.pierce--;
      else { freeBullet(b); bullets.splice(i, 1); continue; }
    }
    if(b.life <= 0){ freeBullet(b); bullets.splice(i, 1); }
  }
  if(bullets.length > 260){
    freeBullet(bullets[0]);
    bullets.shift();
  }
}

function updateEBullets(dt){
  for(let i = ebullets.length - 1; i >= 0; i--){
    const b = ebullets[i];
    b.life -= dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if(b.x < b.r || b.x > world.w - b.r) b.vx *= -1;
    if(b.y < b.r || b.y > world.h - b.r) b.vy *= -1;
    b.x = clamp(b.x, b.r, world.w - b.r);
    b.y = clamp(b.y, b.r, world.h - b.r);

    const d = Math.hypot(b.x - player.x, b.y - player.y);
    if(d < player.r + b.r){
      hurtPlayer(b.dmg);
      spawnParticles(b.x, b.y, 10, 0xff3d6e, 220, 0.45, 3);
      freeEBullet(b); ebullets.splice(i, 1);
      continue;
    }
    if(b.life <= 0){ freeEBullet(b); ebullets.splice(i, 1); }
  }
  if(ebullets.length > 240){
    freeEBullet(ebullets[0]);
    ebullets.shift();
  }
}

// ---------------- 敌人更新 ----------------
function updateEnemies(dt){
  for(let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];
    if(!e) continue;   // 数组可能已被连锁/新星缩短
    e.hitFlash = Math.max(0, e.hitFlash - dt);
    e.wob += dt * 3;
    e.spawnT = Math.max(0, e.spawnT - dt);
    e.slowT = Math.max(0, e.slowT - dt);

    let slow = 1;
    if(e.slowT > 0) slow *= 1 - clamp(e.slowAmt, 0, 0.75);
    if(M.aura > 0 && Math.hypot(e.x - player.x, e.y - player.y) < 130) slow *= 1 - M.aura;
    if(e.spawnT > 0) slow *= 0.35;

    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const nx = dx / d, ny = dy / d;

    if(e.type === 'chaser' || e.type === 'mini'){
      e.x += nx * e.speed * slow * dt;
      e.y += ny * e.speed * slow * dt;
    } else if(e.type === 'splitter'){
      e.x += (nx + -ny * Math.sin(e.wob * 0.8) * 0.6) * e.speed * slow * dt;
      e.y += (ny + nx * Math.sin(e.wob * 0.8) * 0.6) * e.speed * slow * dt;
    } else if(e.type === 'turret'){
      const want = 250;
      const dir = d > want ? 1 : -1;
      e.x += nx * e.speed * dir * slow * dt;
      e.y += ny * e.speed * dir * slow * dt;
      e.x += -ny * Math.sin(e.wob) * 30 * slow * dt;
      e.y += nx * Math.sin(e.wob) * 30 * slow * dt;
      e.shootCd -= dt * slow;
      if(e.shootCd <= 0 && d < 700 && e.spawnT <= 0){
        e.shootCd = 1.7;
        const a = Math.atan2(dy, dx) + rand(-0.09, 0.09);
        mkEBullet({ x: e.x + Math.cos(a) * (e.r + 6), y: e.y + Math.sin(a) * (e.r + 6),
          vx: Math.cos(a) * 300, vy: Math.sin(a) * 300, r: 6, dmg: 9, life: 4, color: 0xb06bff });
        tone(300, 0.1, 'sawtooth', 0.07, 180);
      }
    } else if(e.type === 'tank'){
      e.x += nx * e.speed * slow * dt;
      e.y += ny * e.speed * slow * dt;
    } else if(e.type === 'boss'){
      e.chargeCd -= dt * slow;
      if(e.tele > 0){
        e.tele -= dt * slow;
        spawnParticles(e.x, e.y, 2, 0xff2fd0, 120, 0.4, 2.6);
        if(e.tele <= 0){ e.chargeT = 0.75; e.dirX = nx; e.dirY = ny; SFX.charge(); spawnRing(e.x, e.y, 0xff2fd0, 90, 0.3, 4); }
      } else if(e.chargeT > 0){
        e.chargeT -= dt;
        const cs = 950 * slow;
        e.x += e.dirX * cs * dt; e.y += e.dirY * cs * dt;
        spawnParticles(e.x, e.y, 2, 0xff2fd0, 60, 0.3, 2.4);
        state.shake = Math.max(state.shake, 3);
      } else {
        e.x += nx * e.speed * slow * dt;
        e.y += ny * e.speed * slow * dt;
        e.shootCd -= dt * slow;
        if(e.shootCd <= 0 && e.spawnT <= 0){
          e.shootCd = 2.2;
          const base = Math.atan2(dy, dx);
          e.shotToggle = (e.shotToggle + 1) % 2;
          const shots = [];
          if(e.shotToggle === 0){
            for(let k = -2; k <= 2; k++) shots.push([base + k * 0.26, 250, 8, 13, 0xff2fd0]);
          } else {
            for(let k = 0; k < 10; k++) shots.push([e.wob + k * TAU / 10, 210, 7, 11, 0xff6fe0]);
          }
          for(const [a, sp, rr, dm, cc] of shots){
            mkEBullet({ x: e.x + Math.cos(a) * (e.r + 8), y: e.y + Math.sin(a) * (e.r + 8),
              vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rr, dmg: dm, life: 5.5, color: cc });
          }
          tone(220, 0.2, 'sawtooth', 0.12, 90);
        }
        if(e.chargeCd <= 0 && e.spawnT <= 0 && d > 220){
          e.chargeCd = rand(6.5, 9.5);
          e.tele = 0.55;
          spawnRing(e.x, e.y, 0xff2fd0, 120, 0.55, 3);
          addFloat(e.x, e.y - e.r - 20, '!! 冲锋', 0xff2fd0, 14);
        }
      }
    }

    e.x += e.kx * dt; e.y += e.ky * dt;
    e.kx *= Math.exp(-7 * dt); e.ky *= Math.exp(-7 * dt);

    for(const q of pillars){
      const ddx = e.x - q.x, ddy = e.y - q.y;
      const dd = Math.hypot(ddx, ddy);
      const min = q.r + e.r;
      if(dd < min && dd > 0.0001){
        e.x = q.x + ddx / dd * min;
        e.y = q.y + ddy / dd * min;
      }
    }

    e.x = clamp(e.x, e.r, world.w - e.r);
    e.y = clamp(e.y, e.r, world.h - e.r);

    for(const o of enemies){
      if(o === e) continue;
      const ox = e.x - o.x, oy = e.y - o.y;
      const od = Math.hypot(ox, oy);
      const omin = e.r + o.r;
      if(od < omin && od > 0.0001){
        const push = (omin - od) * 0.5;
        e.x += ox / od * push; e.y += oy / od * push;
      }
    }

    const pd = Math.hypot(e.x - player.x, e.y - player.y);
    if(pd < e.r + player.r){
      if(player.dashTime > 0){
        const kx = (e.x - player.x) / (pd || 1);
        const ky = (e.y - player.y) / (pd || 1);
        damageEnemy(e, CFG.dashDmg * M.dashDmg + 6 * player.rebound, kx * 620, ky * 620);
        state.shake = Math.max(state.shake, 10);
        spawnParticles(e.x, e.y, 16, 0x5ffbf1, 340, 0.5, 3);
        spawnRing(e.x, e.y, 0x5ffbf1, 70, 0.35, 3);
        player.vx *= 0.6; player.vy *= 0.6;
      } else {
        hurtPlayer(e.dmg, e);
        const kx = (player.x - e.x) / (pd || 1);
        const ky = (player.y - e.y) / (pd || 1);
        player.vx += kx * 380; player.vy += ky * 380;
        e.kx -= kx * 200; e.ky -= ky * 200;
      }
    }
  }
}

// ---------------- 环 / 粒子 ----------------
function updateRings(dt){
  for(let i = rings.length - 1; i >= 0; i--){
    const r = rings[i];
    r.life -= dt;
    if(r.life <= 0){ rel(r.s); rings.splice(i, 1); continue; }
    const t = 1 - r.life / r.maxLife;
    r.r = r.maxR * (1 - Math.pow(1 - t, 3));
  }
}

function updateParticles(dt){
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life <= 0){ rel(p.spr); particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.exp(-2.4 * dt); p.vy *= Math.exp(-2.4 * dt);
  }
  for(let i = floats.length - 1; i >= 0; i--){
    const f = floats[i];
    f.life -= dt;
    f.y += f.vy * dt;
    f.vy *= Math.exp(-2 * dt);
    if(f.life <= 0){ rel(f.t); floats.splice(i, 1); }
  }
  for(let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i];
    s.life -= dt;
    if(s.life <= 0){ rel(s.spr); sparks.splice(i, 1); continue; }
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.vx *= Math.exp(-6 * dt); s.vy *= Math.exp(-6 * dt);
  }
  for(let i = shards.length - 1; i >= 0; i--){
    const s = shards[i];
    s.life -= dt;
    if(s.life <= 0){ rel(s.spr); shards.splice(i, 1); continue; }
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.vx *= Math.exp(-2.2 * dt); s.vy *= Math.exp(-2.2 * dt);
    s.rot += s.vrot * dt;
  }
  for(let i = pluses.length - 1; i >= 0; i--){
    const s = pluses[i];
    s.life -= dt;
    if(s.life <= 0){ rel(s.spr); pluses.splice(i, 1); continue; }
    s.y += s.vy * dt;
    s.vy *= Math.exp(-1.6 * dt);
  }
}

// ---------------- 主更新 ----------------
function update(dt){
  updateBackground(dt);
  updateMeteors(dt);
  updateRings(dt);

  state.time += dt;
  state.shake *= Math.exp(-7 * dt);
  state.flash = Math.max(0, state.flash - dt * 2.2);
  state.novaFlash = Math.max(0, state.novaFlash - dt * 2.4);
  state.hitStop = Math.max(0, state.hitStop - dt);

  if(state.comboTimer > 0){
    state.comboTimer -= dt;
    if(state.comboTimer <= 0) state.combo = 0;
  }

  if(state.mode === 'playing'){
    updatePlayer(dt);
    updateBullets(dt);
    updateEnemies(dt);
    updateEBullets(dt);
    updatePickups(dt);
    updateSpawner(dt);
    updateStorms(dt);
  }
  updateParticles(dt);
  if(state.mode !== 'cards') updateCamera(dt);
}

// ---------------- 视觉同步（Pixi） ----------------
function syncBackground(){
  bgLayer.x = -cam.x * 0.10;
  bgLayer.y = -cam.y * 0.10;
  dustLayer.x = -cam.x * 0.18;
  dustLayer.y = -cam.y * 0.18;

  for(const n of nebulae){
    const pulse = 0.75 + 0.25 * Math.sin(n.phase);
    const s = n.spr;
    s.position.set(n.x, n.y);
    s.scale.set(n.r * 2 / 128);
    s.tint = n.color;
    s.alpha = n.a * pulse;
  }
  for(const d of dust){
    const tw = 0.5 + 0.5 * Math.sin(d.phase);
    const s = d.spr;
    s.position.set(d.x, d.y);
    s.scale.set(d.r * 2 / 64);
    s.tint = 0x9fe8ff;
    s.alpha = d.a * (0.35 + tw * 0.65);
  }
  for(const m of meteors){
    const s = m.spr;
    const sp = Math.hypot(m.vx, m.vy) || 1;
    s.position.set(m.x, m.y);
    s.rotation = Math.atan2(m.vy, m.vx);
    s.scale.set(90 / 64, 3);
    s.tint = 0xcaf3ff;
    s.alpha = clamp(m.life / m.maxLife, 0, 1) * 0.5;
  }
}

function syncWalls(){
  const pulse = 0.25 + 0.12 * Math.sin(state.time * 2.2);
  const sides = [
    { s: WALL.l, g: wallGlow.l }, { s: WALL.r, g: wallGlow.r },
    { s: WALL.t, g: wallGlow.t }, { s: WALL.b, g: wallGlow.b }
  ];
  for(const it of sides){
    it.s.alpha = clamp(pulse + it.g * 0.75, 0, 1) * 0.55;
    it.s.tint = 0x5af0ff;
  }
  WALL.fl.alpha = wallGlow.l * 0.9; WALL.fr.alpha = wallGlow.r * 0.9;
  WALL.ft.alpha = wallGlow.t * 0.9; WALL.fb.alpha = wallGlow.b * 0.9;

  const t = state.time, cs = 22;
  const corners = [[0, 0], [world.w, 0], [0, world.h], [world.w, world.h]];
  for(let i = 0; i < 4; i++){
    const p = POSTS[i];
    p.post.position.set(corners[i][0], corners[i][1]);
    p.post.rotation = t * (i % 2 ? 0.5 : -0.5);
    p.post.scale.set(1.2);
    p.post.tint = 0x5ffbf1;
    p.post.alpha = 0.6;
    p.glow.position.set(corners[i][0], corners[i][1]);
    p.glow.scale.set(0.5);
    p.glow.tint = 0x5ffbf1;
    p.glow.alpha = 0.25 + 0.12 * Math.sin(t * 3 + i);
  }
}

function syncPillars(){
  for(const q of pillars){
    const pulse = 0.5 + 0.5 * Math.sin(state.time * 2 + q.phase);
    const [halo, ring, ring2, d1, d2, inner] = q.sprites;
    halo.texture = TEX.glow;
    ring.texture = TEX.ring;
    ring2.texture = TEX.ring;
    d1.texture = TEX.dot;
    d2.texture = TEX.dot;
    halo.position.set(q.x, q.y); halo.scale.set(q.r * 5.6 / 128); halo.tint = 0x5ac8ff; halo.alpha = 0.24 + pulse * 0.14;
    ring.position.set(q.x, q.y); ring.scale.set(q.r * 2.3 / 128); ring.tint = 0x78e6ff; ring.alpha = 0.6 + pulse * 0.3;
    ring2.position.set(q.x, q.y); ring2.scale.set(q.r * 1.25 / 128); ring2.tint = 0x78e6ff; ring2.alpha = 0.28;
    const ra = q.ringA + state.time * q.spin;
    d1.position.set(q.x + Math.cos(ra) * (q.r + 9), q.y + Math.sin(ra) * (q.r + 9));
    d1.scale.set(5.2 / 64); d1.tint = 0x8ff6ff; d1.alpha = 0.5 + pulse * 0.35;
    const rb = ra + Math.PI;
    d2.position.set(q.x + Math.cos(rb) * (q.r + 9), q.y + Math.sin(rb) * (q.r + 9));
    d2.scale.set(4 / 64); d2.tint = 0x8ff6ff; d2.alpha = 0.4;
    inner.position.set(q.x, q.y);
    inner.rotation = state.time * 0.35 + q.phase;
    inner.scale.set(q.r * 0.9 / 96);
    inner.tint = 0xa8f0ff;
    inner.alpha = 0.18 + pulse * 0.16;
    inner.texture = TEX['p' + ['Mini','Tank','Turret'][q.shape % 3]];
  }
}

function syncStorms(){
  for(const s of storms){
    const [fill, ring] = s.sprites;
    if(s.phase === 'warn'){
      const k = 1 - s.t / 1.25;
      fill.texture = TEX.glow;
      fill.position.set(s.x, s.y);
      fill.scale.set(s.r * 2 * Math.max(0.05, k) / 128);
      fill.tint = 0xff8c28;
      fill.alpha = 0.30 + k * 0.22;
      ring.position.set(s.x, s.y);
      ring.rotation += 0.03;
      ring.scale.set(s.r * 2.2 / 128);
      ring.tint = 0xff8c28;
      ring.alpha = 0.5 + 0.4 * Math.sin(state.time * 10);
      ring.texture = TEX.dashRing;
    } else {
      fill.position.set(s.x, s.y);
      fill.scale.set(s.r * 2.2 / 128);
      fill.tint = 0xffb45a;
      fill.alpha = clamp(s.t / 0.45, 0, 1) * 0.5;
      fill.texture = TEX.glow;
      ring.visible = false;
    }
  }
}

function syncPickups(){
  for(const u of pickups){
    const [glow, core, dot, tether] = u.sprites;
    const fade = u.life > 2 ? 1 : (0.35 + 0.65 * (u.life / 2));
    const pulse = 0.7 + 0.3 * Math.sin(u.phase * 2);
    let cc = 0x5ffbf1;
    if(u.kind === 'heal') cc = 0x5affc8;
    else if(u.kind === 'shield') cc = 0x7fb8ff;
    else if(u.kind === 'power') cc = POWER_INFO[u.pw].color;
    // 外光（半径 34）
    glow.position.set(u.x, u.y);
    glow.scale.set(68 / 128);
    glow.tint = cc;
    glow.alpha = 0.5 * fade * pulse;
    // 图标（原版尺寸：7~10px 半径）
    const texR = u.kind === 'heal' ? 16 : u.kind === 'energy' ? 19 : 18;
    const wantR = u.kind === 'energy' ? 7 * pulse : u.kind === 'power' ? 10 * pulse : u.kind === 'heal' ? 8 : 9 * pulse;
    core.position.set(u.x, u.y);
    core.rotation = u.phase * 0.6;
    core.scale.set(wantR / texR);
    core.tint = cc;
    core.alpha = fade;
    core.texture = u.kind === 'heal' ? TEX.kHeal : u.kind === 'shield' ? TEX.kShield : u.kind === 'power' ? TEX.kPower : TEX.kEnergy;
    // 中心白点
    dot.position.set(u.x, u.y);
    dot.scale.set(5.6 / 64);
    dot.tint = 0xffffff;
    dot.alpha = fade;

    // 磁吸牵引线（进入吸附范围才显示）
    if(tether){
      const mr = 165 * M.magnet;
      const pd = Math.hypot(player.x - u.x, player.y - u.y);
      const inRange = state.mode === 'playing' && pd < mr && pd > 28;
      tether.visible = inRange;
      if(inRange){
        const k = 1 - pd / mr;
        tether.texture = TEX.tether;
        tether.anchor.set(0, 0.5);
        tether.position.set(u.x, u.y);
        tether.rotation = Math.atan2(player.y - u.y, player.x - u.x);
        tether.scale.set(pd * 0.9 / 64, 3.4 / 64);
        tether.tint = cc;
        tether.alpha = 0.16 + k * 0.44;
      }
    }
  }
}

function syncEnemies(){
  for(const e of enemies){
    const [halo, rim, body, darkCore, core, hpBg, hpFill] = e.sprites;
    const spawnK = e.spawnT > 0 ? (1 - e.spawnT / 0.45) : 1;
    const flash = e.hitFlash > 0;
    const sr = e.r * (0.55 + spawnK * 0.45);
    const rot = e.type === 'turret' ? state.time * 0.8
      : e.type === 'mini' ? state.time * 2 + e.wob
      : e.type === 'splitter' ? -state.time * 1.1
      : (e.type === 'tank' || e.type === 'boss') ? state.time * 0.5 : 0;

    // 混合模式：实色层必须走普通混合（参考版是 source-over 实色多边形 + 2px 白描边 +
    // 不透明暗核）；只有外光/亮核/传送门/光环用叠加。全部走 add 会让白边与本体相加烧成白色。
    halo.blendMode = 'add';
    rim.blendMode = 'normal';
    body.blendMode = 'normal';
    darkCore.blendMode = 'normal';
    core.blendMode = 'add';
    if(hpBg) hpBg.blendMode = 'normal';
    if(hpFill) hpFill.blendMode = 'normal';

    // 外光（参考版：半径 3r 的同色辉光）
    halo.position.set(e.x, e.y);
    halo.scale.set(e.r * 6 / 128);
    halo.tint = e.color;
    halo.alpha = 0.35;

    // 本体填充透明度（参考版：0.35 + spawnK * 0.65）
    const bodyA = 0.35 + spawnK * 0.65;
    const slowed = e.slowT > 0;
    const mainTint = flash ? 0xffffff : (slowed ? 0x9fd8ff : e.color);

    // 本体贴合泛光（等价于参考版多边形的 shadowBlur 20：沿轮廓外扩的同色光）
    const bloom = e.sprites[9];
    if(bloom){
      bloom.texture = TEX[TEX_OF[e.type]];
      bloom.rotation = rot;
      bloom.position.set(e.x, e.y);
      bloom.scale.set(sr * 1.34 / 42);
      bloom.tint = flash ? 0xffffff : (slowed ? 0x9fd8ff : e.color);
      bloom.alpha = 0.34;
      bloom.blendMode = 'add';
    }

    // 白色描边：比本体大 9%，垫在下面即为参考版那圈 2px 白边
    rim.position.set(e.x, e.y);
    rim.texture = TEX[TEX_OF[e.type]];
    rim.rotation = rot;
    rim.scale.set(sr * 1.09 / 42);
    rim.tint = 0xffffff;
    rim.alpha = bodyA * 0.85;

    // 本体：实色多边形（填充 0.85，顶点半径 = scaledR）
    body.position.set(e.x, e.y);
    body.texture = TEX[TEX_OF[e.type]];
    body.rotation = rot;
    body.scale.set(sr / 42);
    body.tint = mainTint;
    body.alpha = bodyA * 0.85;

    // 暗核：#0a0c14 实心圆，半径 0.42R（参考版为不透明）
    darkCore.texture = TEX.darkCore;
    darkCore.position.set(e.x, e.y);
    darkCore.scale.set(sr * 0.84 / 64);
    darkCore.tint = 0x0a0c14;
    darkCore.alpha = 1;

    // 脉动亮核：半径 0.2R，alpha 0.6 + 0.4·sin(t·6 + wob)
    core.texture = TEX.dot;
    core.position.set(e.x, e.y);
    core.scale.set(sr * 0.4 / 64);
    core.tint = mainTint;
    core.alpha = 0.6 + 0.4 * Math.sin(state.time * 6 + e.wob);

    // 入场传送门（spawnT 期间收缩）
    const portal = e.sprites[7];
    if(portal){
      if(e.spawnT > 0){
        const k = clamp(e.spawnT / 0.45, 0, 1);
        portal.texture = TEX.portal;
        portal.visible = true;
        portal.position.set(e.x, e.y);
        portal.rotation = state.time * 2.2;
        portal.scale.set((e.r * 4.6 * k + e.r * 1.6) / 128);
        portal.tint = e.color;
        portal.alpha = 0.2 + 0.8 * k;
      } else {
        portal.visible = false;
      }
    }

    // BOSS 光环
    const aura = e.sprites[8];
    if(aura){
      aura.texture = TEX.dashRing;
      aura.position.set(e.x, e.y);
      aura.rotation = state.time * 1.5;
      aura.scale.set(e.r * 4.6 / 128);
      aura.tint = e.color;
      aura.alpha = 0.32 + 0.24 * Math.sin(state.time * 4);
    }

    // 轨道细环（环绕本体的发丝环，BOSS 更大）
    const orbit = e.sprites[10];
    if(orbit){
      const oR = e.type === 'boss' ? sr * 1.7 : sr * 1.45;
      orbit.texture = TEX.ring;
      orbit.blendMode = 'add';
      orbit.visible = e.spawnT <= 0.2;
      orbit.position.set(e.x, e.y);
      orbit.rotation = state.time * 0.7 + e.wob;
      orbit.scale.set(oR / 57.6);
      orbit.tint = flash ? 0xffffff : e.color;
      orbit.alpha = (e.type === 'boss' ? 0.4 : 0.22) * bodyA;
    }
    // 指向玩家的眼珠（本体边缘小三角，读出敌意方向）
    const eye = e.sprites[11];
    if(eye){
      const aa = Math.atan2(player.y - e.y, player.x - e.x);
      eye.texture = TEX.chev;
      eye.blendMode = 'add';
      eye.visible = e.type !== 'mini' && e.spawnT <= 0;
      eye.position.set(e.x + Math.cos(aa) * sr * 0.72, e.y + Math.sin(aa) * sr * 0.72);
      eye.rotation = aa + Math.PI / 2;
      eye.scale.set((e.type === 'boss' ? 0.5 : 0.3) * (sr / e.r));
      eye.tint = flash ? 0xffffff : mainTint;
      eye.alpha = 0.55 * bodyA;
    }

    if(hpBg && hpFill){
      if(e.hp < e.maxHp){
        const w = e.type === 'boss' ? e.r * 3.2 : e.r * 2.4;
        const h = e.type === 'boss' ? 5 : 3;
        hpBg.texture = TEX.bar;
        hpBg.visible = true;
        hpBg.anchor.set(0, 0.5);
        hpBg.position.set(e.x - w / 2, e.y - e.r - 12);
        hpBg.scale.set(w / 32, h / 32);
        hpBg.tint = 0x000000;
        hpBg.alpha = 0.55;
        hpFill.texture = TEX.bar;
        hpFill.visible = true;
        hpFill.anchor.set(0, 0.5);
        hpFill.position.set(e.x - w / 2, e.y - e.r - 12);
        hpFill.scale.set(w / 32 * clamp(e.hp / e.maxHp, 0, 1), h / 32);
        hpFill.tint = e.color;
        hpFill.alpha = 1;
      } else {
        hpBg.visible = false;
        hpFill.visible = false;
      }
    }
  }
}

function syncBullets(){
  for(const b of bullets){
    const sp = Math.hypot(b.vx, b.vy) || 1;
    const ang = Math.atan2(b.vy, b.vx);
    const tl = Math.max(10, 0.022 * sp);
    // 拖尾（参考版：lineWidth = r*0.9，圆头，长 0.022×速度）
    const t = b.spr3;
    t.position.set(b.x - (b.vx / sp) * tl * 0.5, b.y - (b.vy / sp) * tl * 0.5);
    t.rotation = ang;
    t.scale.set(tl / 64, (b.r * 0.96) / 16);
    t.tint = b.col;
    t.alpha = 0.55;
    // 外光（参考版：半径 4r，中心 0.7 透明度）
    const g = b.spr;
    g.position.set(b.x, b.y);
    g.scale.set(b.r * 8 / 128);
    g.tint = b.col;
    g.alpha = 0.7;
    // 贴芯光晕（替代参考版的 shadowBlur 16）
    const hl = b.spr4;
    hl.texture = TEX.halo;
    hl.position.set(b.x, b.y);
    hl.scale.set(b.r * 4.8 / 64);
    hl.tint = b.col;
    hl.alpha = 0.8;
    // 白芯（实心圆，半径精确 = r）
    const c = b.spr2;
    c.position.set(b.x, b.y);
    c.texture = TEX.core;
    c.scale.set(b.r / 31);
    c.tint = 0xffffff;
    c.alpha = 1;
  }
  for(const b of ebullets){
    // 外光
    const g = b.spr;
    g.position.set(b.x, b.y);
    g.scale.set(b.r * 8 / 128);
    g.tint = b.color;
    g.alpha = 0.6;
    // 彩色环
    const r2 = b.spr2;
    r2.position.set(b.x, b.y);
    r2.texture = TEX.orb;
    r2.scale.set(b.r * 2.7 / 64);
    r2.tint = b.color;
    r2.alpha = 1;
    // 白点
    const c = b.spr3;
    c.position.set(b.x, b.y);
    c.texture = TEX.core;
    c.scale.set(b.r * 0.85 / 64);
    c.tint = 0xffffff;
    c.alpha = 1;
  }
}

function syncSparks(){
  for(const s of sparks){
    const a = clamp(s.life / s.maxLife, 0, 1);
    const o = s.spr;
    o.position.set(s.x, s.y);
    o.rotation = s.rot + state.time * 0.7;
    o.scale.set(s.size * (0.55 + a * 0.85) / 64);
    o.tint = s.col;
    o.alpha = a;
  }
  for(const s of shards){
    const a = clamp(s.life / s.maxLife, 0, 1);
    const o = s.spr;
    o.position.set(s.x, s.y);
    o.rotation = s.rot;
    o.scale.set(s.size * (0.7 + a * 0.5) / 48);
    o.tint = s.col;
    o.alpha = a * 0.95;
  }
  for(const s of pluses){
    const a = clamp(s.life / s.maxLife, 0, 1);
    const o = s.spr;
    o.position.set(s.x, s.y);
    o.rotation = s.rot;
    o.scale.set(s.size / 14);
    o.tint = s.col;
    o.alpha = a * (0.4 + 0.6 * (1 - a));
  }
}

function syncRings(){
  for(const r of rings){
    const a = clamp(r.life / r.maxLife, 0, 1);
    const s = r.s;
    s.position.set(r.x, r.y);
    s.texture = TEX.ring;
    s.scale.set(r.r * 2.3 / 128);
    s.tint = r.color;
    s.alpha = a * 0.9;
  }
}

function syncParticles(){
  for(const p of particles){
    const a = clamp(p.life / p.maxLife, 0, 1);
    const s = p.spr;
    s.position.set(p.x, p.y);
    s.scale.set(p.size * a * 2 / 128);
    s.tint = p.color;
    s.alpha = a;
  }
  for(const f of floats){
    const a = clamp(f.life / f.maxLife, 0, 1);
    const pop = 1 + (1 - a) * 0.3;
    f.t.position.set(f.x, f.y);
    f.t.scale.set(pop);
    f.t.alpha = a;
  }
}

// 玩家长相
const PV = {};
function updatePlayerVisual(){
  const p = player;
  const powCol = p.power > 0 ? POWER_INFO[p.powerType].color : null;
  const mainCol = p.overload > 0 ? 0xffe45c : (powCol || 0x5ffbf1);
  const blinkA = p.invuln > 0 ? (0.62 + 0.38 * Math.sin(state.time * 24)) : 1;

  const alive = state.mode !== 'dead';
  PV.group.forEach(s => { s.visible = alive && (s.userData === undefined || true); });

  // 拖尾（冲刺时偶数节点变为残影球体）
  const dashing = p.dashTime > 0;
  for(let i = 0; i < PV.trail.length; i++){
    const s = PV.trail[i];
    const t = p.trail[i];
    if(!t){ s.visible = false; continue; }
    const k = (i + 1) / PV.trail.length;
    s.visible = alive;
    s.position.set(t.x, t.y);
    s.tint = mainCol;
    if(dashing && i % 2 === 0){
      s.texture = TEX.ball;
      s.scale.set(p.r * k * 1.4 / 30);
      s.alpha = 0.3 * k * blinkA;
    } else {
      s.texture = TEX.glow;
      s.scale.set(p.r * k * 1.7 / 128);
      s.alpha = k * 0.32 * t.a * blinkA;
    }
  }
  PV.halo.visible = alive;
  PV.halo.position.set(p.x, p.y);
  PV.halo.scale.set(p.r * 11 / 128);
  PV.halo.tint = mainCol;
  PV.halo.alpha = 0.55 * blinkA;

  PV.ball.visible = alive;
  PV.ball.position.set(p.x, p.y);
  PV.ball.scale.set(p.r / 30);
  PV.ball.tint = p.overload > 0 ? 0xffe45c : (powCol || 0x7ffcf3);
  PV.ball.alpha = blinkA;

  // 球体贴合泛光（参考版 shadowBlur 26：沿球轮廓外扩发光）
  PV.ballBloom.visible = alive;
  PV.ballBloom.position.set(p.x, p.y);
  PV.ballBloom.scale.set(p.r * 1.55 / 30);
  PV.ballBloom.tint = p.overload > 0 ? 0xffe45c : (powCol || 0x5ffbf1);
  PV.ballBloom.alpha = 0.42 * blinkA;

  // 反应堆双环（正反转细环，替代原呼吸圈；过载时金色加速）
  const over = p.overload > 0;
  PV.reactor.visible = alive;
  PV.reactor.position.set(p.x, p.y);
  PV.reactor.rotation = state.time * (over ? 2.6 : 1.1);
  PV.reactor.scale.set((p.r + 5) / 57.6);
  PV.reactor.tint = mainCol;
  PV.reactor.alpha = (over ? 0.55 : 0.32) * blinkA;
  PV.reactor2.visible = alive;
  PV.reactor2.position.set(p.x, p.y);
  PV.reactor2.rotation = -state.time * (over ? 3.4 : 1.7);
  PV.reactor2.scale.set((p.r + 9) / 56);
  PV.reactor2.tint = mainCol;
  PV.reactor2.alpha = (over ? 0.45 : 0.22) * blinkA;

  PV.aim.visible = alive;
  PV.aim.position.set(p.x + Math.cos(p.angle) * (p.r + 6), p.y + Math.sin(p.angle) * (p.r + 6));
  PV.aim.rotation = p.angle;
  PV.aim.scale.set(0.9, 1);
  PV.aim.tint = mainCol;
  PV.aim.alpha = 0.35 * blinkA;
  // 瞄准端点小三角
  PV.aimTip.visible = alive;
  PV.aimTip.position.set(p.x + Math.cos(p.angle) * (p.r + 64), p.y + Math.sin(p.angle) * (p.r + 64));
  PV.aimTip.rotation = p.angle + Math.PI / 2;
  PV.aimTip.scale.set(0.3);
  PV.aimTip.tint = mainCol;
  PV.aimTip.alpha = 0.4 * blinkA;

  // 反弹层
  const sp = Math.hypot(p.vx, p.vy);
  const back = sp > 30 ? Math.atan2(p.vy, p.vx) + Math.PI : p.angle + Math.PI;
  for(let i = 0; i < PV.reb.length; i++){
    const s = PV.reb[i];
    const on = i < p.rebound;
    s.visible = alive && on;
    if(!on) continue;
    const dist = p.r + 10 + i * 7 + (Math.sin(state.time * 9) + 1) * 2;
    s.position.set(p.x + Math.cos(back) * dist, p.y + Math.sin(back) * dist);
    s.rotation = back + Math.PI / 2;
    s.scale.set(0.5);
    s.tint = 0xffb347;
    s.alpha = (0.5 - i * 0.12) * blinkA;
  }

  // 护盾（旋转六边形细边 + 层数卫星点）
  PV.shieldRing.visible = alive && p.shield > 0;
  if(p.shield > 0){
    PV.shieldRing.texture = TEX.hex;
    PV.shieldRing.position.set(p.x, p.y);
    PV.shieldRing.rotation = state.time * 0.8;
    PV.shieldRing.scale.set((p.r + 12) / 42);
    PV.shieldRing.tint = 0x7fb8ff;
    PV.shieldRing.alpha = 0.75 * blinkA;
  }
  for(let i = 0; i < PV.shieldDots.length; i++){
    const s = PV.shieldDots[i];
    const on = i < p.shield;
    s.visible = alive && on;
    if(!on) continue;
    const sa = state.time * 2 + i * Math.PI;
    s.position.set(p.x + Math.cos(sa) * (p.r + 11), p.y + Math.sin(sa) * (p.r + 11));
    s.scale.set(6 / 64);
    s.tint = 0x7fb8ff;
    s.alpha = 0.9;
  }

  // 过载环（对齐参考版：实心圆环 + 呼吸半径）
  PV.overRing.visible = alive && p.overload > 0;
  if(p.overload > 0){
    PV.overRing.texture = TEX.ring;
    PV.overRing.position.set(p.x, p.y);
    PV.overRing.scale.set((p.r + 9 + Math.sin(state.time * 8) * 2) * 2.2 / 128);
    PV.overRing.rotation = 0;
    PV.overRing.tint = 0xffe45c;
    PV.overRing.alpha = 0.6 * blinkA;
  }

  // 强化环：剩余时间圆弧（对齐参考版 arc 画法，逐帧 Graphics 描边）
  PV.powRing.visible = false;
  ggrid.clear();
  if(state.mode !== 'title' && state.mode !== 'dead' && player.power > 0 && player.powerType){
    const k = clamp(player.power / player.powerMax, 0, 1);
    ggrid.arc(player.x, player.y, player.r + 15, -Math.PI / 2, -Math.PI / 2 + TAU * k)
         .stroke({ width: 1.2, color: POWER_INFO[player.powerType].color, alpha: 0.85 });
  }

  // 强化碎片（仍用精灵，跟随球体）
  const hasPow = p.power > 0 && !!powCol;
  for(let i = 0; i < PV.shards.length; i++){
    const s = PV.shards[i];
    const on = hasPow;
    s.visible = alive && on;
    if(!on) continue;
    const sa = state.time * 3 + i * TAU / 3;
    s.position.set(p.x + Math.cos(sa) * 34, p.y + Math.sin(sa) * 34);
    s.scale.set(7 / 64);
    s.tint = powCol;
    s.alpha = 0.95;
  }

  // 球心旋转十字
  const vspd = Math.hypot(p.vx, p.vy);
  PV.spin.visible = alive;
  PV.spin.position.set(p.x, p.y);
  PV.spin.rotation = state.time * 1.6 + vspd * 0.012;
  PV.spin.scale.set(p.r * 1.5 / 64);
  PV.spin.tint = 0xffffff;
  PV.spin.alpha = 0.7 * blinkA;

  // 冲刺充能环（冷却中显示）
  const dashMax = Math.max(0.01, CFG.dashCd * M.dashCd);
  const chargeK = clamp(1 - p.dashCd / dashMax, 0, 1);
  PV.charge.visible = alive && chargeK < 0.999;
  if(chargeK < 0.999){
    PV.charge.position.set(p.x, p.y);
    PV.charge.rotation = -Math.PI / 2 + chargeK * TAU;
    PV.charge.scale.set((p.r + 5) * 2.2 / 128);
    PV.charge.tint = 0x7fb8ff;
    PV.charge.alpha = 0.5;
  }

  // 高速尾迹线
  const lk = clamp((vspd - 240) / 420, 0, 1);
  const backA = Math.atan2(p.vy, p.vx) + Math.PI;
  for(let i = 0; i < PV.lines.length; i++){
    const o = PV.lines[i];
    const on = alive && lk > 0.05;
    o.visible = on;
    if(!on) continue;
    const dist = p.r + 8 + i * 10 + Math.sin(state.time * 18 + i * 2) * 3;
    o.texture = TEX.streak;
    o.position.set(p.x + Math.cos(backA) * dist, p.y + Math.sin(backA) * dist);
    o.rotation = backA;
    o.scale.set((26 + i * 12) * lk / 64, (0.06 + (4.2 - i * 1.2) / 64) * lk);
    o.tint = mainCol;
    o.alpha = 0.52 * lk * blinkA;
  }
}

// ---------------- HUD ----------------
const HT = {};
const HS = {};
function buildHUD(){
  hudG = new Pixi.Graphics();
  hudLayer.addChild(hudG);

  // 血条扫光
  HS.sheen = new Pixi.Sprite(TEX.glow);
  HS.sheen.anchor.set(0.5);
  HS.sheen.blendMode = 'add';
  HS.sheen.alpha = 0;
  hudLayer.addChild(HS.sheen);

  // 渐变条填充（原版 = createLinearGradient + shadowBlur，这里烘焙成贴图）
  HS.barHP = new Pixi.Sprite(TEX.barHP); HS.barHP.anchor.set(0, 0.5); hudLayer.addChild(HS.barHP);
  HS.barEN = new Pixi.Sprite(TEX.barEN); HS.barEN.anchor.set(0, 0.5); hudLayer.addChild(HS.barEN);
  HS.barXP = new Pixi.Sprite(TEX.barXP); HS.barXP.anchor.set(0, 0.5); hudLayer.addChild(HS.barXP);

  // 霓虹辉光池（垫在文字/血条下方，替代 shadowBlur）
  HS.glow = [];
  for(let i = 0; i < 16; i++){
    const g = new Pixi.Sprite(TEX.glow);
    g.anchor.set(0.5);
    g.blendMode = 'add';
    g.visible = false;
    hudLayer.addChild(g);
    HS.glow.push(g);
  }

  // 技能格（每个键一张烘焙贴图）
  HS.skBox = [];
  for(let i = 0; i < 4; i++){
    const s = new Pixi.Sprite(TEX.skJ);
    s.anchor.set(0.5);
    hudLayer.addChild(s);
    HS.skBox.push(s);
  }
  HS.skOn = new Pixi.Sprite(TEX.skOn);
  HS.skOn.anchor.set(0.5);
  HS.skOn.visible = false;
  hudLayer.addChild(HS.skOn);

  // 小地图雷达横扫
  HS.sweep = new Pixi.Sprite(TEX.tether);
  HS.sweep.anchor.set(0, 0.5);
  HS.sweep.blendMode = 'add';
  HS.sweep.visible = false;
  hudLayer.addChild(HS.sweep);

  const mk = (size, align = 'left', weight = '700') => {
    const t = new Pixi.Text({ text: '', style: { fontFamily: '"Courier New", monospace', fontSize: size, fontWeight: weight, fill: 0xffffff } });
    t.anchor.set(align === 'right' ? 1 : align === 'center' ? 0.5 : 0, 0);
    hudLayer.addChild(t);
    return t;
  };
  HT.hp = mk(12); HT.en = mk(10); HT.lv = mk(12); HT.cards = mk(10);
  HT.score = mk(28, 'right'); HT.wave = mk(13, 'right'); HT.foe = mk(11, 'right');
  HT.combo = mk(30, 'center'); HT.power = mk(12); HT.boss = mk(11, 'center');
  HT.shield = mk(11); HT.rebound = mk(11); HT.boost = mk(11);
  for(const k in HT) HT[k].resolution = 2;
  // 少量阴影：真实 dropShadow（参考版靠 shadowBlur 做霓虹），只给需要发光的几处
  neon(HT.score, 0x5ffbf1, 18);
  neon(HT.combo, 0xffe45c, 22);
  neon(HT.boss, 0xff2fd0, 12);
}

// 少量阴影：Pixi Text 自带 dropShadow（distance 0 = 对称辉光），替代参考版的 shadowBlur
function neon(t, color, blur){
  if(!t) return t;
  t.style.dropShadow = { color, alpha: 0.85, blur, distance: 0, angle: 0 };
  return t;
}

// 辉光工具（替代原版 shadowBlur）
function glowAt(i, cx, cy, w, h, color, strength){
  const g = HS.glow && HS.glow[i];
  if(!g) return;
  g.visible = strength > 0.002;
  g.position.set(cx, cy);
  g.scale.set(Math.max(0.02, w / 64), Math.max(0.02, h / 64));
  g.tint = color;
  g.alpha = strength;
}
function glowText(i, t, color, strength){
  if(!t || !t.visible || !t.text){
    const g = HS.glow && HS.glow[i];
    if(g) g.visible = false;
    return;
  }
  const w = Number.isFinite(t.width) ? Math.max(12, t.width) : 64;
  const fs = (t.style && t.style.fontSize) || 14;
  const ax = (t.anchor && t.anchor.x) || 0;
  const cx = t.x + (ax === 1 ? -w / 2 : ax === 0.5 ? 0 : w / 2);
  glowAt(i, cx, t.y + fs * 0.55, w * 1.4, fs * 2.0, color, strength);
}

function drawHUD(){
  const pad = 22;
  const p = player;
  hudG.clear();
  for(const g of HS.glow) g.visible = false;

  const bw = Math.min(300, W * 0.32);
  // ---- 生命条（渐变贴图 + 辉光 + 刻度，复刻原版 bar） ----
  const hpk = clamp(p.hp / p.maxHp, 0, 1);
  hudG.roundRect(pad, pad, bw, 16, 8).fill({ color: 0xffffff, alpha: 0.08 }).stroke({ width: 1, color: 0xffffff, alpha: 0.15 });
  for(let i = 1; i < 4; i++){
    hudG.moveTo(pad + bw * i / 4, pad + 3).lineTo(pad + bw * i / 4, pad + 13).stroke({ width: 1, color: 0xffffff, alpha: 0.14 });
  }
  HS.barHP.visible = hpk > 0.015;
  HS.barHP.position.set(pad, pad + 8);
  HS.barHP.scale.set(Math.max(2, bw * hpk) / 128, 1);
  HS.barHP.alpha = 0.97;
  glowAt(0, pad + bw * hpk * 0.5, pad + 8, bw * hpk * 1.12, 32, 0xff2d55, 0.30);
  HT.hp.text = `HP  ${Math.ceil(p.hp)} / ${Math.round(p.maxHp)}`;
  HT.hp.position.set(pad + 8, pad + 2);
  HT.hp.style.fill = 0xdcdcdc;
  if(HS.sheen){
    const k = (state.time * 0.3) % 1;
    HS.sheen.position.set(pad + bw * k, pad + 8);
    HS.sheen.scale.set(46 / 64, 17 / 64);
    HS.sheen.rotation = 0;
    HS.sheen.tint = 0xffffff;
    HS.sheen.alpha = 0.16 * Math.sin(k * Math.PI) * clamp(hpk, 0.2, 1);
  }

  // ---- 能量条 ----
  const ey = pad + 24;
  const enk = clamp(p.energy / p.maxEnergy, 0, 1);
  hudG.roundRect(pad, ey, bw * 0.82, 11, 6).fill({ color: 0xffffff, alpha: 0.08 });
  for(let i = 1; i < 5; i++){
    hudG.moveTo(pad + bw * 0.82 * i / 5, ey + 2).lineTo(pad + bw * 0.82 * i / 5, ey + 9).stroke({ width: 1, color: 0xffffff, alpha: 0.12 });
  }
  HS.barEN.visible = enk > 0.015;
  HS.barEN.position.set(pad, ey + 5.5);
  HS.barEN.scale.set(Math.max(2, bw * 0.82 * enk) / 128, 11 / 16);
  HS.barEN.alpha = 0.95;
  glowAt(1, pad + bw * 0.82 * enk * 0.5, ey + 5.5, bw * 0.82 * enk * 1.12, 22, 0x5ffbf1, 0.26);
  HT.en.text = `ENERGY  ${Math.floor(p.energy)}`;
  HT.en.style.fill = 0xb3f5f5;
  HT.en.position.set(pad + 6, ey + 1);

  // ---- 等级 / 经验（菱形徽标 + 经验条） ----
  const ly = pad + 40;
  const xpk = clamp(state.xp / state.xpNeed, 0, 1);
  const dx0 = pad + 7, dy0 = ly + 3.5;
  hudG.moveTo(dx0, dy0 - 5).lineTo(dx0 + 5, dy0).lineTo(dx0, dy0 + 5).lineTo(dx0 - 5, dy0)
    .closePath().stroke({ width: 1.2, color: 0xffe45c, alpha: 0.85 });
  hudG.roundRect(pad + 16, ly, 104, 7, 3.5).fill({ color: 0xffffff, alpha: 0.08 });
  HS.barXP.visible = xpk > 0.015;
  HS.barXP.position.set(pad + 16, ly + 3.5);
  HS.barXP.scale.set(Math.max(2, 104 * xpk) / 128, 7 / 16);
  HS.barXP.alpha = 0.95;
  glowAt(2, pad + 16 + 52 * Math.max(xpk, 0.06), ly + 3.5, 104 * Math.max(xpk, 0.06) + 26, 16, 0xffa73d, 0.16);
  HT.lv.text = `LV ${state.level}`;
  HT.lv.style.fill = 0xffe45c;
  HT.lv.position.set(pad + 128, ly - 5);

  // ---- 状态行 ----
  let sy = ly + 14;
  HT.shield.text = p.shield > 0 ? `◈ 护盾 ×${p.shield}` : '';
  HT.shield.style.fill = 0x7fb8ff;
  HT.shield.position.set(pad + 2, sy);
  sy += 14;
  HT.rebound.text = p.rebound > 0 ? `⚡ 反弹 ×${p.rebound}` : '';
  HT.rebound.style.fill = 0xffb347;
  HT.rebound.position.set(pad + 2, sy);
  sy += 14;
  if(state.cards.length){
    const last = state.cards[state.cards.length - 1];
    HT.cards.text = `卡牌 ${state.cards.length} · 上级 ${TIER_NAME[last.t]}`;
    HT.cards.style.fill = last.c;
    HT.cards.position.set(pad + 2, sy);
  } else HT.cards.text = '';

  // 强化状态
  if(p.power > 0 && p.powerType){
    const info = POWER_INFO[p.powerType];
    const wy = sy + 18;
    const k = p.power / p.powerMax;
    hudG.roundRect(pad, wy, 130, 22, 6).fill({ color: 0x0a0e1a, alpha: 0.85 }).stroke({ width: 1.5, color: info.color, alpha: 0.95 });
    HT.power.text = `${info.name}  ${p.power.toFixed(1)}s`;
    HT.power.style.fill = info.color;
    HT.power.position.set(pad + 9, wy + 5);
    hudG.roundRect(pad, wy + 19, 130 * k, 3, 1.5).fill({ color: info.color, alpha: 0.5 });
    glowAt(3, pad + 65, wy + 11, 164, 36, info.color, 0.14);
  } else HT.power.text = '';

  // 分数
  HT.score.text = String(state.score).padStart(6, '0');
  HT.score.style.fill = 0x5ffbf1;
  HT.score.position.set(W - pad, pad - 4);
  const scw = HT.score.width || 0;
  hudG.moveTo(W - pad - scw, pad + 28).lineTo(W - pad, pad + 28).stroke({ width: 1, color: 0x5ffbf1, alpha: 0.4 });
  hudG.moveTo(W - pad - scw - 14, pad + 24).lineTo(W - pad - scw - 9, pad + 28).lineTo(W - pad - scw - 14, pad + 32).lineTo(W - pad - scw - 19, pad + 28)
    .closePath().stroke({ width: 1, color: 0x5ffbf1, alpha: 0.5 });
  HT.wave.text = `WAVE ${state.wave}`;
  HT.wave.style.fill = 0xffffff;
  HT.wave.position.set(W - pad, pad + 30);
  HT.foe.text = `残敌 ${enemies.length + state.spawnQueue.length}`;
  HT.foe.style.fill = 0x9fb0c8;
  HT.foe.position.set(W - pad, pad + 48);

  // ---- 连击（带倒计时环） ----
  if(state.combo > 1){
    const heat = clamp(state.combo / 30, 0, 1);
    HT.combo.text = `×${state.combo} COMBO`;
    HT.combo.style.fontSize = 30 + heat * 16;
    const ccombo = heat > 0.6 ? 0xff7a3d : 0xffe45c;
    if(HT.combo.style.fill !== ccombo){
      HT.combo.style.fill = ccombo;
      if(HT.combo.style.dropShadow) HT.combo.style.dropShadow.color = ccombo;
    }
    HT.combo.position.set(W / 2, 30);
    const kTim = clamp(state.comboTimer / (3 + M.comboKeep), 0, 1);
    hudG.arc(W / 2, 48, 76, -Math.PI / 2, -Math.PI / 2 + TAU * kTim)
        .stroke({ width: 1.5, color: ccombo, alpha: 0.45 });
  } else HT.combo.text = '';

  // ---- 波次提示（已改为世界内小字浮标，不再有全屏横幅/扫光） ----

  // ---- 技能条（烘焙格子 + 冷却扇形 + 霓虹键位） ----
  const skills = [
    { key: 'J', name: '射击', cd: 0, max: 0, c: 0x5ffbf1 },
    { key: 'K', name: '冲刺', cd: p.dashCd, max: CFG.dashCd * M.dashCd, c: 0x7fb8ff },
    { key: 'H', name: '修复', cd: p.healCd, max: 3.5, c: 0x5affc8 },
    { key: 'SPC', name: '过载', cd: p.overload > 0 ? -1 : 0, max: 0, c: 0xffe45c }
  ];
  const skTex = [TEX.skJ, TEX.skK, TEX.skH, TEX.skS];
  const size = 46;
  const syy = H - size - 22;
  let skOnShown = false;
  for(let i = 0; i < 4; i++){
    const s = skills[i];
    const cxs = sx0(i) + size / 2, cys = syy + size / 2;
    const box = HS.skBox[i];
    box.texture = skTex[i];
    box.visible = true;
    box.position.set(cxs, cys);
    box.scale.set(size / 96);
    box.alpha = s.cd > 0 ? 0.4 : 1;
    const skGlow = s.cd === -1 ? 0.30 + 0.14 * Math.sin(state.time * 10)
      : s.cd > 0 ? 0.05 : 0.16;
    glowAt(9 + i, cxs, cys, size * 2.4, size * 2.4, s.c, skGlow);
    if(s.cd === -1){
      HS.skOn.visible = true;
      HS.skOn.position.set(cxs, cys);
      HS.skOn.scale.set(size / 96);
      HS.skOn.alpha = 0.16 + 0.16 * Math.sin(state.time * 10);
      skOnShown = true;
    }
    if(s.cd > 0 && s.max > 0){
      hudG.moveTo(cxs, cys);
      hudG.arc(cxs, cys, size, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(s.cd / s.max, 0, 1));
      hudG.closePath().fill({ color: 0x000000, alpha: 0.55 });
    }
  }
  if(!skOnShown) HS.skOn.visible = false;

  textHUD.skills.forEach((t, i) => {
    const s = skills[i];
    t.text = s.key;
    t.style.fill = s.c;
    t.position.set(sx0(i) + size / 2, syy + size / 2 - 12);
    t.visible = true;
    textHUD.skillsName[i].text = s.name;
    textHUD.skillsName[i].style.fill = 0x9fb0c8;
    textHUD.skillsName[i].position.set(sx0(i) + size / 2, syy + size / 2 + 4);
    textHUD.skillsName[i].visible = true;
    const cdT = textHUD.skillsCd && textHUD.skillsCd[i];
    if(cdT){
      if(s.cd > 0){
        cdT.text = s.cd.toFixed(1);
        cdT.style.fill = 0xffffff;
        cdT.position.set(sx0(i) + size / 2, syy + size / 2 - 6);
        cdT.visible = true;
      } else cdT.visible = false;
    }

  drawMinimap();

}

  hudG.moveTo(mx - 5, my - 5 + bl).lineTo(mx - 5, my - 5).lineTo(mx - 5 + bl, my - 5)
    .moveTo(mx + mw + 5 - bl, my - 5).lineTo(mx + mw + 5, my - 5).lineTo(mx + mw + 5, my - 5 + bl)
    .moveTo(mx - 5, my + mh + 5 - bl).lineTo(mx - 5, my + mh + 5).lineTo(mx - 5 + bl, my + mh + 5)

  hudG.ellipse(mx + mw / 2, my + mh / 2, mw * 0.32, mh * 0.32).stroke({ width: 1, color: 0x5ffbf1, alpha: 0.12 });
  hudG.ellipse(mx + mw / 2, my + mh / 2, mw * 0.48, mh * 0.48).stroke({ width: 1, color: 0x5ffbf1, alpha: 0.08 });
  // 雷达横扫
  if(HS.sweep){
    HS.sweep.visible = true;
    HS.sweep.texture = TEX.tether;
    HS.sweep.position.set(mx + mw / 2, my + mh / 2);
    HS.sweep.rotation = state.time * 1.5;
    HS.sweep.scale.set(mw * 0.92 / 64, mh * 0.9 / 16);
    HS.sweep.tint = 0x9ff6ff;
    HS.sweep.alpha = 0.22;
  }
  const sx = mw / world.w, sy = mh / world.h;
  hudG.rect(mx + cam.x * sx, my + cam.y * sy, (W / cam.zoom) * sx, (H / cam.zoom) * sy)
       .stroke({ width: 1, color: 0xffffff, alpha: 0.22 });
  for(const u of pickups){
    const cc = u.kind === 'heal' ? 0x5affc8 : u.kind === 'shield' ? 0x7fb8ff : u.kind === 'power' ? 0xffe45c : 0x5ffbf1;
    hudG.rect(mx + u.x * sx - 1.5, my + u.y * sy - 1.5, 3, 3).fill({ color: cc, alpha: 0.8 });
  }
  for(const s of storms){
    hudG.circle(mx + s.x * sx, my + s.y * sy, 3.2).fill({ color: 0xff8c28, alpha: 0.85 });
  }
  for(const e of enemies){
    hudG.circle(mx + e.x * sx, my + e.y * sy, e.type === 'boss' ? 4.5 : 2.6).fill({ color: e.color, alpha: 0.95 });
  }
  hudG.circle(mx + player.x * sx, my + player.y * sy, 3.4).fill({ color: 0xffffff, alpha: 1 });
}

function drawBossBar(){
  const b = enemies.find(e => e.type === 'boss');
  if(!b){ HT.boss.text = ''; return; }
  const bw = Math.min(420, W * 0.5), bx = W / 2 - bw / 2, by = H - 98;
  hudG.roundRect(bx, by, bw, 16, 8).fill({ color: 0x0a0614, alpha: 0.75 });

  hudG.roundRect(bx, by, bw, 16, 8).stroke({ width: 1.5, color: 0xff2fd0, alpha: 0.7 });

  for(let i = 1; i < 10; i++){

function updateMarkers(){
  let n = 0;
  if(state.mode !== 'playing' && state.mode !== 'cards'){
    for(const m of MARKERS) m.visible = false;
    return;
  }
  const pad = 34;
  const hw = W / 2 - pad, hh = H / 2 - pad;
  for(const e of enemies){
    if(n >= MARKERS.length) break;
    const sx = (e.x - cam.x) * cam.zoom;
    const sy = (e.y - cam.y) * cam.zoom;
    if(sx > pad && sx < W - pad && sy > pad && sy < H - pad) continue;
    const dxs = sx - W / 2, dys = sy - H / 2;
    const t = Math.min(hw / (Math.abs(dxs) || 1e-6), hh / (Math.abs(dys) || 1e-6));
    const px = W / 2 + dxs * t, py = H / 2 + dys * t;
    const m = MARKERS[n++];
    m.visible = true;
    m.position.set(px, py);
    m.rotation = Math.atan2(dys, dxs) + Math.PI / 2;
    m.scale.set(e.type === 'boss' ? 0.75 : 0.45);
    m.tint = e.color;
    m.alpha = e.type === 'boss' ? 0.95 : 0.5 + 0.25 * Math.sin(state.time * 6 + e.wob);
  }
  for(let i = n; i < MARKERS.length; i++) MARKERS[i].visible = false;
}

function applyCardHighlight(){
  for(const it of CARD_UI){
    const on = it.i === state.sel;
    const tc = it.col, dc = it.dc;
    const w = it.w, h = it.h;
    const g = it.g;
    g.clear();
    // 面板：深色底 + 品质色描边（对齐参考版技能格的霓虹观感）
    g.roundRect(0, 0, w, h, 12)
      .fill({ color: 0x0a0e1a, alpha: on ? 0.94 : 0.86 })
      .stroke({ width: on ? 2.4 : 1.2, color: tc, alpha: on ? 0.95 : 0.38 });
    // 顶部品质带（上半圆角 + 下半补方）
    g.roundRect(0, 0, w, 32, 12).fill({ color: tc, alpha: on ? 0.20 : 0.09 });
    g.rect(0, 16, w, 16).fill({ color: tc, alpha: on ? 0.20 : 0.09 });
    g.moveTo(0, 32.5).lineTo(w, 32.5).stroke({ width: 1, color: tc, alpha: on ? 0.55 : 0.22 });
    // 品质带右端菱形
    g.moveTo(w - 22, 9).lineTo(w - 15, 16).lineTo(w - 22, 23).lineTo(w - 29, 16)
      .closePath().fill({ color: tc, alpha: on ? 0.9 : 0.35 });
    // 左侧卡色条
    g.rect(0, 42, 3, h - 128).fill({ color: dc, alpha: on ? 0.95 : 0.4 });
    // 描述区与底部分隔线
    g.moveTo(14, h - 92).lineTo(w - 14, h - 92).stroke({ width: 1, color: 0xffffff, alpha: on ? 0.14 : 0.07 });
    // 副作用警示条
    if(it.side){
      g.roundRect(12, h - 84, w - 24, 42, 6)
        .fill({ color: 0xff2d55, alpha: on ? 0.13 : 0.08 })
        .stroke({ width: 1, color: 0xff6b8f, alpha: on ? 0.55 : 0.3 });
    }
    // 四角括号
    const bl = 15, bi = 7;
    g.moveTo(bi, bi + bl).lineTo(bi, bi).lineTo(bi + bl, bi)
      .moveTo(w - bi - bl, bi).lineTo(w - bi, bi).lineTo(w - bi, bi + bl)
      .moveTo(bi, h - bi - bl).lineTo(bi, h - bi).lineTo(bi + bl, h - bi)
      .moveTo(w - bi - bl, h - bi).lineTo(w - bi, h - bi).lineTo(w - bi, h - bi - bl)
      .stroke({ width: on ? 2.4 : 1.4, color: tc, alpha: on ? 1 : 0.3 });
    it.hint.text = on ? `▶ [ ${it.i + 1} ]` : `[ ${it.i + 1} ]`;
    it.hint.style.fill = on ? tc : 0x5d6b7d;
    if(it.ring) it.ring.alpha = on ? 0.85 : 0;
  }
}

    hit.cursor = 'pointer';
    hit.on('pointertap', () => pickOffer(i));
    hit.on('pointerover', () => { state.sel = i; applyCardHighlight(); });
    holder.addChild(hit);

    CARD_UI.push({ i, col: tc, dc, g, glow, holder, hint: hintT, ring, side: !!o.def.s,
      w: CW, h: CH, cx, baseY: cy, born: state.time + i * 0.08, curScale: 1 });
    CARD_RECTS.push({ x: cx, y: cy, w: CW, h: CH, i });
  });

  cardUI.scale.set(scale);
  if(scale < 1) cardUI.position.set((W - W * scale) / 2, (H - H * scale) / 2);
  applyCardHighlight();
}

}
